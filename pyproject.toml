[project]
name = "generalforecast"
version = "0.2.10"
description = "Python SDK and gf CLI for General Forecast: contexts, experiments and predictors on structured data foundation models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "General Forecast, Inc." }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "certifi>=2024.2.2",
    "httpx==0.28.1",
    "numpy>=2.5.3",
    "pandas>=2.2",
    "pyarrow>=24",
]

[project.optional-dependencies]
polars = ["polars>=1.30,<2"]

[project.scripts]
gf = "generalforecast.cli:main"

[project.urls]
Homepage = "https://generalforecast.com"
Documentation = "https://docs.generalforecast.com"
Repository = "https://github.com/generalforecast/generalforecast-sdk-python"
Issues = "https://github.com/generalforecast/generalforecast-sdk-python/issues"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "pyyaml>=6.0.2",
    "ruff==0.16.10",
    "scikit-learn>=1.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generalforecast"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/api", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# The README quickstart is the spec's notebook example, laid out as written.
extend-exclude = ["README.md"]

[tool.ruff.lint]
extend-select = ["B", "D", "I", "RUF", "UP"]
# D100, D104: module and package docstrings.
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"api/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
