name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs these checks before it builds.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: The generated API types match api/openapi.yaml
        run: uv run python api/generate.py --check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev
      - run: uv run pytest

  typescript:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test

  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv build
      - name: The wheel is pure Python
        run: |
          wheel=$(ls dist/*.whl)
          case "$wheel" in *-py3-none-any.whl) ;; *) echo "not a pure wheel: $wheel"; exit 1 ;; esac
          if unzip -l "$wheel" | grep -E '\.(so|pyd|dylib|dll)$'; then exit 1; fi
      - name: The wheel installs and runs gf
        run: |
          uv venv /tmp/wheel
          uv pip install --python /tmp/wheel/bin/python dist/*.whl
          /tmp/wheel/bin/gf --help
          /tmp/wheel/bin/gf --version
          /tmp/wheel/bin/python -c "import generalforecast as gf; gf.Client, gf.Predictor, gf.Classifier"
