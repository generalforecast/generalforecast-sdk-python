          items: {type: string, enum: [google, microsoft, github]}
        enabled: {type: boolean}
        configured: {type: boolean, description: whether the server can sign anyone in}
        membership_required: {type: boolean, const: true}

    SsoReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Sso"}

    SsoConfigure:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: {type: boolean}

    SsoConfigureRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/SsoConfigure"}

    AuditEvent:
      type: object
      required: [sequence, at, actor, project, action, target, outcome]
      additionalProperties: false
      properties:
        sequence: {type: integer, minimum: 1}
        at: {type: number}
        actor: {type: string}
        project: {$ref: "#/components/schemas/Name"}
        action: {type: string}
        target: {type: string}
        outcome: {type: string}

    AuditLog:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
