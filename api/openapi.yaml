components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: an API key from `gf keys create`, or the login token `gf login` keeps

  parameters:
    project:
      name: project
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
      description: the project; `gf whoami` shows the one in use
    predictor:
      name: name
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
      description: the predictor's name
    environment:
      name: environment
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
    prefer:
      name: Prefer
      in: header
      required: false
      schema: {type: string, example: "respond-async, wait=20"}
      description: |
        `respond-async, wait=N` (RFC 7240) asks the hosted plane to accept a
        prediction it has not answered within `N` seconds (1 to 25, 20 when
        left out) and answer `202` with the prediction to poll, rather than
        hold the request open while hosted inference starts. Without
        `respond-async` the request is held until its answer. `gf serve`
        answers every prediction in the request and ignores it.
    prediction:
      name: id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/PredictionId"}
      description: the prediction's id, from the `Location` of its `202`
    key:
      name: key
      in: path
      required: true
      schema: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}
    run:
      name: run
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RunRef'
    snapshot:
      name: snapshot
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Name'
    batch:
      name: name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SyntheticBatchName'
      description: the synthetic batch's name
    secret:
      name: secret
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
    context:
      name: name
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
      description: the live context's name
    source:
      name: source
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
      description: a pin's `source_id`
    model:
      name: model
      in: path
      required: true
      schema:
        oneOf:
          - {$ref: "#/components/schemas/ModelName"}
          - {$ref: "#/components/schemas/FineTuneName"}
      description: |
        a catalog model's name without its `general-forecast/` prefix, such
        as `tabicl-v2-classifier`; one of the project's fine-tunes by its
        name, such as `credit-default`, for its latest version and every
        version; or one version as `<name>@ft<version>`, such as
        `credit-default@ft3`. A path segment holds no `/`, so a fine-tune's
        owner is the path's project. A fine-tune's name matches `ModelName`
        too: no fine-tune takes a catalog model's name, and a catalog name
        reads the catalog model

    workspace:
      name: workspace
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
      description: the workspace's id, `ws-` and 16 hex digits for one made on sign-up
    join_request:
      name: id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/JoinRequestId"}
    invitation:
      name: id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/InvitationId"}
    waitlist_entry:
      name: id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/WaitlistId"}
    experiment:
      name: name
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Name"
      description: "the experiment's name"
    number:
      name: number
      in: path
      required: true
      schema: {type: integer, minimum: 1}
      description: "a run's or revision's number"
    version:
      name: version
      in: path
      required: true
      schema: {type: integer, minimum: 1}
      description: a context version

  responses:
    Accepted:
      description: |
        hosted, or a server given an accepted timeout: the prediction is
        accepted and still starting or running; poll its `Location` after
        `Retry-After` seconds
      headers:
        Location:
          description: the prediction to poll, `/v1/projects/{project}/predictions/{id}`
          schema: {type: string}
        Retry-After:
          description: seconds before polling again, 5 or the pool's longer wait, at most 30
          schema: {type: integer, minimum: 1, maximum: 30}
        Preference-Applied:
          description: "`respond-async`, on the accept"
          schema: {type: string}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PredictionAccepted"
          examples:
            accepted:
              x-gf-hosted: true
              value:
                api_version: gf/v1
                project: acme
                request_id: r-3abb2401f119428db148927c6a0d358c
                resource: {kind: prediction, name: pred-0123456789abcdef01234567}
                result:
                  id: pred-0123456789abcdef01234567
                  state: starting
                  created: 1761200000
                  retry_after: 5
    NotReady:
      description: a served model is still loading or compiling
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            loading:
              value:
                api_version: gf/v1
                project: acme
                request_id: r-9e0f1a2b3c4d5e6f708192a3b4c5d6e7
                resource: {kind: predictor, name: churn}
                error:
                  code: ModelNotReady
                  message: general-forecast/tabicl-v2-classifier is compiling 12 programs
                  hint: poll /readyz until it answers 200

  schemas:
    Name:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}$"
      description: a resource name

    ModelName:
      type: string
      pattern: "^[a-z0-9][a-z0-9.-]{0,62}$"
      description: |
        a catalog model's name, its id without `general-forecast/`, such as
        `tabpfn-3.5-classifier`; unlike a chosen resource name it may start
        with a digit and hold dots

    RunModel:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}/[a-z][a-z0-9-]{0,62}@ft[1-9]\\d*$"
      description: |
        the model a run publishes, `<project>/<name>@ft<version>`, which
        names the run too: the fine-tune it trains and the version it
        publishes, as the catalog and a predictor's `model` name that version

    RunRef:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}(?:@ft[1-9]\\d*)?$"
      description: |
        a run by its `model` without the project, which the path names,
        `credit-default@ft2`, or a fine-tune's name alone, `credit-default`,
        for the name's latest run

    FineTuneName:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}@ft[1-9]\\d*$"
      description: |
        a project's fine-tune version by its name and version, as
        `credit-default@ft3` names `<project>/credit-default@ft3`

    ModelId:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}/[a-z0-9][a-z0-9.-]{0,62}(?:@ft[1-9]\\d*)?(?:@sha256:[0-9a-f]{64})?(?:@\\d+)?(?:\\*\\d+)?$"
      description: |
        a catalog model id, `general-forecast/<name>`, or a derived model's,
        `<owner>/<name>@ft<version>`; then an optional digest pin
        (`@sha256:<digest>`) and variant suffix (`@4*2`)

    Digest:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"

    Task:
      type: string
      enum: [classification, regression, forecast]

    ResourceKind:
      type: string
      enum: [predictor, model, project, api-key, secret, context, source, workspace, snapshot, run, prediction, experiment, estimate]

    Resource:
      type: object
      description: what the envelope is about; GET lists use the collection name
      required: [kind, name]
      additionalProperties: false
      properties:
        kind: {$ref: "#/components/schemas/ResourceKind"}
        name: {type: string, minLength: 1, maxLength: 63}

    Envelope:
      type: object
      description: the fields every request and reply carries
      required: [api_version, project, request_id, resource]
      properties:
        api_version: {type: string, const: gf/v1}
        project: {$ref: "#/components/schemas/Name"}
        request_id: {type: string, minLength: 1, maxLength: 128, pattern: "^[\\x20-\\x7e]+$"}
        resource: {$ref: "#/components/schemas/Resource"}

    ErrorCode:
      type: string
      enum: [ValidationError, NotFound, Unauthorized, CapacityExceeded, ModelNotReady, Internal, Conflict, Unsupported, PaymentRequired, AmbiguousReference, Unavailable]
      description: |
        ValidationError 422, NotFound 404, Unauthorized 401, CapacityExceeded
        422, ModelNotReady 503 (a model, or the runtime or pool serving it, is
        still loading, starting or compiling), Internal 500, Conflict 409 (a
        compare-and-swap on a stale generation), Unsupported 501 (an
        operation this server does not offer, such as a hosted route on gf
        serve), PaymentRequired 402 (the workspace's plan or credit does not
        cover the request), AmbiguousReference 422 (a short model name whose
        task nothing decides: pass `task`, or the full id), Unavailable 503
        or 504 (a service the request needs, such as a database, storage or
        a control plane, is down for now or did not answer in time).

        Every 503 carries `Retry-After`, and a client may retry it, as it
        may a 504. A code the server raises that is not in this enum is sent
        as the enum code it folds into, with the code itself, in snake case,
        as `reason`: `CredentialUnavailable` 503 is `Unavailable` with reason
        `credential_unavailable`.

        Hosted fine-tuning's gates, with their `reason`:
        `PaymentRequired` 402 `plan_required` (fine-tuning, and the resumable
        uploads and synthetic batches that feed it, need a Pro or Enterprise
        plan) and `credits_exhausted` (an enforced workspace has
        used its credits, which also refuses predictions);
        `Unauthorized` 403 `fine_tuning_unavailable` (fine-tuning is not
        turned on for the project);
        `CapacityExceeded` 429 `run_limit_reached` (the project has as many
        runs queued or running as it may), `quota_exceeded` (the project's
        training data would pass its quota) and `snapshot_quota_exceeded`.
        Those three 429s carry `limit` and `actual`, and lift only when the
        caller ends a run or deletes data, so clients do not retry them; a
        429 `rate_limited` passes on its own and may be retried.
        A run's create is refused with `Conflict` 409 `run_active` (another
        run of the fine-tune is still queued or running) or `base_mismatch`
        (the fine-tune's versions train from another base), and with
        `ValidationError` 422 `base_is_fine_tune` (a fine-tune sent as the
        base).

    Error:
      type: object
      description: |
        `param` names the payload field (`target`, `inputs.plan`, `queries`);
        every limit error carries `limit` and `actual` and names the model in
        `message`. The request id is in the envelope.
      required: [code, message]
      additionalProperties: false
      properties:
        code: {$ref: "#/components/schemas/ErrorCode"}
        message: {type: string}
        reason:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: |
            The finer reason behind `code`, when the service has one. A
            refused browser session says why with `reauthentication_required`,
            `link_confirmation_required`, `session_required` or
            `waitlist_required`; `ErrorCode` lists fine-tuning's.
        param: {type: string}
        hint: {type: string}
        limit: {type: integer}
        actual: {type: integer}

    ErrorReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [error]
          properties:
            error: {$ref: "#/components/schemas/Error"}

    Row:
      type: object
      description: one record; column names are keys, cells are scalars
      additionalProperties:
        type: [string, number, boolean, "null"]

    Inputs:
      type: object
      description: |
        inputs by rule rather than by list: `exclude` removes columns from the
        inferred set, `types` overrides inferred types; a forecaster's `past`
        and `future` are inputs whatever else is, and its other inputs are
        past covariates
      additionalProperties: false
      properties:
        exclude: {type: array, items: {type: string}}
        types:
          type: object
          additionalProperties: {$ref: "#/components/schemas/Kind"}
        past: {type: array, items: {type: string}}
        future: {type: array, items: {type: string}}

    ColumnType:
      type: string
      enum: [number, category, text, boolean, date, timestamp]

    Kind:
      type: string
      description: |
        a column's kind, the engine's vocabulary an ad hoc call's
        `inputs.types` takes: whole numbers, real numbers, 0/1 flags,
        categories, free text, dates and times, and booleans
      enum: [int, float, "0/1", category, text, timestamp, bool]

    Selection:
      type: object
      description: |
        which context rows a query sees; fractions below 1 are of the model's
        row cap, integers are rows; `core: null` is the whole table
      additionalProperties: false
      properties:
        core: {type: [number, "null"], default: 0.25}
        neighbors: {type: number, default: 0.75}
        kind: {type: string, enum: [stratified, random], default: stratified}
        recent: {type: [integer, "null"]}

    Manifest:
      type: object
      description: |
        the ad hoc predictor: a predictor's fields, with `context` as rows
        or by reference to a snapshot the service holds
        (`{"snapshot": "<digest>"}`, uploaded with `PUT /snapshots?digest=`),
        and `queries` as rows, or as the Arrow stream the request is.
        `exclude`, `types`, `past` and `future` take a predictor spec's
        forms beside `inputs`, or sit in `inputs` as `Inputs`, once. The
        target column decides a short model name's entry; there is no `task`
      required: [model, target, context, queries]
      additionalProperties: false
      properties:
        exclude: {type: array, items: {type: string}}
        types:
          type: object
          additionalProperties: {$ref: "#/components/schemas/ColumnType"}
        past: {type: array, items: {type: string}}
        future: {type: array, items: {type: string}}
        model:
          $ref: "#/components/schemas/ModelField"
          description: a full id, or a family's short name, which resolves for the task the target column calls for
        target: {type: string}
        id: {type: string}
        inputs:
          oneOf:
            - type: array
              items: {type: string}
            - $ref: "#/components/schemas/Inputs"
        time: {type: string}
        series: {type: array, items: {type: string}}
        related:
          description: |
            which series forecast jointly: `all`, or the series columns whose
            values name each group; every series forecasts on its own when
            left out
          oneOf:
            - {type: string, enum: [all]}
            - type: array
              items: {type: string}
        frequency:
          oneOf:
            - {type: string, pattern: "^[1-9][0-9]*(s|min|h|d|w)$"}
            - {type: number, exclusiveMinimum: 0}
          description: "`1d`, `1h`, `7d`, or seconds as a number"
        horizon: {type: integer, minimum: 1}
        quantiles:
          type: array
          items: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
          default: [0.1, 0.5, 0.9]
        outputs:
          type: array
          items: {type: string, enum: [label, value, probabilities, quantiles]}
          description: defaults by task; classification label+probabilities, regression value, forecast value+quantiles
        selection: {$ref: "#/components/schemas/Selection"}
        context:
          oneOf:
            - type: array
              items: {$ref: "#/components/schemas/Row"}
            - $ref: "#/components/schemas/SnapshotReference"
        queries:
          type: array
          items: {$ref: "#/components/schemas/Row"}
          minItems: 1

    SnapshotReference:
      type: object
      description: a context the service holds by its digest
      required: [snapshot]
      additionalProperties: false
      properties:
        snapshot: {$ref: "#/components/schemas/Digest"}

    Usage:
      type: object
      description: |
        what a call is billed: its scored rows, and past the large-context
        line (`large_context_cells` in the price book) the GPU seconds of its
        own execution. `calls` is the model calls the engine made to answer
        it, its result's `timing.calls`
      required: [rows, credits, usd]
      additionalProperties: false
      properties:
        calls: {type: integer, minimum: 0}
        rows: {type: integer, minimum: 0}
        credits: {type: number, minimum: 0}
        usd: {type: number, minimum: 0}
        gpu_seconds: {type: [number, "null"], minimum: 0}

    Timing:
      type: object
      description: |
        where a call's time went, queueing and cold start apart from compute;
        `compile_seconds` is the time its steps spent compiling or loading
        programs they waited on, which `compute_seconds`, its own execution,
        leaves out
      required: [calls, queued_seconds, cold_start_seconds, compute_seconds]
      additionalProperties: false
      properties:
        calls:
          type: integer
          minimum: 1
          description: |
            the model calls the engine made to answer the call: each step
            that answered it, counted once for every piece of the step's
            queries the device decoded that held some of this call's
        queued_seconds: {type: number, minimum: 0}
        cold_start_seconds: {type: number, minimum: 0}
        compile_seconds: {type: number, minimum: 0}
        compute_seconds: {type: number, minimum: 0}

    HeldSnapshot:
      type: object
      required: [digest, rows]
      additionalProperties: false
      properties:
        digest: {$ref: "#/components/schemas/Digest"}
        rows: {type: integer, minimum: 0}

    HeldSnapshotReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/HeldSnapshot"}

    ManifestRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/Manifest"}

    Queries:
      type: object
      description: |
        a predictor's payload: the queries, `as_of` for a live context, and
        `context` for a predictor whose lock takes its context with each
        request, which only gf serve serves. The environment is the route's
        `?env=`.
      required: [queries]
      additionalProperties: false
      properties:
        queries:
          type: array
          items: {$ref: "#/components/schemas/Row"}
          minItems: 1
        as_of: {$ref: "#/components/schemas/AsOfRequest"}
        context:
          type: array
          items: {$ref: "#/components/schemas/Row"}
          description: |
            the context rows of a predictor whose lock takes them with each
            request; any other predictor refuses them with `param:
            "context"` and the message `context is declared by the predictor`

    QueriesRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/Queries"}

    ContextKind:
      type: string
      enum: [snapshot, request, live]

    AsOfRequest:
      description: |
        for a live context, score against the rows accepted at or before this
        instant: an RFC 3339 time (one with no offset is UTC), or a number of
        seconds since the epoch. Anything else is a `ValidationError` whose
        `param` is `as_of`. A snapshot or request context refuses it the same
        way.
      oneOf:
        - {type: string, format: date-time}
        - {type: number, minimum: 0}

    AsOf:
      description: |
        an instant as every reply carries it: an RFC 3339 UTC string such as
        `2026-10-27T08:00:00Z`, or null
      oneOf:
        - {type: string, format: date-time, pattern: "Z$"}
        - {type: "null"}

    ContextInfo:
      type: object
      description: |
        the context a prediction actually used, the same shape from gf serve
        and the hosted platform. `source` is the context's kind; `name` names
        a live context; `version` is a live context's accepted sequence;
        `digest` is a snapshot's content digest; `rows` counts the rows read;
        `as_of` is the instant a live context was read as of. Each field a
        source does not have is null.
      required: [source, name, version, digest, rows, as_of]
      additionalProperties: false
      properties:
        source: {$ref: "#/components/schemas/ContextKind"}
        name:
          oneOf:
            - $ref: "#/components/schemas/Name"
            - type: "null"
        version: {type: [integer, "null"], minimum: 0}
        digest:
          oneOf:
            - $ref: "#/components/schemas/Digest"
            - type: "null"
        rows: {type: integer, minimum: 0}
        as_of: {$ref: "#/components/schemas/AsOf"}
        used:
          type: string
          enum: [exact, retrieved]
          description: |
            `exact` when every row fit beside the queries, `retrieved` when the
            call read a core of `core` rows and each query's neighbors
        core: {type: [integer, "null"], minimum: 0}
        cells: {type: integer, minimum: 0, description: the rows read times their input columns}

    Prediction:
      type: object
      description: |
        the query's id under the predictor's id column name when it names
        one (omitted when it does not); `label` and `probabilities` for
        classification, `value` for regression, `value` and `quantiles` for
        forecasts
      additionalProperties: {type: [string, integer]}
      properties:
        label: {type: [string, integer, boolean]}
        value: {type: number}
        probabilities:
          type: object
          additionalProperties: {type: number}
        quantiles:
          type: object
          additionalProperties: {type: number}

    Result:
      type: object
      required: [model, task, context, predictions]
      additionalProperties: false
      properties:
        model: {$ref: "#/components/schemas/ModelId"}
        task: {$ref: "#/components/schemas/Task"}
        context: {$ref: "#/components/schemas/ContextInfo"}
        predictor:
          oneOf:
            - $ref: "#/components/schemas/Name"
            - type: "null"
        revision: {type: [integer, "null"], minimum: 1}
        environment:
          oneOf:
            - $ref: "#/components/schemas/Name"
            - type: "null"
        predictions:
          type: array
          items: {$ref: "#/components/schemas/Prediction"}
        usage: {$ref: "#/components/schemas/Usage"}
        timing: {$ref: "#/components/schemas/Timing"}
        notes:
          type: array
          items: {type: string}
          description: |
            what the caller should know of the answer, such as a context past
            what the model was trained on ("TabPFN-3.5 was trained on up to
            10,000 rows; quality past that is untested"); never an error

    ResultReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Result"}

    PredictionId:
      type: string
      pattern: "^pred-[0-9a-f]{24}$"
      description: a prediction the hosted plane accepted, `pred-` and 24 hex digits

    PredictionStatus:
      type: object
      description: |
        a prediction the hosted plane accepted and is still working on:
        `starting` while hosted inference starts, `running` once it has
        taken the work
      required: [id, state, created, retry_after]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/PredictionId"}
        state: {type: string, enum: [starting, running]}
        created: {type: number, description: when it was accepted, in unix seconds}
        retry_after: {type: integer, minimum: 1, maximum: 30, description: seconds before polling again}

    PredictionAccepted:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/PredictionStatus"}

    Limits:
      type: object
      description: |
        the context sizes a model was trained and measured to, its own as
        its catalog entry gives them: a call past them is admitted by the
        device's memory and carries a note. No count of queries is a
        limit: a call's queries are decoded in as many model calls as the
        device needs, which `timing.calls` counts
      required: [context_rows, inputs]
      additionalProperties: false
      properties:
        context_rows: {type: integer, minimum: 1}
        inputs: {type: integer, minimum: 1}

    Shape:
      type: object
      description: a compiled program's shape
      required: [context_rows, queries, inputs]
      additionalProperties: false
      properties:
        context_rows: {type: integer, minimum: 1}
        queries: {type: integer, minimum: 1}
        inputs: {type: integer, minimum: 1}
        classes: {type: integer, minimum: 2}

    Model:
      type: object
      description: |
        the catalog's description of a served model: `model` is the resolved
        id with its content digest, `limits` the model's own sizes as the
        catalog gives them (the same from gf serve and the hosted plane), and
        `warm_shapes` the shapes compiled at startup, empty where none were
      required: [model, name, short, kind, base, trained_on, task, artifact, bounds, capabilities, runtime, license, repository, revision, limits, warm_shapes]
      additionalProperties: false
      properties:
        short:
          type: [string, "null"]
          description: |
            the family's short name, which a model field takes beside the id,
            such as `tabicl-v2`; null for a fine-tune
        kind: {type: string, enum: [catalog, fine-tune]}
        family: {type: string, description: the loader family, such as `tabicl`}
        base:
          type: [string, "null"]
          description: a fine-tune version's catalog base; null for a catalog model
        trained_on:
          oneOf:
            - $ref: "#/components/schemas/TrainedOn"
            - type: "null"
        hostable: {type: boolean, description: whether its license lets General Forecast host it}
        model:
          type: string
          description: |
            the id with its content digest: `general-forecast/<name>@sha256:<digest>`
            for a catalog model, `<project>/<name>@ft<version>@sha256:<digest>`
            with the weights' digest for a fine-tune. It is the resolved id a
            prediction's `model` reports; name a model by `name`.
        name:
          $ref: "#/components/schemas/ModelId"
          description: |
            the model's id, which a predictor's `model`, `models.get` and a run's `base`
            take: `general-forecast/<name>`, or a fine-tune version's
            `<project>/<name>@ft<version>`
        derived: {$ref: "#/components/schemas/DerivedModel"}
        versions:
          type: array
          items: {$ref: "#/components/schemas/FineTuneVersion"}
          description: |
            every version of a fine-tune, newest first: present when
            `models.get` names a fine-tune without a version, and the rest of
            the model is then its latest version
        task: {$ref: "#/components/schemas/Task"}
        repository: {type: string}
        revision: {type: string}
        license: {type: string}
        runtime: {type: string, enum: [cpu, gpu]}
        artifact: {$ref: "#/components/schemas/Artifact"}
        artifact_verification: {type: string}
        license_source: {type: string, description: where a forecaster's license is pinned}
        variant: {$ref: "#/components/schemas/ModelVariant"}
        bounds:
          type: object
          description: |
            the model's own caps, before this server's limits; a forecaster's
            `quantiles` lists the levels it outputs
          additionalProperties:
            oneOf:
              - {type: array, items: {type: number}}
              - {type: [integer, number, "null"]}
        capabilities:
          type: array
          items: {$ref: "#/components/schemas/Capability"}
        limits: {$ref: "#/components/schemas/Limits"}
        warm_shapes:
          type: array
          items: {$ref: "#/components/schemas/Shape"}
        architecture: {$ref: "#/components/schemas/ModelArchitecture"}

    TrainedOn:
      type: object
      description: |
        what a catalog model saw in training: its upstream's stated context
        rows, inputs and classes, each null where none is stated. A note
        shown beside results, never a limit; null for a forecaster
      required: [rows, inputs, classes]
      additionalProperties: false
      properties:
        rows: {type: [integer, "null"]}
        inputs: {type: [integer, "null"]}
        classes: {type: [integer, "null"]}

    ModelArchitecture:
      type: object
      description: |
        what a run's `architecture` may change of a catalog model: its
        stages, every standard component kind with its options, their
        settings and default inits and what the model cannot take, and
        the init types. Present on the catalog models a run may change, the
        ones that can be fine-tuned.
      required: [stages, components, inits]
      additionalProperties: false
      properties:
        stages:
          type: array
          description: the groups of the model's attention blocks a change may name in `stages`
          items: {type: string}
        components:
          type: array
          items: {$ref: "#/components/schemas/ArchitectureComponent"}
        inits:
          type: array
          items: {$ref: "#/components/schemas/ArchitectureInit"}

    ArchitectureComponent:
      type: object
      description: a component kind, its options and what this model cannot take of it
      required: [component, description, options, unavailable]
      additionalProperties: false
      properties:
        component: {$ref: "#/components/schemas/RunArchitectureComponent"}
        description: {type: string}
        options:
          type: array
          items: {$ref: "#/components/schemas/ArchitectureOption"}
        unavailable:
          type: array
          items: {$ref: "#/components/schemas/ArchitectureUnavailable"}

    ArchitectureOption:
      type: object
      description: one option of a component, its settings, and how its new parameters start under the `default` init; `default_init` is null for an option without parameters, which takes no init
      required: [type, description, settings, default_init]
      additionalProperties: false
      properties:
        type: {type: string}
        description: {type: string}
        settings:
          type: array
          items: {$ref: "#/components/schemas/ArchitectureSetting"}
        default_init: {type: [string, "null"]}

    ArchitectureSetting:
      type: object
      description: one setting of an option or an init; `default` is its value when left out (null for a width the block gives), absent for a `required` one
      required: [name, type, description]
      additionalProperties: false
      properties:
        name: {type: string}
        type: {type: string, enum: [integer, number, boolean]}
        description: {type: string}
        default: {type: [integer, number, boolean, "null"]}
        minimum: {type: number}
        required: {type: boolean}

    ArchitectureUnavailable:
      type: object
      description: options of a component the model cannot take in some stages, and why; empty `options` is every option, empty `stages` every stage
      required: [options, stages, reason]
      additionalProperties: false
      properties:
        options:
          type: array
          items: {type: string}
        stages:
          type: array
          items: {type: string}
        reason: {type: string}

    ArchitectureInit:
      type: object
      description: an init type; a `fan_based` one draws matrices alone, a change's vectors then taking the option's default
      required: [type, description, settings, fan_based]
      additionalProperties: false
      properties:
        type: {type: string}
        description: {type: string}
        settings:
          type: array
          items: {$ref: "#/components/schemas/ArchitectureSetting"}
        fan_based: {type: boolean}

    DerivedModel:
      type: object
      description: |
        what a fine-tune is made of, as a predictor's lock records it: its
        base, pinned, and its weights; present on the project's fine-tunes
        alone, which otherwise describe themselves as their base does
      required: [base, base_digest, digest, bags, kind, version, created, kept_step]
      additionalProperties: false
      properties:
        base: {$ref: "#/components/schemas/ModelId"}
        base_digest: {$ref: "#/components/schemas/Digest"}
        digest: {$ref: "#/components/schemas/Digest"}
        bags: {type: integer, minimum: 1, description: estimators the weights hold, averaged when served}
        kind: {$ref: "#/components/schemas/FineTuneKind"}
        version: {type: integer, minimum: 1}
        created: {type: number, description: "when the version was published, in seconds since the epoch, as every resource's `created`"}
        kept_step: {$ref: "#/components/schemas/KeptStep"}
        architecture:
          type: array
          description: |
            the changes to the base's architecture the version was trained
            and is served with, resolved, as its run's `architecture`;
            absent for a version that changes none
          items: {$ref: "#/components/schemas/RunResolvedArchitectureChange"}

    FineTuneKind:
      type: string
      enum: [lora, input_adapter, full]
      description: |
        what the weights change of the base: low-rank adapters on its layers
        (`lora`), an input adapter in front of it (`input_adapter`), or the
        named components' own weights (`full`), the names a run's `changes`
        use. A version trained with LoRA beside an input adapter is
        `input_adapter`: the LoRA is stored with it.

    KeptStep:
      type: [integer, "null"]
      minimum: 0
      description: |
        the training step whose weights the version keeps: the one that
        scored best on the rows the run held out. Step 0 is the base
        itself: no check during training beat the base, so the version
        predicts exactly as its base does. Null for a version whose run
        did not say.

    FineTuneVersion:
      type: object
      description: |
        one published version of a fine-tune: its id, its weights' digest
        and the step its run kept. The run that trained it has the same id
        as its `model`. A version never changes: its id names the same
        weights for as long as it exists.
      required: [name, digest, version, kind, created, kept_step]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/ModelId"
          description: the version's id, `<project>/<name>@ft<version>`, which a predictor's `model` names
        digest:
          $ref: "#/components/schemas/Digest"
          description: the digest of the version's weights, which a predictor's revision pins
        version: {type: integer, minimum: 1}
        kind: {$ref: "#/components/schemas/FineTuneKind"}
        created: {type: number, description: "when the version was published, in seconds since the epoch, as every resource's `created`"}
        kept_step: {$ref: "#/components/schemas/KeptStep"}

    ModelVariant:
      type: object
      description: a catalog variant's ensemble, `@K` codes and `*N` estimators
      required: [codes, estimators]
      additionalProperties: false
      properties:
        codes: {type: integer, minimum: 1}
        estimators: {type: integer, minimum: 1}

    Artifact:
      type: object
      required: [repository, revision, digest, license, files]
      additionalProperties: true
      properties:
        repository: {type: string}
        revision: {type: string}
        digest: {$ref: "#/components/schemas/Digest"}
        license: {type: string}
        digest_format: {type: string}
        files:
          type: object
          additionalProperties: {type: string}

    Capability:
      type: object
      required: [name, state]
      additionalProperties: false
      properties:
        name: {type: string}
        state: {type: string, enum: [supported, unsupported, unconfigured]}
        code: {type: [string, "null"]}
        reason: {type: [string, "null"]}

    ModelList:
      type: object
      required: [models]
      additionalProperties: false
      properties:
        models:
          type: array
          items: {$ref: "#/components/schemas/Model"}

    ModelReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Model"}

    ModelListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/ModelList"}

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: {type: string, const: ok}
        build:
          $ref: "#/components/schemas/Build"
          description: |
            the code a hosted plane runs, on its 200 from `/readyz`; `/livez`
            leaves it out, and so does gf serve

    Build:
      type: object
      required: [commit, version, gf_commit, gf_version]
      additionalProperties: false
      properties:
        commit:
          description: the hosted plane's commit, null when it was not built from one
          anyOf:
          - type: string
          - type: 'null'
        version:
          description: the hosted plane's version
          anyOf:
          - type: string
          - type: 'null'
        gf_commit:
          description: the gf commit the plane was built with, null when unknown
          anyOf:
          - type: string
          - type: 'null'
        gf_version:
          description: the version of gf the plane runs
          anyOf:
          - type: string
          - type: 'null'

    HealthError:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error: {$ref: "#/components/schemas/Error"}

    # hosted control plane

    Empty:
      type: object
      additionalProperties: false

    EmptyRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/Empty"}

    Project:
      type: object
      required: [name, organization]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        organization: {$ref: "#/components/schemas/Name"}

    ProjectReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Project"}

    ProjectList:
      type: object
      required: [projects, organizations]
      additionalProperties: false
      properties:
        projects:
          type: array
          items: {$ref: "#/components/schemas/Project"}
        organizations:
          type: array
          items: {$ref: "#/components/schemas/Name"}

    Projects:
      type: object
      description: the projects the credential reaches; `workspace.get` adds their organizations
      required: [projects]
      additionalProperties: false
      properties:
        projects:
          type: array
          items: {$ref: "#/components/schemas/Project"}

    ProjectsReply:
      allOf:
      - $ref: "#/components/schemas/Envelope"
      - type: object
        required: [result]
        properties:
          result:
            $ref: "#/components/schemas/Projects"

    ProjectListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/ProjectList"}

    ProjectCreate:
      type: object
      required: [name, organization]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        organization: {$ref: "#/components/schemas/Name"}

    ProjectCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/ProjectCreate"}

    Permission:
      description: |
        A project permission a key or role holds. Fine-tuning's:
        `snapshots:read` reads snapshots, `snapshots:write` uploads and
        deletes them, `runs:read` reads runs and their lineage, and
        `runs:write` creates and cancels runs; `models:read` reads the
        fine-tunes runs publish. The admin and editor roles hold all four;
        the viewer role holds `snapshots:read` and `runs:read`.
        `sources:manage` adds, tests, rotates and deletes data sources and
        prepares the workspace's identity for them (`sources.prepare`); only
        the admin role holds it, so only an admin can create a key that
        carries it. `GET /auth/status` lists every permission with the
        roles that hold it. The service may grant permissions this list
        does not name yet, so a client keeps any `<group>:<action>` name it
        does not know as it is.
      anyOf:
        - type: string
          enum:
            - predictors:read
            - predictors:write
            - predictors:predict
            - contexts:read
            - contexts:write
            - contexts:history
            - sources:read
            - sources:write
            - sources:manage
            - models:read
            - snapshots:read
            - snapshots:write
            - runs:read
            - runs:write
            - keys:read
            - keys:write
            - secrets:read
            - secrets:write
            - members:read
            - members:write
            - sso:read
            - sso:write
            - audit:read
            - operators:read
            - operators:write
            - projects:read
        - type: string
          pattern: "^[a-z][a-z0-9-]*:[a-z][a-z0-9-]*$"

    Key:
      type: object
      description: "`token` is present only in the create and rotate replies"
      required: [id, project, name, permissions, created_at, expires_at, revoked_at]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}
        project: {$ref: "#/components/schemas/Name"}
        name: {$ref: "#/components/schemas/Name"}
        permissions:
          type: array
          items: {$ref: "#/components/schemas/Permission"}
        created_at: {type: number}
        expires_at: {type: [number, "null"], description: Unix seconds; null for a key that never expires}
        revoked_at: {type: [number, "null"]}
        state:
          type: string
          enum: [active, expired, revoked]
          description: "revoked once `revoked_at` is set, else expired once `expires_at` has passed"
        prefix: {type: [string, "null"], description: "the token's first seven characters, `gf_` and four more; null for a key made before prefixes were kept"}
        last_used_at: {type: [number, "null"], description: "Unix seconds of the key's last use, kept at most once an hour; null for a key never used"}
        ephemeral: {type: boolean, description: "a notebook login's short-lived key, listed only with `?ephemeral=true`"}
        owner:
          description: "the account that made the key; null for a service key and a legacy one"
          oneOf:
          - $ref: "#/components/schemas/KeyOwner"
          - type: "null"
        service: {type: boolean, description: "made by the plane for its own use, as its engine key is; a service key has no owner"}
        legacy: {type: boolean, description: "made before keys recorded their owners, by an account no longer traced; it expires within the upgrade's grace period"}
        machine: {type: [string, "null"], description: "the machine a `gf login` on it made the key for; null for a key made otherwise"}
        token: {type: string, pattern: "^gf_[A-Za-z0-9_-]{32,}$"}
        replaces: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}

    KeyOwner:
      type: object
      description: "the signed-in account behind a key: `issuer` and `subject` name it, and stay the same when its email changes"
      required: [issuer, subject, email]
      additionalProperties: false
      properties:
        issuer: {type: string}
        subject: {type: string}
        email: {type: [string, "null"]}

    KeyReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Key"}

    KeyList:
      type: object
      required: [keys]
      additionalProperties: false
      properties:
        keys:
          type: array
          items: {$ref: "#/components/schemas/Key"}

    KeyListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/KeyList"}

    KeyCreate:
      type: object
      required: [name, permissions]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        permissions:
          type: array
          items: {$ref: "#/components/schemas/Permission"}
          minItems: 1
        expires_in:
          type: [number, "null"]
          minimum: 60
          maximum: 7776000
          default: 2592000
          description: seconds; 30 days by default, 90 at most, and null for a key that never expires

    KeyCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/KeyCreate"}

    KeyRef:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}

    KeyRefRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/KeyRef"}

    KeyRevoked:
      type: object
      required: [id, revoked]
      additionalProperties: false
      properties:
        id: {type: string}
        revoked: {type: boolean, const: true}

    KeyRevokedReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/KeyRevoked"}

    Secret:
      type: object
      description: metadata only; a value is never returned
      required: [project, name, version, created_at, updated_at]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/Name"}
        name: {$ref: "#/components/schemas/Name"}
        version: {type: integer, minimum: 1}
        created_at: {type: number}
        updated_at: {type: number}

    SecretReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Secret"}

    SecretList:
      type: object
      required: [secrets]
      additionalProperties: false
      properties:
        secrets:
          type: array
          items: {$ref: "#/components/schemas/Secret"}

    SecretListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/SecretList"}

    SecretCreate:
      type: object
      required: [name, value]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        value: {type: string, minLength: 1, maxLength: 65536}

    SecretCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/SecretCreate"}

    SecretRotate:
      type: object
      required: [name, value, expected_version]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        value: {type: string, minLength: 1, maxLength: 65536}
        expected_version: {type: integer, minimum: 1}

    SecretRotateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/SecretRotate"}

    SecretRef:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}

    SecretRefRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/SecretRef"}

    SecretDeleted:
      type: object
      required: [name, deleted]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        deleted: {type: boolean, const: true}

    SecretDeletedReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/SecretDeleted"}

    RunState:
      type: string
      enum:
      - queued
      - setting_up
      - training
      - preempted
      - finished
      - cancelling
      - cancelled
      - failed
    RunData:
      type: object
      description: a snapshot a run reads, by its name and the digest the name had when the run was created
      required:
      - name
      - digest
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        digest:
          $ref: '#/components/schemas/Digest'
        phase:
          $ref: '#/components/schemas/Name'
          description: the phase that reads it, in a curriculum run's `data`; absent otherwise
        context:
          $ref: '#/components/schemas/Name'
          description: the context whose version it is, when the run named a context; `name` is then the snapshot that holds the version
        version:
          type: integer
          minimum: 1
          description: that context's version
    RunMethod:
      type: object
      description: |
        How a run changes the network: `{"type": "lora", "rank": 16}`, with
        `"input_adapter": true` to train an input adapter in front of it;
        `{"type": "input_adapter"}`; or `{"type": "full", "components":
        [...]}`, some of `column_encoder`, `row_encoder`,
        `in_context_transformer` and `prediction_head`. A method the base
        does not take is refused with 422.
      required:
      - type
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - lora
          - input_adapter
          - full
        rank:
          type: integer
          minimum: 1
          maximum: 256
          description: LoRA's rank, which `lora` needs
        input_adapter:
          type: boolean
          description: whether an input adapter trains beside LoRA; false when left out
        components:
          type: array
          minItems: 1
          description: the components full fine-tuning trains, which `full` needs
          items:
            $ref: '#/components/schemas/RunComponent'
    RunComponent:
      type: string
      description: a component full fine-tuning may train
      enum:
      - column_encoder
      - row_encoder
      - in_context_transformer
      - prediction_head
    RunArchitectureComponent:
      type: string
      description: a standard component kind of the shared attention block, or an addition to a model's cell embeddings, the same in every model
      enum:
      - attention.kv_heads
      - attention.query_scale
      - attention.qk_norm
      - attention.output_gate
      - positional_encoding
      - norm
      - norm_placement
      - feed_forward
      - attention.temperature
      - feed_forward_branch
      - cell_embedding.numeric
      - cell_embedding.categorical
    RunArchitectureOption:
      type: object
      description: |
        What a component becomes: `{"type": <option>}` with the option's
        settings beside it, as `{"type": "grouped", "heads": 2}` or
        `{"type": "rope", "theta": 10000}`. A catalog model's
        `architecture` lists each component's options, their settings and
        defaults; a setting left out takes its default, and an unknown one
        is refused with 422.
      required:
      - type
      properties:
        type:
          type: string
      additionalProperties:
        type:
        - integer
        - number
        - boolean
        - 'null'
    RunArchitectureInitType:
      type: string
      description: an init type, as a catalog model's `architecture.inits` lists them
      enum:
      - default
      - zeros
      - ones
      - constant
      - normal
      - truncated_normal
      - uniform
      - xavier_uniform
      - xavier_normal
      - kaiming_uniform
      - kaiming_normal
      - orthogonal
    RunArchitectureInit:
      type: object
      description: |
        How a change's new parameters start, each matching its
        `torch.nn.init` / `jax.nn.initializers` namesake: `default` (the
        option's documented init), `zeros`, `ones`, `constant` (`value`),
        `normal` (`mean` 0 and `std` 0.02 when left out),
        `truncated_normal` (`std` 0.02, cut at 2 standard deviations),
        `uniform` (`low` 0 and `high` 1), and `xavier_uniform`,
        `xavier_normal`, `kaiming_uniform`, `kaiming_normal` (fan in, ReLU
        gain) and `orthogonal`, which draw the change's matrices while its
        vectors take the option's default. Draws are deterministic in the
        run's `seed`, the component and the stage. Every init is accepted
        for every option with parameters.
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/RunArchitectureInitType'
      additionalProperties:
        type: number
    RunArchitectureChange:
      type: object
      description: |
        One change to the base's architecture, as a create sends it:
        `{"component": "attention.query_scale", "stages": ["icl"], "to":
        {"type": "gated_log_scale"}, "init": {"type": "normal", "std":
        0.02}}`. `stages` left out is every stage of the base that can take
        the option; `init` left out is `{"type": "default"}`, and an option
        without parameters (`none`, `pre`, `all`, `grouped`, `rope`) takes
        none.
      required:
      - component
      - to
      additionalProperties: false
      properties:
        component:
          $ref: '#/components/schemas/RunArchitectureComponent'
        stages:
          type: array
          minItems: 1
          description: some of the base's stages, as its catalog view lists them
          items:
            type: string
        to:
          $ref: '#/components/schemas/RunArchitectureOption'
        init:
          $ref: '#/components/schemas/RunArchitectureInit'
    RunResolvedArchitectureChange:
      type: object
      description: |
        A change as the run resolved it and its version records it: the
        stages it applies in, the option with every setting filled in (a
        null `hidden` is the block's own width), and its init with every
        setting filled in, null for an option without parameters
      required:
      - component
      - stages
      - to
      - init
      additionalProperties: false
      properties:
        component:
          $ref: '#/components/schemas/RunArchitectureComponent'
        stages:
          type: array
          items:
            type: string
        to:
          $ref: '#/components/schemas/RunArchitectureOption'
        init:
          anyOf:
          - $ref: '#/components/schemas/RunArchitectureInit'
          - type: 'null'
    RunWarning:
      type: object
      description: |
        Something about the run to know, which does not stop it.
        `uncalibrated_architecture`: the run changes the base's
        architecture, so the changed model is not calibrated to the base
        and starts from `start_loss` where the base scores `base_loss`, on
        the evaluation rows; both are null until step 0 measures them.
      required:
      - code
      - message
      - base_loss
      - start_loss
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - uncalibrated_architecture
        message:
          type: string
        base_loss:
          description: the base's loss on the evaluation rows; null until measured, or without a finite one
          anyOf:
          - type: number
          - type: 'null'
        start_loss:
          description: the changed model's loss on the same rows at step 0; null until measured, or without a finite one
          anyOf:
          - type: number
          - type: 'null'
    RunWaiting:
      type: object
      description: |
        the synthetic batches a run waits for before it trains, and how many
        of their tables are still pending. `data` holds the snapshots
        already pinned, and the batches' ready tables join it once every
        batch is done; absent once the run is not waiting.
      required:
      - batches
      - pending
      additionalProperties: false
      properties:
        batches:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SyntheticBatchName'
        pending:
          type: integer
          minimum: 0
    RunDataTag:
      type: object
      description: |
        every ready snapshot in the project carrying `tag`, sorted by name.
        The run expands it when it is created, or once the synthetic batches
        it names are done, and keeps the names and digests it found, so
        `runs.get` shows exactly what it trains on and tagging snapshots
        later changes nothing. A tag no ready or generating snapshot
        carries is refused with 422.
      required:
      - tag
      additionalProperties: false
      properties:
        tag:
          $ref: '#/components/schemas/RunTag'
    RunDataContext:
      type: object
      description: |
        a context version a run trains on: `version`, or the latest when it
        is left out, pinned to that version's snapshot digest when the run
        is created. Its rows train to predict the run's `target`
      required: [context]
      additionalProperties: false
      properties:
        context: {$ref: '#/components/schemas/Name'}
        version: {type: integer, minimum: 1}
    RunDataItem:
      description: |
        what a run or phase trains on: a snapshot by its name, every ready
        snapshot carrying a tag, or a context version. A bare name resolves
        as a snapshot, a synthetic batch or a context, whichever has it; a
        name two of them have is refused with 422 `AmbiguousReference`, and
        `{"context": ...}` names a context alone
      oneOf:
      - $ref: '#/components/schemas/Name'
      - $ref: '#/components/schemas/RunDataTag'
      - $ref: '#/components/schemas/RunDataContext'
    RunTag:
      type: string
      pattern: '^[a-z0-9][a-z0-9._:/-]{0,63}$'
      description: a label to find runs or snapshots by, as `recipe:fraud-v1`
    Run:
      type: object
      required:
      - name
      - state
      - reason
      - attempt
      - base
      - data
      - data_digest
      - method
      - evaluation
      - budget
      - seed
      - tags
      - plan
      - progress
      - created
      - updated
      - published
      - model
      - version
      - origin
      - url
      additionalProperties: false
      properties:
        origin:
          $ref: '#/components/schemas/Origin'
        url:
          type: string
          description: the fine-tune's console page
        model:
          $ref: '#/components/schemas/RunModel'
          description: |
            the run's name: the model it publishes, `<project>/<name>@ft<version>`,
            fixed when it is created. The SDK's `runs` methods take it, and
            every `/runs/{run}` route takes it without its project,
            `<name>@ft<version>`. Once the run publishes, `published.model` is
            the same id.
        name:
          $ref: '#/components/schemas/Name'
          description: the fine-tune the run trains, the `name` its create sent
        version:
          type: integer
          minimum: 1
          description: the version the run publishes, `<project>/<name>@ft<version>`, fixed when
            it is created; a run that ends without publishing leaves that version unpublished,
            and the name's next run takes the next one
        state:
          $ref: '#/components/schemas/RunState'
        reason:
          description: why the run ended as it did, as `data` for a run whose synthetic batch ended with no ready table; null when there is nothing to say
          anyOf:
          - type: string
          - type: 'null'
        attempt:
          type: integer
          minimum: 0
        base:
          $ref: '#/components/schemas/ModelId'
          description: the catalog model the run trains from
        data:
          type: array
          description: |
            the snapshots the run reads, each pinned to its digest and each
            its own table; for a curriculum run every phase's snapshots in
            phase order, each with the `phase` that reads it
          items:
            $ref: '#/components/schemas/RunData'
        target:
          type: string
          minLength: 1
          description: the column the run's context data trains to predict, as its create named it; absent for a run that named none
        data_digest:
          description: |
            the digest of the data's digests, in order; runs of the same data
            share it. A curriculum run's is over its phases in order, each
            phase's name and its digests in order, so it is never a run
            with `data`'s. Null while the run is `waiting`.
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
        waiting:
          $ref: '#/components/schemas/RunWaiting'
          description: |
            the synthetic batches the run waits for before it trains,
            `{"batches": [...], "pending": <tables still pending>}`; absent
            when it waits for none
        phases:
          type: array
          description: a curriculum run's phases, in the order they train, each with its data pinned;
            absent for a run with `data`
          items:
            $ref: '#/components/schemas/RunPinnedPhase'
        architecture:
          type: array
          description: the changes to the base's architecture, resolved, in the order they apply;
            absent for a run that changes none
          items:
            $ref: '#/components/schemas/RunResolvedArchitectureChange'
        warnings:
          type: array
          description: what to know about the run that does not stop it; absent when there is nothing
          items:
            $ref: '#/components/schemas/RunWarning'
        progress:
          description: how far training has got, as of the trainer's latest report; null before the
            first
          anyOf:
          - $ref: '#/components/schemas/RunProgress'
          - type: 'null'
        method:
          $ref: '#/components/schemas/RunMethod'
        evaluation:
          $ref: '#/components/schemas/RunEvaluation'
        budget:
          anyOf:
          - type: object
          - type: 'null'
        seed:
          type: integer
        tags:
          type: array
          items:
            $ref: '#/components/schemas/RunTag'
        plan:
          description: how the run trains; for a curriculum run, the settings that span the whole run,
            `{}` when none were sent, while each phase's plan is in `phases`
          anyOf:
          - $ref: '#/components/schemas/RunPlan'
          - $ref: '#/components/schemas/RunCurriculumPlan'
        created:
          type: number
        updated:
          type: number
        usage:
          description: the GPU time the run metered and what it cost; null where nothing meters it
          anyOf:
          - $ref: '#/components/schemas/RunUsage'
          - type: 'null'
        published:
          description: the version the run published, once it has; null until then, and for a run that
            ends without publishing
          anyOf:
          - $ref: '#/components/schemas/RunPublished'
          - type: 'null'
    RunPhase:
      type: object
      description: |
        One phase of a curriculum run, as a create sends it: its `name`,
        unique in the run; the ready snapshots it trains on, unique in the
        phase, each its own table with its own encoding and holdout; and
        its `plan` (`RunPhasePlan`), its steps and how it samples episodes.
      required:
      - name
      - data
      - plan
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        data:
          type: array
          minItems: 1
          maxItems: 64
          description: |
            the ready snapshots the phase trains on, each a name or
            `{"tag": "<tag>"}` for every ready snapshot carrying the tag
            (`RunDataTag`); a snapshot may be in several phases. The run
            pins each to its digest. An episode draws from one table, and a
            table's share of the phase's episodes is its training rows over
            the phase's.
          items:
            $ref: '#/components/schemas/RunDataItem'
        plan:
          $ref: '#/components/schemas/RunPhasePlan'
    RunPhasePlan:
      type: object
      description: |
        A phase's own settings: its `steps`, how it samples episodes and its
        episodes per step, `{"steps": 400, "episode_sampling": {"rows":
        1024}}`. A setting left out takes the service's default, never the
        phase before's. Every other plan setting is set for the whole run,
        in the run's `plan` (`RunCurriculumPlan`), and is refused here with
        422.
      required:
      - steps
      additionalProperties: false
      properties:
        steps:
          type: integer
          minimum: 1
          maximum: 10000000
          description: how many steps the phase trains
        episode_sampling:
          $ref: '#/components/schemas/EpisodeSampling'
        episodes_per_step:
          type: integer
          minimum: 1
          maximum: 64
    RunCurriculumPlan:
      type: object
      description: |
        The settings of a curriculum run that span the whole run: the
        optimizer's, the learning-rate schedule's, the checks' and the
        checkpoints', `{"learning_rate": 1e-4, "warmup_steps": 20,
        "eval_steps": 25}`. One optimizer and one schedule run over the
        phases' steps together, and the trained weights and the
        optimizer's moments carry from one phase into the next. Checks,
        `early_stopping_patience` and the kept step belong to the last
        phase alone, from its first step; checkpoints are saved in every
        phase. `steps`, `episode_sampling` and `episodes_per_step` are set
        per phase (`RunPhasePlan`) and are refused here with 422.
      additionalProperties: false
      properties:
        learning_rate:
          type: number
          minimum: 1.0e-08
          maximum: 1
          description: the peak learning rate; 1e-4, or 1e-5 for full fine-tuning, when left out
        optimizer:
          type: string
          enum: [adamw]
        schedule:
          type: string
          enum: [cosine]
          description: a linear warmup, then a cosine to a tenth of the peak rate, over every phase's
            steps
        warmup_steps:
          type: integer
          minimum: 0
          description: the steps of the linear warmup, 20 when left out
        weight_decay:
          type: number
          minimum: 0
          maximum: 1
        beta2:
          type: number
          minimum: 0.5
          maximum: 0.99999
        grad_clip:
          type: number
          minimum: 1.0e-06
          maximum: 1000000
        eval_steps:
          type: integer
          minimum: 1
          maximum: 10000
          description: the steps between checks on the select rows in the last phase, 20 when left out
        early_stopping_patience:
          type: integer
          minimum: 0
          maximum: 1000
          description: checks in a row in the last phase that do not lower the run's lowest select
            loss, kept or not, before training stops; 0, never, when left out
        save_steps:
          type: integer
          minimum: 1
          maximum: 10000000
          description: the steps of a phase between checkpoints
        save_total_limit:
          type: integer
          minimum: 0
          maximum: 100
          description: the checkpoints kept besides the best
        save_only_model:
          type: boolean
          description: whether a checkpoint keeps the trained weights alone, without the optimizer's state
    RunPinnedPhase:
      type: object
      description: a curriculum run's phase as the run keeps it, each snapshot pinned to its digest
      required:
      - name
      - data
      - plan
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        data:
          type: array
          items:
            $ref: '#/components/schemas/RunData'
        plan:
          $ref: '#/components/schemas/RunPhasePlan'
    RunProgress:
      type: object
      description: |
        Where training is: the steps trained over the whole run and the
        latest training loss. A curriculum run adds the phase it is in, by
        name and by its place in `phases` (from 0), the steps trained within
        that phase, and each phase reached so far with its own steps and
        latest training loss.
      required:
      - step
      - loss
      additionalProperties: false
      properties:
        step:
          type: integer
          minimum: 0
          description: the steps trained, over every phase
        loss:
          description: the latest training loss; null without a finite one
          anyOf:
          - type: number
          - type: 'null'
        phase:
          $ref: '#/components/schemas/Name'
          description: the phase training is in
        phase_index:
          type: integer
          minimum: 0
          description: that phase's place in `phases`, from 0
        phase_step:
          type: integer
          minimum: 0
          description: the steps trained within that phase
        phases:
          type: array
          description: each phase reached so far, in order
          items:
            $ref: '#/components/schemas/RunPhaseProgress'
    RunPhaseProgress:
      type: object
      description: one phase's training so far
      required:
      - name
      - step
      - loss
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        step:
          type: integer
          minimum: 0
          description: the steps the phase has trained
        loss:
          description: the phase's latest training loss; null without a finite one
          anyOf:
          - type: number
          - type: 'null'
    RunPlan:
      type: object
      description: |
        How a run trains: its `steps`, how it samples episodes, the
        optimizer's settings and its checkpoint settings,
        `{"steps": 200, "learning_rate": 5e-5, "episode_sampling": {"rows": 1024}}`.
        A setting the trainer does not read is refused with 422.
      required:
      - steps
      additionalProperties: false
      properties:
        steps:
          type: integer
          minimum: 1
          maximum: 10000000
          description: how many steps the run trains
        episode_sampling:
          $ref: '#/components/schemas/EpisodeSampling'
        learning_rate:
          type: number
          minimum: 1.0e-08
          maximum: 1
          description: the peak learning rate; 1e-4, or 1e-5 for full fine-tuning, when left out
        optimizer:
          type: string
          enum: [adamw]
        schedule:
          type: string
          enum: [cosine]
          description: a linear warmup, then a cosine to a tenth of the peak rate
        warmup_steps:
          type: integer
          minimum: 0
          description: the steps of the linear warmup, 20 when left out
        weight_decay:
          type: number
          minimum: 0
          maximum: 1
        beta2:
          type: number
          minimum: 0.5
          maximum: 0.99999
        grad_clip:
          type: number
          minimum: 1.0e-06
          maximum: 1000000
        episodes_per_step:
          type: integer
          minimum: 1
          maximum: 64
        eval_steps:
          type: integer
          minimum: 1
          maximum: 10000
          description: the steps between checks on the select rows, 20 when left out
        early_stopping_patience:
          type: integer
          minimum: 0
          maximum: 1000
          description: checks in a row that do not lower the run's lowest select loss, kept or not,
            before training stops; 0, never, when left out
        save_steps:
          type: integer
          minimum: 1
          maximum: 10000000
          description: the steps between checkpoints
        save_total_limit:
          type: integer
          minimum: 0
          maximum: 100
          description: the checkpoints kept besides the best
        save_only_model:
          type: boolean
          description: whether a checkpoint keeps the trained weights alone, without the optimizer's state
    EpisodeSampling:
      type: object
      description: how the trainer draws an episode from the table's training rows
      additionalProperties: false
      properties:
        rows:
          description: an episode's rows, or `auto` for 640 (fewer when the table has fewer)
          oneOf:
          - type: integer
            minimum: 16
            maximum: 16384
          - type: string
            enum: [auto]
        context_fraction:
          type: number
          minimum: 0.5
          maximum: 0.95
          description: the share of an episode's rows that are its context, 0.8 when left out
    RunPublished:
      type: object
      description: |
        What a run published: the version, its weights' digest, the step the
        weights were kept at and how they scored on the rows the run held
        out, against the base on the same rows. The same as the lineage's
        `published` note. A version kept at step 0 predicts exactly as its
        base does: no check during training beat the base.
      required:
      - model
      - digest
      - kept_step
      - validation_loss
      - base_validation_loss
      additionalProperties: false
      properties:
        model:
          $ref: '#/components/schemas/ModelId'
          description: the version's id, `<project>/<name>@ft<version>`, which `models.get` reads and
            a predictor's `model` names
        digest:
          $ref: '#/components/schemas/Digest'
          description: the digest of the version's weights
        kept_step:
          $ref: '#/components/schemas/KeptStep'
        validation_loss:
          description: the kept weights' loss on the held-out rows; null without a finite one
          anyOf:
          - type: number
          - type: 'null'
        base_validation_loss:
          description: the base's loss on the same rows; null without a finite one
          anyOf:
          - type: number
          - type: 'null'
        diverged_at_step:
          type: integer
          description: present when the loss stopped being finite there and training stopped; the
            version keeps the best step before it
        check_context_rows:
          type: integer
          description: the rows of each check context
        check_contexts:
          type: integer
          description: how many fixed contexts each check scored the select rows against
        report:
          description: the kept step against the base on the report rows, by table; null without report rows
          anyOf:
          - $ref: '#/components/schemas/RunReport'
          - type: 'null'
    RunReport:
      type: object
      description: the report rows' scores under `data`, the report rows of every snapshot the run
        holds rows out from (a curriculum run's last phase's) scored together
      required:
      - data
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/RunTableReport'
    RunTableReport:
      type: object
      description: |
        Report rows, scored once for the base and once for the kept step
        against the check contexts: their mean losses, the gain (the base's
        loss less the kept step's, above 0 when the kept step is better)
        with its 95% interval from the per-row gains, and task
        metrics for each: log loss, accuracy and, for two classes, ROC AUC;
        or CRPS, RMSE, MAE and R².
      required:
      - rows
      - base
      - kept
      - gain
      - ci95
      - metrics
      additionalProperties: false
      properties:
        rows:
          type: integer
        base:
          type: number
        kept:
          type: number
        gain:
          type: number
        ci95:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
        metrics:
          $ref: '#/components/schemas/RunReportMetrics'
    RunReportMetrics:
      type: object
      description: the task metrics of the base's and the kept step's predictions on the report rows
      required:
      - base
      - kept
      additionalProperties: false
      properties:
        base:
          type: object
          additionalProperties:
            type: number
        kept:
          type: object
          additionalProperties:
            type: number
    RunEvaluation:
      type: object
      description: |
        How the run holds out rows and keeps a step. `holdout` of the
        table's rows, clamped to 2,000..50,000 rows, are held out by its
        time column, its group column, or stratified by class or target;
        `report_share` of them are report rows, the rest select rows. Every
        `eval_steps`, a check scores every select row against `contexts`
        fixed contexts of `context_rows` training rows, the base's
        trained row cap when null, and a step becomes the new best only if
        its gain over the base, row by row, is more than
        `early_stopping_threshold.standard_errors` standard errors above 0
        and beats the best so far. Training stops early once the plan's
        `early_stopping_patience` checks in a row have not lowered the
        run's lowest select loss, significant or not, so a run whose gain
        is still rising goes on. A create may leave any setting out; the
        run says each.
      required:
      - holdout
      - context_rows
      - contexts
      - early_stopping_threshold
      - report_share
      additionalProperties: false
      properties:
        holdout:
          type: number
          minimum: 0.05
          maximum: 0.5
          description: the share of the table's rows held out, 0.2 when left out
        context_rows:
          description: the rows of each check context; the base's trained row cap when null
          anyOf:
          - type: integer
            minimum: 256
            maximum: 100000
          - type: 'null'
        contexts:
          type: integer
          minimum: 1
          maximum: 5
          description: the fixed check contexts, 3 when left out
        early_stopping_threshold:
          $ref: '#/components/schemas/EarlyStoppingThreshold'
        report_share:
          type: number
          minimum: 0.2
          maximum: 0.8
          description: the share of the held-out rows reported rather than checked, 0.5 when left out
    EarlyStoppingThreshold:
      type: object
      description: how far above 0 a step's paired gain over the base must be to keep it
      required:
      - standard_errors
      additionalProperties: false
      properties:
        standard_errors:
          type: number
          minimum: 0
          maximum: 5
          description: in standard errors of the per-row gain, 2 when left out
    RunEvaluationRequest:
      type: object
      description: a create's evaluation settings; each left out takes its default (`RunEvaluation`)
      additionalProperties: false
      properties:
        holdout:
          type: number
          minimum: 0.05
          maximum: 0.5
        context_rows:
          type: integer
          minimum: 256
          maximum: 100000
        contexts:
          type: integer
          minimum: 1
          maximum: 5
        early_stopping_threshold:
          $ref: '#/components/schemas/EarlyStoppingThreshold'
        report_share:
          type: number
          minimum: 0.2
          maximum: 0.8
    RunUsage:
      type: object
      required:
      - gpu_seconds
      - charged_gpu_seconds
      - voided_gpu_seconds
      - credits
      additionalProperties: false
      properties:
        gpu_seconds:
          type: number
          description: GPU seconds charged or still pending, as the run's budget counts them
        charged_gpu_seconds:
          type: number
          description: GPU seconds of attempts that ended charged
        voided_gpu_seconds:
          type: number
          description: GPU seconds lost on the service's side, never charged
        credits:
          type: number
          description: what gpu_seconds cost under the workspace's price book, before its included credits
    RunReply:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - result
        properties:
          result:
            $ref: '#/components/schemas/Run'
    RunList:
      type: object
      required:
      - runs
      additionalProperties: false
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/Run'
    RunListReply:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - result
        properties:
          result:
            $ref: '#/components/schemas/RunList'
    RunCreate:
      type: object
      description: |
        A run's settings. It trains on `data` with a `plan` (`RunPlan`), or
        on a curriculum of `phases`, with an optional `plan` of the settings
        that span the whole run (`RunCurriculumPlan`); a create that sends
        both `data` and `phases`, or neither, is refused with 422.
        `method`, `evaluation`, `budget`, `seed` and `tags` apply to the
        whole run either way. Every snapshot is its own table, never pooled
        with another, and has the base's task. With an input adapter every
        snapshot has exactly the last phase's columns in the same order
        (with `data`, every snapshot has the same columns).
      required:
      - name
      - base
      - method
      oneOf:
      - required: [data, plan]
        not:
          required: [phases]
        properties:
          plan:
            $ref: '#/components/schemas/RunPlan'
      - required: [phases]
        not:
          required: [data]
        properties:
          plan:
            $ref: '#/components/schemas/RunCurriculumPlan'
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
          description: |
            the fine-tune the run trains: its first run publishes
            `<project>/<name>@ft1`, and each run after the next version; a
            version never changes once published. A catalog model's name is
            refused with 422.
        base:
          $ref: '#/components/schemas/ModelField'
          description: |
            the catalog model the run trains from, by its short name or full id,
            always sent; the run records the full id. Every version
            of a fine-tune trains afresh from the same base: another base is
            refused with 409 `base_mismatch`, and a fine-tune with 422
            `base_is_fine_tune`.
        data:
          type: array
          minItems: 1
          maxItems: 64
          description: |
            the ready snapshots the run trains on, each its own table with
            its own encoding and holdout, as one phase: a snapshot's name, or
            `{"tag": "<tag>"}` for every ready snapshot carrying the tag
            (`RunDataTag`), as `[{"tag": "synthetic-credit-warmup"},
            "credit-2026-01"]`. The run pins each snapshot to its digest.
            Never sent with `phases`.
          items:
            $ref: '#/components/schemas/RunDataItem'
        target:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            the column a context's rows are trained to predict, for every
            context item of `data` or of a phase; the task is read from the
            column, as an experiment reads it, and must be the base's. A run
            with a context item and no `target` is refused with 422
            `ValidationError` (param `target`). A snapshot keeps the target its
            metadata names.
        method:
          $ref: '#/components/schemas/RunMethod'
        plan:
          description: |
            how the run trains: with `data`, a `RunPlan`, its `steps`
            required; with `phases`, a `RunCurriculumPlan` of the settings
            that span the whole run, `{}` when left out.
          anyOf:
          - $ref: '#/components/schemas/RunPlan'
          - $ref: '#/components/schemas/RunCurriculumPlan'
        phases:
          type: array
          minItems: 1
          maxItems: 16
          description: |
            a curriculum in place of `data`: phases that train one after
            another, each on its own snapshots with its own `steps`,
            episode sampling and episodes per step (`RunPhase`). Names are
            unique in the run. With an input adapter every snapshot of
            every phase has exactly the last phase's columns, in its order.
            The phases' steps together are held to the step limit.
          items:
            $ref: '#/components/schemas/RunPhase'
        architecture:
          type: array
          minItems: 1
          maxItems: 64
          description: |
            changes to the base's architecture before it trains, at most one
            per component and stage (`RunArchitectureChange`); their new
            parameters train whatever the method. Works with every method
            and with `data` or `phases`.
          items:
            $ref: '#/components/schemas/RunArchitectureChange'
        evaluation:
          $ref: '#/components/schemas/RunEvaluationRequest'
        budget:
          type: object
        seed:
          type: integer
          minimum: 0
        tags:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/RunTag'
    RunCreateRequest:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - payload
        properties:
          payload:
            $ref: '#/components/schemas/RunCreate'
    RunCancel:
      type: object
      description: how a run is cancelled; an empty payload cancels without saving
      additionalProperties: false
      properties:
        save:
          type: boolean
          default: false
          description: publish the weights a training run has trained so far before it ends `cancelled`
    RunCancelRequest:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - payload
        properties:
          payload:
            $ref: '#/components/schemas/RunCancel'
    RunEvent:
      type: object
      required:
      - at
      - kind
      - body
      additionalProperties: false
      properties:
        at:
          type: number
        kind:
          type: string
        body:
          type: object
          description: |
            What happened. A `created` event's body is the run as created,
            its resolved `architecture` included. A `published` event is the run's `published`. A
            `metrics` event is one chunk of training:
            `steps`, `loss`, `validation_loss` and `seconds`; and, where the
            trainer reads them, `compile_seconds`, `train_seconds`,
            `chunk_steps`, `steps_per_second`, `rows_per_second`,
            `gpu_utilization` (%), `gpu_memory_used_bytes`,
            `gpu_memory_total_bytes`, `gpu_power_watts`, `gpu_samples`,
            `device_peak_bytes`, `device_bytes_limit`, `device_bytes_in_use`,
            `device_count`, `device_kind`, `gpu_name` and `gpu_type`. In a
            curriculum run `steps` counts over every phase, and a `metrics`
            event also names its `phase`, `phase_index` (from 0) and
            `phase_step`, the steps trained within that phase; its `loss`
            is that phase's.
    RunLineage:
      type: object
      required:
      - model
      - events
      additionalProperties: false
      properties:
        model:
          $ref: '#/components/schemas/RunModel'
          description: the run's `model`
        events:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
    RunLineageReply:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - result
        properties:
          result:
            $ref: '#/components/schemas/RunLineage'
    SnapshotState:
      type: string
      description: |
        `open` while an upload waits for its bytes, `pending` while a
        synthetic table is generated, then `ready`, or `rejected` with an
        `error`; an upload left open `expired`, and a snapshot `deleted`
      enum:
      - open
      - pending
      - ready
      - rejected
      - expired
      - deleted
    SnapshotColumn:
      type: object
      required:
      - name
      - type
      additionalProperties: false
      properties:
        name:
          type: string
        type:
          type: string
    SnapshotMetadata:
      type: object
      description: |
        A table's training metadata: its `target` and `task`, and
        optionally its `time` and `group` columns, its column types and its
        origin. A run refuses a snapshot without a target and task. The
        columns set how a run holds rows out of the snapshot: its latest rows
        with `time`, otherwise whole groups with `group`, otherwise a share
        stratified by class or target.
      required:
      - target
      - task
      additionalProperties: false
      properties:
        target:
          type: string
          minLength: 1
        task:
          type: string
          enum:
          - classification
          - regression
        column_types:
          type: object
          additionalProperties:
            type: string
            enum:
            - numerical
            - categorical
        time:
          type: string
          minLength: 1
          description: a column of times; a run holds out this snapshot's latest rows
        group:
          type: string
          minLength: 1
          description: a column of group keys; without `time`, a run holds out whole groups
        origin:
          description: |
            where the table came from: `{"kind": "uploaded"}` for one
            uploaded or streamed, the one an upload gets when it sends none;
            a live context's rows (`ContextOrigin`); or a synthetic batch's
            (`SyntheticOrigin`), which only the service sets
          oneOf:
          - $ref: '#/components/schemas/UploadedOrigin'
          - $ref: '#/components/schemas/ContextOrigin'
          - $ref: '#/components/schemas/SyntheticOrigin'
    Snapshot:
      type: object
      description: |
        A named, immutable table. `digest`, `rows` and `columns` are set
        once it is `ready`; `origin` says where it was uploaded from. A create that opens an upload also carries
        where its bytes go: `url`, `method` and `chunk_bytes`.
      required:
      - name
      - state
      - digest
      - bytes
      - rows
      - columns
      - metadata
      - tags
      - error
      - expires
      - created
      additionalProperties: false
      properties:
        origin:
          $ref: '#/components/schemas/Origin'
        name:
          $ref: '#/components/schemas/Name'
        state:
          $ref: '#/components/schemas/SnapshotState'
        digest:
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
        bytes:
          type: integer
          minimum: 0
          description: the stored table's size; 0 while a synthetic table is pending or after it was rejected
        rows:
          anyOf:
          - type: integer
          - type: 'null'
        columns:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/SnapshotColumn'
          - type: 'null'
        metadata:
          anyOf:
          - $ref: '#/components/schemas/SnapshotMetadata'
          - type: 'null'
        tags:
          type: array
          maxItems: 18
          description: |
            labels to find the snapshot by, sorted and without repeats.
            Besides the tags a user gave, the service adds reserved tags no
            request may set: `uploaded` on every snapshot of real data,
            uploaded, streamed or made from a live context, and `synthetic`
            and `synthetic-<batch>` on every table
            of a synthetic batch, so `snapshots.list` with
            `tag=synthetic-credit-warmup` lists that batch. Changing the
            user's tags (`snapshots.update`) keeps the reserved ones and
            changes neither its digest nor its rows, nor any run that reads
            it: a run pins digests, not tags.
          items:
            $ref: '#/components/schemas/RunTag'
        error:
          anyOf:
          - type: string
          - type: 'null'
        expires:
          description: when an open upload expires, in seconds since the epoch; null otherwise
          anyOf:
          - type: number
          - type: 'null'
        created:
          type: number
          description: when the snapshot was created, in seconds since the epoch
        url:
          description: a resumable session to `PUT` the bytes to, or null to send them to the plane's `snapshots.bytes`
          anyOf:
          - type: string
          - type: 'null'
        method:
          type: string
          enum:
          - PUT
        chunk_bytes:
          type: integer
          minimum: 1
    SnapshotReply:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - result
        properties:
          result:
            $ref: '#/components/schemas/Snapshot'
    SnapshotList:
      type: object
      required:
      - snapshots
      additionalProperties: false
      properties:
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
    SnapshotListReply:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - result
        properties:
          result:
            $ref: '#/components/schemas/SnapshotList'
    SnapshotCreate:
      type: object
      required:
      - name
      - bytes
      - format
      - metadata
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
          description: the snapshot's name, unique in the project and never reused
        bytes:
          type: integer
          minimum: 1
          maximum: 8589934592
        format:
          type: string
          const: parquet
        metadata:
          $ref: '#/components/schemas/SnapshotMetadata'
        tags:
          type: array
          maxItems: 16
          description: |
            the snapshot's tags, kept sorted and without repeats; none when
            left out. The reserved tags `uploaded`, `synthetic` and any
            starting `synthetic-` are refused with 422; the service adds
            `uploaded` itself.
          items:
            $ref: '#/components/schemas/RunTag'
    SnapshotCreateRequest:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - payload
        properties:
          payload:
            $ref: '#/components/schemas/SnapshotCreate'
    SnapshotUpdate:
      type: object
      description: |
        A snapshot's new tags, which replace the tags a user gave it; an
        empty list clears them. The reserved tags (`uploaded`, `synthetic`
        and any starting `synthetic-`) stay as they are and are refused
        here with 422. Nothing else about a snapshot changes, so any other
        field is refused with 422.
      required:
      - tags
      additionalProperties: false
      properties:
        tags:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/RunTag'
    SnapshotUpdateRequest:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - payload
        properties:
          payload:
            $ref: '#/components/schemas/SnapshotUpdate'
    UploadedOrigin:
      type: object
      description: a table someone uploaded or streamed; an upload's origin when it sends none
      required:
      - kind
      additionalProperties: false
      properties:
        kind:
          type: string
          const: uploaded
    ContextOrigin:
      type: object
      description: a table made from a live context's rows, as they stood at `as_of`
      required:
      - kind
      - context
      - as_of
      additionalProperties: false
      properties:
        kind:
          type: string
          const: context
        context:
          $ref: '#/components/schemas/Name'
          description: the live context the rows came from
        as_of:
          description: the time the rows were read as of, null for the context's latest rows
          anyOf:
          - type: string
          - type: number
          - type: 'null'
    SyntheticOrigin:
      type: object
      description: |
        A table a synthetic batch generated: the batch, the seed the table
        was drawn from, the generator's version, and every option as this
        table used it, with each range replaced by its draw and
        `schema_from` expanded to the schema it copied, with the source
        snapshot's name and digest. The service sets it; an upload that
        sends it is refused with 422.
      required:
      - kind
      - batch
      - seed
      - generator
      - options
      additionalProperties: false
      properties:
        kind:
          type: string
          const: synthetic
        batch:
          $ref: '#/components/schemas/SyntheticBatchName'
        seed:
          type: integer
          minimum: 0
          description: the seed the table was drawn from, the batch's seed plus the table's index unless `reject` turned down earlier draws
        generator:
          type: string
          minLength: 1
          description: the version of the generator that drew the table, as `scm-1`
        options:
          type: object
          description: every option as this table used it, ranges replaced by their draws
    SyntheticBatchName:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,53}$"
      description: |
        a batch's name: a snapshot name of at most 54 characters, so its
        tag `synthetic-<name>` is a tag and its tables' names `<name>-<i>`
        are names
    SyntheticBatchState:
      type: string
      enum:
      - pending
      - done
      description: a batch is `pending` while any of its tables is, then `done`, each table `ready` or `rejected`
    SyntheticFunction:
      type: string
      description: a kind of function a node of a synthetic table's causal graph applies to its parents
      enum: [linear, mlp, tree, gp, discretize, quadratic, cluster]
    SyntheticMissingPattern:
      type: string
      description: how a synthetic table's missing cells fall
      enum: [random, rows, blocks, by_target, censored, latent, near_empty]
    SyntheticRowsRange:
      type: object
      description: a range of rows per table, drawn log-uniformly
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 64, maximum: 50000}
        max: {type: integer, minimum: 64, maximum: 50000}
    SyntheticColumnsRange:
      type: object
      description: a range of feature columns per table
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 2, maximum: 100}
        max: {type: integer, minimum: 2, maximum: 100}
    SyntheticClassesRange:
      type: object
      description: a range of classes per table
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 2, maximum: 10}
        max: {type: integer, minimum: 2, maximum: 10}
    SyntheticCategoriesRange:
      type: object
      description: a range for the most categories a categorical column may have, drawn log-uniformly
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 2, maximum: 1000}
        max: {type: integer, minimum: 2, maximum: 1000}
    SyntheticGraphNodesRange:
      type: object
      description: a range of hidden nodes in a table's causal graph, drawn log-uniformly
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 2, maximum: 64}
        max: {type: integer, minimum: 2, maximum: 64}
    SyntheticGroupsRange:
      type: object
      description: a range of groups of correlated columns per table
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 1, maximum: 4}
        max: {type: integer, minimum: 1, maximum: 4}
    SyntheticLevelsRange:
      type: object
      description: a range of levels a coarsened column is cut into
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 2, maximum: 8}
        max: {type: integer, minimum: 2, maximum: 8}
    SyntheticHighCardinalityRange:
      type: object
      description: a range of high-cardinality categorical columns per table
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 0, maximum: 3}
        max: {type: integer, minimum: 0, maximum: 3}
    SyntheticShareRange:
      type: object
      description: a range of shares from 0 to 1
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: number, minimum: 0, maximum: 1}
        max: {type: number, minimum: 0, maximum: 1}
    SyntheticShare90Range:
      type: object
      description: a range of shares from 0 to 0.9
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: number, minimum: 0, maximum: 0.9}
        max: {type: number, minimum: 0, maximum: 0.9}
    SyntheticShare50Range:
      type: object
      description: a range of shares from 0 to 0.5
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: number, minimum: 0, maximum: 0.5}
        max: {type: number, minimum: 0, maximum: 0.5}
    SyntheticCategorical:
      type: object
      description: how many of a table's feature columns are categorical, and how many categories each may have
      additionalProperties: false
      properties:
        share:
          description: the share of feature columns that are categorical, 0 to 1; 0 to 0.5 when left out
          default: {min: 0, max: 0.5}
          anyOf:
          - {type: number, minimum: 0, maximum: 1}
          - $ref: '#/components/schemas/SyntheticShareRange'
        max_categories:
          description: |
            the most categories a categorical column may have, 2 to 1000;
            each column's count is drawn log-uniformly from 2 up to it; 2 to
            50 when left out
          default: {min: 2, max: 50}
          anyOf:
          - {type: integer, minimum: 2, maximum: 1000}
          - $ref: '#/components/schemas/SyntheticCategoriesRange'
    SyntheticCorrelated:
      type: object
      description: groups of feature columns made to move together through a shared hidden factor
      additionalProperties: false
      properties:
        share:
          description: the share of feature columns put in correlated groups, 0 to 1; 0, none, when left out
          default: 0
          anyOf:
          - {type: number, minimum: 0, maximum: 1}
          - $ref: '#/components/schemas/SyntheticShareRange'
        groups:
          description: how many groups those columns are split into, 1 to 4, each of at least 2 columns; 1 when left out
          default: 1
          anyOf:
          - {type: integer, minimum: 1, maximum: 4}
          - $ref: '#/components/schemas/SyntheticGroupsRange'
        strength:
          description: how strongly a group's columns follow its shared factor, 0 to 1, drawn per group; 0.2 to 0.7 when left out
          default: {min: 0.2, max: 0.7}
          anyOf:
          - {type: number, minimum: 0, maximum: 1}
          - $ref: '#/components/schemas/SyntheticShareRange'
    SyntheticCoarsened:
      type: object
      description: numeric columns cut into a few ordered levels, as a rounded or bucketed measurement is
      additionalProperties: false
      properties:
        share:
          description: the share of numeric columns coarsened, 0 to 1; 0, none, when left out
          default: 0
          anyOf:
          - {type: number, minimum: 0, maximum: 1}
          - $ref: '#/components/schemas/SyntheticShareRange'
        levels:
          description: how many equal-frequency levels a coarsened column is cut into, 2 to 8; 2 to 8 when left out
          default: {min: 2, max: 8}
          anyOf:
          - {type: integer, minimum: 2, maximum: 8}
          - $ref: '#/components/schemas/SyntheticLevelsRange'
    SyntheticMissing:
      type: object
      description: missing cells, null in categorical columns and NaN in numeric ones
      additionalProperties: false
      properties:
        rate:
          description: the share of all feature cells left missing, 0 to 0.9; 0, none, when left out
          default: 0
          anyOf:
          - {type: number, minimum: 0, maximum: 0.9}
          - $ref: '#/components/schemas/SyntheticShare90Range'
        patterns:
          type: array
          minItems: 1
          uniqueItems: true
          default: [random]
          description: |
            how the missing cells fall, the rate split across the patterns
            given: `random` cells, whole `rows`, `blocks` of rows in 2 to 5
            columns, rows of one class or target tail (`by_target`), a
            column's own or another column's tail (`censored`), rows a hidden
            factor makes sparse (`latent`), or a few columns almost wholly
            missing (`near_empty`); `[random]` when left out
          items:
            $ref: '#/components/schemas/SyntheticMissingPattern'
    SyntheticTarget:
      type: object
      description: how noisy, imbalanced or heavy-tailed the target `y` is
      additionalProperties: false
      properties:
        noise:
          description: the noise added to the target's score, as a share of its spread, 0 to 1; 0.01 to 0.1 when left out
          default: {min: 0.01, max: 0.1}
          anyOf:
          - {type: number, minimum: 0, maximum: 1}
          - $ref: '#/components/schemas/SyntheticShareRange'
        label_noise:
          description: the share of class labels flipped to another class, 0 to 0.5, classification only; 0 when left out
          default: 0
          anyOf:
          - {type: number, minimum: 0, maximum: 0.5}
          - $ref: '#/components/schemas/SyntheticShare50Range'
        imbalance:
          description: how unequal the classes are, from 0, balanced, to 1, steeply power-law, classification only; 0 when left out
          default: 0
          anyOf:
          - {type: number, minimum: 0, maximum: 1}
          - $ref: '#/components/schemas/SyntheticShareRange'
        heavy_tail:
          description: how far the target's tails are stretched, from 0, not at all, to 1, strongly, regression only; 0 when left out
          default: 0
          anyOf:
          - {type: number, minimum: 0, maximum: 1}
          - $ref: '#/components/schemas/SyntheticShareRange'
    SyntheticBatchCreate:
      type: object
      description: |
        A synthetic batch: its name, how many tables, the seed, and the
        options every table is drawn with. Each numeric option is an exact
        value or a range `{"min": a, "max": b}`, a <= b, both within the
        option's bounds, drawn once per table; an option left out takes its
        default. `task` is required without `schema_from`.
      required:
      - name
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/SyntheticBatchName'
          description: the batch's name, unique in the project; table `i` is the snapshot `<name>-<i>`
        count:
          type: integer
          minimum: 1
          maximum: 64
          default: 1
          description: how many tables the batch generates, 1 to 64 (a run's data takes at most 64 snapshots); 1 when left out
        seed:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: the seed the batch draws from, table `i` from `seed + i`; a random seed the service records when left out
        schema_from:
          $ref: '#/components/schemas/Name'
          description: |
            a ready snapshot whose feature columns, their types, its task and
            its class count every table copies; `task`, `columns` and
            `classes` that disagree with it, `categorical` and
            `high_cardinality_columns` are then refused
        task:
          type: string
          enum: [classification, regression]
          description: whether each table's target `y` is a class or a number; required without `schema_from`
        rows:
          description: the rows in each table, 64 to 50,000, a range drawn log-uniformly; 4096 when left out
          default: 4096
          anyOf:
          - {type: integer, minimum: 64, maximum: 50000}
          - $ref: '#/components/schemas/SyntheticRowsRange'
        columns:
          description: the feature columns in each table, 2 to 100; `schema_from`'s count, else 2 to 32, when left out
          default: {min: 2, max: 32}
          anyOf:
          - {type: integer, minimum: 2, maximum: 100}
          - $ref: '#/components/schemas/SyntheticColumnsRange'
        classes:
          description: the classes of each table's target, 2 to 10, classification only; `schema_from`'s count, else 2 to 10, when left out
          default: {min: 2, max: 10}
          anyOf:
          - {type: integer, minimum: 2, maximum: 10}
          - $ref: '#/components/schemas/SyntheticClassesRange'
        categorical:
          $ref: '#/components/schemas/SyntheticCategorical'
        functions:
          type: array
          minItems: 1
          uniqueItems: true
          default: [linear, mlp, tree, gp, discretize, quadratic, cluster]
          description: |
            the kinds of function a node of the causal graph may apply to its
            parents, one drawn per node: `linear` maps, small `mlp`s, random
            `tree`s, Gaussian-process-like `gp`s, `discretize` (snap to the
            nearest of a few centers), `quadratic` forms and soft `cluster`
            assignments; every kind when left out
          items:
            $ref: '#/components/schemas/SyntheticFunction'
        graph_nodes:
          description: the hidden nodes of each table's causal graph, 2 to 64, a range drawn log-uniformly; 2 to 32 when left out
          default: {min: 2, max: 32}
          anyOf:
          - {type: integer, minimum: 2, maximum: 64}
          - $ref: '#/components/schemas/SyntheticGraphNodesRange'
        irrelevant_columns:
          description: the share of feature columns drawn apart from the graph, carrying no signal, 0 to 0.9; 0 when left out
          default: 0
          anyOf:
          - {type: number, minimum: 0, maximum: 0.9}
          - $ref: '#/components/schemas/SyntheticShare90Range'
        correlated_columns:
          $ref: '#/components/schemas/SyntheticCorrelated'
        coarsened_columns:
          $ref: '#/components/schemas/SyntheticCoarsened'
        high_cardinality_columns:
          description: |
            how many numeric columns become categorical with 201 or more
            categories, 0 to 3, for tables of at least 400 rows; 0 when left
            out
          default: 0
          anyOf:
          - {type: integer, minimum: 0, maximum: 3}
          - $ref: '#/components/schemas/SyntheticHighCardinalityRange'
        missing:
          $ref: '#/components/schemas/SyntheticMissing'
        target:
          $ref: '#/components/schemas/SyntheticTarget'
        reject:
          type: array
          uniqueItems: true
          default: []
          description: |
            draws to turn down and draw again, up to 20 times before the
            table is `rejected`: `trivial`, a target almost perfectly
            predictable, and `unlearnable`, one no better predicted than by a
            constant; none when left out
          items:
            type: string
            enum: [trivial, unlearnable]
        tags:
          type: array
          maxItems: 16
          description: |
            tags every table carries besides `synthetic` and
            `synthetic-<name>`; the reserved tags are refused with 422
          items:
            $ref: '#/components/schemas/RunTag'
    SyntheticBatchCreateRequest:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - payload
        properties:
          payload:
            $ref: '#/components/schemas/SyntheticBatchCreate'
    SyntheticBatchCreated:
      type: object
      description: a batch as its create answers it, every table pending
      required:
      - name
      - tag
      - count
      - snapshots
      - state
      - created
      - origin
      - url
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/SyntheticBatchName'
        tag:
          $ref: '#/components/schemas/RunTag'
          description: the tag every table carries, `synthetic-<name>`
        count:
          type: integer
          minimum: 1
          maximum: 64
        snapshots:
          type: array
          description: the tables' snapshot names, `<name>-0` to `<name>-<count - 1>`
          items:
            $ref: '#/components/schemas/Name'
        state:
          $ref: '#/components/schemas/SyntheticBatchState'
        created:
          type: number
          description: when the batch was created, in seconds since the epoch
        origin:
          $ref: '#/components/schemas/Origin'
        url:
          type: string
          description: the console page its tables are on
    SyntheticTable:
      type: object
      description: one table of a batch, by its snapshot name, with its state and, once rejected, why
      required:
      - name
      - state
      - error
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        state:
          $ref: '#/components/schemas/SnapshotState'
        error:
          anyOf:
          - type: string
          - type: 'null'
    SyntheticCounts:
      type: object
      description: how many of a batch's tables are in each state
      required:
      - pending
      - ready
      - rejected
      additionalProperties: false
      properties:
        pending:
          type: integer
          minimum: 0
        ready:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
    SyntheticBatch:
      type: object
      description: |
        a batch as `snapshots.synthetic` reads it: its create's answer, and
        the seed, options, tables and counts. Its fields are listed whole, as
        `SyntheticBatchCreated` allows no other fields.
      required: [name, tag, count, snapshots, state, created, origin, url, seed, options, tables, counts]
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/SyntheticBatchName'
        tag:
          $ref: '#/components/schemas/RunTag'
          description: the tag every table carries, `synthetic-<name>`
        count:
          type: integer
          minimum: 1
          maximum: 64
        snapshots:
          type: array
          description: the tables' snapshot names, `<name>-0` to `<name>-<count - 1>`
          items:
            $ref: '#/components/schemas/Name'
        state:
          $ref: '#/components/schemas/SyntheticBatchState'
        created:
          type: number
          description: when the batch was created, in seconds since the epoch
        origin:
          $ref: '#/components/schemas/Origin'
        url:
          type: string
          description: the console page its tables are on
        seed:
          type: integer
          minimum: 0
          description: the seed the batch drew from, the one sent or the one the service chose
        options:
          $ref: '#/components/schemas/SyntheticBatchCreate'
          description: the batch's payload as it was sent
        tables:
          type: array
          items:
            $ref: '#/components/schemas/SyntheticTable'
        counts:
          $ref: '#/components/schemas/SyntheticCounts'
    SyntheticBatchCreatedReply:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - result
        properties:
          result:
            $ref: '#/components/schemas/SyntheticBatchCreated'
    SyntheticBatchReply:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - result
        properties:
          result:
            $ref: '#/components/schemas/SyntheticBatch'
    State:
      type: string
      enum: [pending, building, ready, failed, stopped]

    Revision:
      type: object
      description: "an immutable spec with what it resolved to; the plane keeps its lock beside it"
      required: [predictor, number, status, lock_digest, spec, resolved, origin, created]
      additionalProperties: false
      properties:
        predictor:
          $ref: "#/components/schemas/Name"
        number: {type: integer, minimum: 1}
        status:
          type: string
          enum: [pending, building, ready, failed, stopped]
          description: "where the revision's build stands: `pending` once registered (a dry run's plan is one), `building` while its program is prepared, `ready` once it can serve, `failed` when its build failed, `stopped` once retired; whether an environment serves it is the environment's `state`"
        lock_digest:
          $ref: "#/components/schemas/Digest"
          description: "the digest of the lock the plane keeps beside the revision: what it resolved to, pinned; two revisions with one lock serve the same predictions"
        spec:
          $ref: "#/components/schemas/Spec"
        resolved:
          $ref: "#/components/schemas/Resolved"
        origin:
          $ref: "#/components/schemas/Origin"
        created: {type: string, format: date-time}

    RevisionReply:
      allOf:
      - $ref: "#/components/schemas/Envelope"
      - type: object
        required: [result]
        properties:
          result:
            $ref: "#/components/schemas/Revision"

    RevisionList:
      type: object
      required: [revisions]
      additionalProperties: false
      properties:
        revisions:
          type: array
          items: {$ref: "#/components/schemas/Revision"}

    RevisionListReply:
      allOf:
      - $ref: "#/components/schemas/Envelope"
      - type: object
        required: [result]
        properties:
          result:
            $ref: "#/components/schemas/RevisionList"

    Environment:
      type: object
      description: "a pointer to a revision; `generation` guards promote and rollback"
      required: [name, revision, state, generation, resolved, url]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        revision:
          type:
          - integer
          - "null"
        state:
          type: string
          enum: [starting, ready, failed, stopped]
        generation: {type: integer, minimum: 0}
        resolved:
          oneOf:
          - $ref: "#/components/schemas/Resolved"
          - type: "null"
          description: |
            what the revision the environment serves now resolved to, as that
            revision's `resolved`: while a deploy or promote starts another,
            the one it still serves; null when it serves none
        calls_today: {type: integer, minimum: 0}
        p50_seconds:
          type:
          - number
          - "null"
        updated: {type: string, format: date-time}
        url: {type: string}
        error:
          oneOf:
          - $ref: "#/components/schemas/EnvironmentFailure"
          - type: "null"
          description: "why a `failed` environment failed"

    EnvironmentFailure:
      type: object
      description: |
        why an environment's revision failed to start: the failure in words,
        the request whose deploy or promote started it, and the revision the
        environment still serves (null when it served none)
      required: [message, request_id, serving_revision]
      additionalProperties: false
      properties:
        message: {type: string}
        request_id: {type: [string, "null"]}
        serving_revision: {type: [integer, "null"], minimum: 1}

    EnvironmentReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Environment"}

    EnvironmentList:
      type: object
      required: [environments]
      additionalProperties: false
      properties:
        environments:
          type: array
          items: {$ref: "#/components/schemas/Environment"}

    EnvironmentListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/EnvironmentList"}

    Promote:
      type: object
      description: |
        the revision to point at, or `from_env`, the environment whose revision
        to take; `expected_generation` refuses a change past a stale read
      additionalProperties: false
      properties:
        revision: {type: integer, minimum: 1}
        from_env: {$ref: "#/components/schemas/Name"}
        expected_generation: {type: integer, minimum: 0}

    PromoteRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/Promote"}

    Metrics:
      type: object
      description: |
        serving facts: `context` is the context the environment is serving
        now, `accepted_version`/`serving_version` compare the newest accepted
        write of a live context with the one being served, `fresh` says
        whether they agree (null without a context); `error` is set while
        the environment serves its last good view and a rebuild of it keeps
        failing, else null
      required: [status, error, context, accepted_version, serving_version, fresh, requests, errors, mean_latency_seconds]
      additionalProperties: false
      properties:
        status: {$ref: "#/components/schemas/State"}
        error: {type: [string, "null"], description: why the environment's rebuild is failing}
        context:
          oneOf:
            - $ref: "#/components/schemas/ServingContext"
            - type: "null"
        accepted_version: {type: [integer, string, "null"]}
        serving_version: {type: [integer, string, "null"]}
        fresh: {type: [boolean, "null"]}
        requests: {type: integer, minimum: 0}
        errors: {type: integer, minimum: 0}
        mean_latency_seconds: {type: [number, "null"]}

    ServingContext:
      type: object
      description: |
        the context an environment serves: `source` is `snapshot`,
        `request` or `live/<context>`; the version fields and
        `freshness_lag_seconds` are set for live contexts
      required: [source, version, rows, as_of, accepted_version, serving_version, freshness_lag_seconds]
      additionalProperties: true
      properties:
        source: {type: string}
        version: {type: [integer, string, "null"]}
        rows: {type: integer, minimum: 0}
        as_of: {$ref: "#/components/schemas/AsOf"}
        accepted_version: {type: [integer, string, "null"]}
        serving_version: {type: [integer, string, "null"]}
        freshness_lag_seconds: {type: [number, "null"]}

    MetricsReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Metrics"}

    LogCursor:
      type: string
      pattern: "^[0-9]{1,18}$"
      description: an entry's place in its predictor's log, as a reply gave it

    LogLevel:
      type: string
      enum: [info, warn, error]

    LogEntry:
      type: object
      required: [id, at, level, source, code, message, environment, revision, request_id, fields]
      additionalProperties: false
      description: |
        One thing that happened. `id` is the entry's cursor, which `after`
        and `before` take.
      properties:
        id: {$ref: "#/components/schemas/LogCursor"}
        at:
          type: number
          description: when, in seconds since the epoch
        level: {$ref: "#/components/schemas/LogLevel"}
        source:
          type: string
          description: |
            who says so: `deploy` for a predictor's lifecycle, `plane` for the
            hosted service, `replica <name>` for a replica of the hosted pool,
            `engine` for a server beside the service
        code:
          type: string
          description: what happened, as a stable name such as `Promoted` or `PredictionFailed`
        message:
          type: string
          description: what happened, for a person
        environment:
          type: [string, "null"]
          description: the environment concerned; null for an entry about the whole predictor
        revision:
          type: [integer, "null"]
        request_id:
          type: [string, "null"]
          description: the request that caused it, if one did
        fields:
          type: object
          description: |
            more of what happened, as named numbers, booleans and text: a
            prediction's `key`, `rows`, `status` and `latency_ms`, a refusal's
            `error`, `param` and `help`
          additionalProperties:
            type: [string, number, boolean]

    Logs:
      type: object
      required: [logs, next, previous]
      additionalProperties: false
      description: |
        A page of a log, oldest first. `next` is the cursor to pass as
        `after` for the entries that follow the page.
      properties:
        logs:
          type: array
          items: {$ref: "#/components/schemas/LogEntry"}
        next: {$ref: "#/components/schemas/LogCursor"}
        previous:
          type: [string, "null"]
          pattern: "^[0-9]{1,18}$"
          description: |
            pass as `before` for the entries that precede this page; null when
            the page is empty or reaches the oldest entry kept

