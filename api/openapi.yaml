        enforced: {type: boolean}
        roles:
          type: array
          items: {type: string, enum: [admin, editor, viewer, scorer]}

    KeyIdentity:
      type: object
      required: [id, name, project, expires_at]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}
        name: {$ref: "#/components/schemas/Name"}
        project: {$ref: "#/components/schemas/Name"}
        expires_at: {type: number}

    WorkspaceIdentity:
      type: object
      required: [id, display_name]
      additionalProperties: false
      properties:
        id: {type: string}
        display_name: {type: string}

    Principal:
      type: object
      description: the credential's kind and id, with what the server knows of it
      required: [kind, id]
      additionalProperties: true
      properties:
        kind: {type: string}
        id: {type: string}

    AuthStatus:
      type: object
      required: [authenticated, principal, google, sign_in, secrets, capabilities, permission_inventory, bootstrap]
      additionalProperties: false
      properties:
        authenticated: {type: boolean, const: true}
        principal: {$ref: "#/components/schemas/Principal"}
        google: {type: string, enum: [configured, unconfigured]}
        sign_in:
          type: array
          items: {type: string, enum: [google, microsoft, github]}
        secrets: {type: string, enum: [configured, unconfigured]}
        capabilities:
          type: array
          items: {$ref: "#/components/schemas/Capability"}
        permission_inventory:
          type: array
          items: {$ref: "#/components/schemas/PermissionGrant"}
        bootstrap: {type: string, enum: [unconfigured, available, consumed]}
        key: {$ref: "#/components/schemas/KeyIdentity"}
        email: {type: [string, "null"]}
        machine: {type: [string, "null"]}
        workspace:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceIdentity"
            - type: "null"

    AuthStatusReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/AuthStatus"}

    LoggedOut:
      type: object
      required: [revoked]
      additionalProperties: false
      properties:
        revoked: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}

    LoggedOutReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/LoggedOut"}

    Organization:
      type: object
      required: [name, account]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        account: {$ref: "#/components/schemas/Name"}

    OrganizationReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Organization"}

    OrganizationCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/Organization"}

    OrganizationList:
      type: object
      required: [organizations]
      additionalProperties: false
      properties:
        organizations:
          type: array
          items: {$ref: "#/components/schemas/Organization"}

    OrganizationListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/OrganizationList"}

    Sso:
      type: object
      required: [organization, provider, providers, enabled, configured, membership_required]
      additionalProperties: false
      properties:
        organization: {$ref: "#/components/schemas/Name"}
        provider: {type: string, const: google}
        providers:
          type: array
          items: {type: string, enum: [google, microsoft, github]}
        enabled: {type: boolean}
        configured: {type: boolean, description: whether the server can sign anyone in}
        membership_required: {type: boolean, const: true}

    SsoReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Sso"}

    SsoConfigure:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: {type: boolean}

    SsoConfigureRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/SsoConfigure"}

    AuditEvent:
      type: object
      required: [sequence, at, actor, project, action, target, outcome]
      additionalProperties: false
      properties:
        sequence: {type: integer, minimum: 1}
        at: {type: number}
        actor: {type: string}
        project: {$ref: "#/components/schemas/Name"}
        action: {type: string}
        target: {type: string}
        outcome: {type: string}

    AuditLog:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          items: {$ref: "#/components/schemas/AuditEvent"}

    AuditLogReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/AuditLog"}

    CliLoginStart:
      type: object
      required: [machine]
      additionalProperties: false
      properties:
        machine: {type: string, description: the machine the key is named after}

    CliLoginGrant:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      additionalProperties: false
      properties:
        device_code: {type: string, pattern: "^gf_dc_[A-Za-z0-9_-]{43}$"}
        user_code: {type: string, pattern: "^[A-Z0-9]{4}-[A-Z0-9]{4}$"}
        verification_uri: {type: string}
        verification_uri_complete: {type: string}
        expires_in: {type: integer, minimum: 1}
        interval: {type: integer, minimum: 1}

    CliLoginPoll:
      type: object
      required: [device_code]
      additionalProperties: false
      properties:
        device_code: {type: string, pattern: "^gf_dc_[A-Za-z0-9_-]{43}$"}

    CliLoginToken:
      type: object
      required: [access_token, token_type, key, email, workspace, project]
      additionalProperties: false
      properties:
        access_token: {type: string}
        token_type: {type: string, const: bearer}
        key: {$ref: "#/components/schemas/KeyIdentity"}
        email: {type: string}
        workspace: {$ref: "#/components/schemas/WorkspaceIdentity"}
        project: {$ref: "#/components/schemas/Name"}

    LoginErrorReply:
      type: object
      description: |
        why a CLI login cannot go on, outside the envelope as the login is.
        `reason` says which: `authorization_pending` (`Unauthorized`, poll
        again), `slow_down` (`ValidationError`, poll less often),
        `expired_token` and `access_denied` (`Unauthorized`, start again) or
        `rate_limited` (`CapacityExceeded`).
      required: [error]
      additionalProperties: false
      properties:
        error: {$ref: "#/components/schemas/Error"}

    WorkspaceRole:
      type: string
      enum: [admin, editor, viewer, scorer]
      description: a workspace member's role; `admin` manages the workspace
    JoinRequestId: {type: string, pattern: "^jr-[0-9a-f]{16}$"}
    InvitationId: {type: string, pattern: "^inv-[0-9a-f]{16}$"}
    WaitlistId: {type: string, pattern: "^wl-[0-9a-f]{16}$"}
    WorkspaceName: {type: string, minLength: 1, maxLength: 80, description: "a workspace's display name, without leading or trailing spaces"}
    UserCode: {type: string, minLength: 8, maxLength: 16, description: "the code `gf login` prints, `XXXX-XXXX` from BCDFGHJKLMNPQRSTVWXZ, taken in any case and with or without the dash"}
    WorkspaceSummary:
      type: object
      description: "a workspace the caller belongs to: its role there and the projects it may use"
      required: [workspace, display_name, role, admin, default_project, projects]
      additionalProperties: false
      properties:
        workspace: {$ref: "#/components/schemas/Name"}
        display_name: {type: string}
        role:
          oneOf:
            - {$ref: "#/components/schemas/WorkspaceRole"}
            - {type: "null"}
        admin: {type: boolean}
        default_project:
          oneOf:
            - {$ref: "#/components/schemas/Name"}
            - {type: "null"}
        projects:
          type: array
          items: {$ref: "#/components/schemas/Name"}
    WorkspaceDetails:
      allOf:
        - {$ref: "#/components/schemas/WorkspaceSummary"}
        - type: object
          required: [organization, created_at]
          properties:
            organization: {$ref: "#/components/schemas/Name"}
            created_at: {type: number}
    JoinRequest:
      type: object
      description: a request to join a workspace, as the person who asked sees it
      required: [id, workspace, display_name, state, created_at, decided_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/JoinRequestId"}
        workspace: {$ref: "#/components/schemas/Name"}
        display_name: {type: string}
        state:
          type: string
          enum: [pending, approved, denied, cancelled]
        created_at: {type: number}
        decided_at:
          type: [number, "null"]
    JoinRequestAdmin:
      type: object
      description: a request to join a workspace, as its admins see it
      required: [id, workspace, subject, email, name, domain, state, role, created_at, decided_at, decided_by]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/JoinRequestId"}
        workspace: {$ref: "#/components/schemas/Name"}
        subject: {type: string}
        email: {type: string}
        name:
          type: [string, "null"]
        domain: {type: string}
        state:
          type: string
          enum: [pending, approved, denied, cancelled]
        role:
          oneOf:
            - {$ref: "#/components/schemas/WorkspaceRole"}
            - {type: "null"}
        created_at: {type: number}
        decided_at:
          type: [number, "null"]
        decided_by:
          type: [string, "null"]
    OnboardingProfile:
      type: object
      description: the signed-in person's verified email, all null until they sign in again
      required: [email, email_domain, display_name, personal_domain]
      additionalProperties: false
      properties:
        email:
          type: [string, "null"]
        email_domain:
          type: [string, "null"]
        display_name:
          type: [string, "null"]
        personal_domain:
          type: [boolean, "null"]
    DiscoveredWorkspace:
      type: object
      description: a workspace the person's email domain may ask to join
