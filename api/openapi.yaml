openapi: 3.1.0
info:
  title: General Forecast API
  version: gf/v1
  summary: contexts, experiments, predictors from a spec, and fine-tuning
  description: |
    Every request and reply carries the same envelope: `api_version`,
    `project`, `request_id`, `resource` and either `payload` (request),
    `result` (success) or `error` (failure). Four words name the data on
    every route: `context` (rows the model learns from), `queries` (rows to
    score), `inputs` (columns the model may read) and `target` (the column to
    predict). A field that takes a model takes a short name, such as
    `tabicl-v2`, or a full id, such as `general-forecast/tabicl-v2-classifier`;
    a short name resolves to its family's entry for the task given, else the
    task the target column calls for, else the family's only task. Results
    carry both `model` and `short`.

    Every resource result carries `url`, its console page, and `origin`,
    where it was made: clients send `X-GF-Origin: <surface>[;
    notebook=<tool>]; client=<name/version>`, with surface `console`, `cli`,
    `notebook` or `script`; a request without it records `api`.

    Routes under `/v1` outside a project, such as `/v1/projects`,
    `/v1/workspaces` and `/v1/auth/status`, still name the client's project:
    in the envelope, and in an `X-GF-Project` header that must match it. Two
    hosted routes sit outside the envelope as health does: the device login,
    `x-gf-envelope: false`, and the Arrow upload `POST /snapshots`, whose
    body is a stream and whose reply is enveloped.

    `api/generate.py` emits `src/generalforecast/_api.py` and
    `clients/typescript/src/types.ts` from this file; `tests/conformance`
    checks every example here against its schema and, with
    `GF_CONFORMANCE_URL` set, against a running `gf serve`. A request example
    marked `x-gf-invalid: true` is one the schema itself refuses; its reply
    example of the same name shows the error.
    A reply example marked `x-gf-hosted: true` is one only a hosted plane
    gives, such as a fine-tune's, so the replay against `gf serve` skips it.
servers:
  - url: https://app.generalforecast.com
    description: hosted
  - url: http://127.0.0.1:8000
    description: gf serve on this machine
security:
  - apiKey: []
tags:
  - name: predictors
    description: a predictor's predictions, and the ad hoc predictor
  - name: models
    description: the catalog this server can run, with its limits
  - name: health
    description: process readiness, outside the envelope
  - name: hosted
    description: the hosted control plane the console, the SDK and the CLI call

paths:
  /v1/projects/{project}/predictors/{name}/predict:
    post:
      operationId: predictors.predict
      tags: [predictors]
      summary: score queries with a predictor
      description: |
        The predictor's revision supplies the model, target, inputs and
        context. The payload carries `queries`, and `as_of` for a live
        context; `context` is refused with `param: "context"` and the
        message `context is declared by the predictor`, unless the predictor
        is one gf serve serves whose lock takes its context with each
        request. `target`, `inputs`, `model` and `task` are refused with
        `param` naming the field and the message `declared by the
        predictor`, and any other field the payload does not take with
        `param` naming it and a `hint` listing the ones it takes.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/predictor"
        - $ref: "#/components/parameters/prefer"
        - name: env
          in: query
          required: false
          description: |
            the environment whose revision scores the queries; `production` when
            left out. A predictor gf serve serves has no environments and
            takes none.
          schema: {type: string, pattern: "^[a-z][a-z0-9-]{0,62}$", default: production}
      requestBody:
        required: true
        content:
          application/vnd.apache.arrow.stream:
            schema: {type: string, format: binary}
            description: |
              the queries as an Arrow IPC stream, the request envelope as JSON
              in the stream's schema metadata under `gf.request`, its payload
              without `queries`; the SDK sends queries this way, split by bytes
          application/json:
            schema:
              $ref: "#/components/schemas/QueriesRequest"
            examples:
              scored:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-3abb2401f119428db148927c6a0d358c
                  resource: {kind: predictor, name: churn}
                  payload:
                    queries:
                      - {customer_id: 1041, spend: 82.5, plan: pro}
                      - {customer_id: 1042, spend: 12.0, plan: free}
              declared:
                x-gf-invalid: true
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-8f1b2c3d4e5f60718293a4b5c6d7e8f9
                  resource: {kind: predictor, name: churn}
                  payload:
                    target: churned
                    queries:
                      - {customer_id: 1041, spend: 82.5, plan: pro}
              context:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-0c1d2e3f405162738495a6b7c8d9e0f1
                  resource: {kind: predictor, name: churn}
                  payload:
                    context:
                      - {customer_id: 7, spend: 10.0, plan: free, churned: 1}
                    queries:
                      - {customer_id: 1041, spend: 82.5, plan: pro}
              missing:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-5a6b7c8d9e0f1a2b3c4d5e6f708192a3
                  resource: {kind: predictor, name: nothing}
                  payload:
                    queries:
                      - {customer_id: 1041, spend: 82.5, plan: pro}
      responses:
        "200":
          description: one prediction per query, in query order
          content:
            application/vnd.apache.arrow.stream:
              schema: {type: string, format: binary}
              description: |
                to a request that sent its queries as Arrow and accepts it: the
                predictions as an Arrow IPC stream, the reply envelope as JSON
                in the schema metadata under `gf.result`, its result without
                `predictions`
            application/json:
              schema:
                $ref: "#/components/schemas/ResultReply"
              examples:
                scored:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3abb2401f119428db148927c6a0d358c
                    resource: {kind: predictor, name: churn}
                    result:
                      model: general-forecast/tabicl-v2-classifier@sha256:7a01c2e4b6d8f0a2c4e6f8a0b2d4f6a8c0e2f4a6b8d0f2a4c6e8f0a2b4d6f8a0
                      task: classification
                      context: {source: snapshot, name: null, version: null, digest: sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e, rows: 1840, as_of: null}
                      revision: 7
                      environment: production
                      predictions:
                        - {id: 1041, label: 0, probabilities: {"0": 0.91, "1": 0.09}}
                        - {id: 1042, label: 1, probabilities: {"0": 0.22, "1": 0.78}}
                      usage: {calls: 1, rows: 2, credits: 0.004, usd: 0.000004}
        "404":
          description: no predictor of that name in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorReply"
              examples:
                missing:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-5a6b7c8d9e0f1a2b3c4d5e6f708192a3
                    resource: {kind: predictor, name: nothing}
                    error:
                      code: NotFound
                      message: predictor nothing is not in project acme
                      param: name
                      hint: list predictors with `gf predictors list`
        "422":
          description: the payload names something the predictor declares
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorReply"
              examples:
                declared:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-8f1b2c3d4e5f60718293a4b5c6d7e8f9
                    resource: {kind: predictor, name: churn}
                    error:
                      code: ValidationError
                      message: declared by the predictor
                      param: target
                      hint: remove `target` from the payload; churn predicts `churned`
                context:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-0c1d2e3f405162738495a6b7c8d9e0f1
                    resource: {kind: predictor, name: churn}
                    error:
                      code: ValidationError
                      message: context is declared by the predictor
                      param: context
                      hint: churn reads its context from the stored context customers
        "202":
          $ref: "#/components/responses/Accepted"
        "503":
          $ref: "#/components/responses/NotReady"

  /v1/projects/{project}/predict:
    post:
      operationId: predict
      tags: [predictors]
      summary: score queries with an ad hoc predictor
      description: |
        The payload is a predictor's fields plus rows: `model`, `target`,
        `context` and `queries` are required; every other field of
        `Manifest` takes a predictor spec's names and defaults, and a field
        it does not list is refused with `param` naming it and a `hint`
        listing the ones it takes. `model` takes a full id or a family's
        short name, such as `tabicl-v2`, which resolves for the task the
        target column calls for (`AmbiguousReference` only when the column
        cannot say). There is no `task` and no `options` object: `task` is
        refused with `param: "task"`.

        `inputs` is a list of columns, or the rule `{exclude, types, past,
        future}`, whose fields may instead sit at the top level as a
        predictor spec has them; each is given once. Left out, the inputs
        are every column of the context without a role, less `exclude`. A
        forecaster's `past` and `future` are inputs whatever else is, and
        its other inputs are past covariates; `related` groups its series.
        `types` overrides inferred types: at the top level in a spec's
        `ColumnType`, in `inputs.types` in the engine's `Kind`. `selection`,
        for a tabular model, fixes each query's rows against the model's
        row cap; left out, the context reads whole while the device holds
        it and by retrieval past that, as the result's `context.used` says.

        The rows bind as a request context's do, so text and category
        inputs are read as the model reads them in process. No row, query,
        series or input count is refused, and a context past what the model
        was trained on carries a note. Every limit error carries `limit`
        and `actual` and names the model in `message`.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/prefer"
      requestBody:
        required: true
        content:
          application/vnd.apache.arrow.stream:
            schema: {type: string, format: binary}
            description: |
              the queries as an Arrow IPC stream, the request envelope as JSON
              in the stream's schema metadata under `gf.request`, its payload
              without `queries`; the SDK sends queries this way, split by bytes
          application/json:
            schema:
              $ref: "#/components/schemas/ManifestRequest"
            examples:
              scored:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-1f2e3d4c5b6a79880716253443526170
                  resource: {kind: predictor, name: ad-hoc}
                  payload:
                    model: general-forecast/tabicl-v2-classifier
                    target: churned
                    id: customer_id
                    inputs: [spend, plan]
                    context:
                      - {customer_id: 1, spend: 10.0, plan: free, churned: 1}
                      - {customer_id: 2, spend: 95.0, plan: pro, churned: 0}
                      - {customer_id: 3, spend: 40.0, plan: pro, churned: 0}
                      - {customer_id: 4, spend: 5.0, plan: free, churned: 1}
                    queries:
                      - {customer_id: 1041, spend: 82.5, plan: pro}
              forecast:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-2a3b4c5d6e7f8091a2b3c4d5e6f70819
                  resource: {kind: predictor, name: ad-hoc}
                  payload:
                    model: general-forecast/chronos-2
                    target: units
                    time: date
                    series: [sku]
                    frequency: 1d
                    horizon: 2
                    quantiles: [0.1, 0.5, 0.9]
                    inputs: {past: [], future: [price]}
                    context:
                      - {sku: a, date: "2026-01-01", price: 9.5, units: 12}
                      - {sku: a, date: "2026-01-02", price: 9.5, units: 14}
                      - {sku: a, date: "2026-01-03", price: 9.0, units: 15}
                      - {sku: a, date: "2026-01-04", price: 9.0, units: 17}
                    queries:
                      - {sku: a, date: "2026-01-05", price: 8.5}
                      - {sku: a, date: "2026-01-06", price: 8.5}
              rule:
                summary: a short name, and inputs and selection by rule
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-4d5e6f708192a3b4c5d6e7f8091a2b3c
                  resource: {kind: predictor, name: ad-hoc}
                  payload:
                    model: tabicl-v2
                    target: churned
                    id: customer_id
                    exclude: [region]
                    types: {plan: category}
                    selection: {core: 2, neighbors: 2}
                    context:
                      - {customer_id: 1, spend: 10.0, plan: free, region: eu, churned: 1}
                      - {customer_id: 2, spend: 95.0, plan: pro, region: us, churned: 0}
                      - {customer_id: 3, spend: 40.0, plan: pro, region: us, churned: 0}
                      - {customer_id: 4, spend: 5.0, plan: free, region: eu, churned: 1}
                    queries:
                      - {customer_id: 1041, spend: 82.5, plan: pro, region: eu}
              task:
                summary: a task, which the route does not take
                x-gf-invalid: true
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-5e6f708192a3b4c5d6e7f8091a2b3c4d
                  resource: {kind: predictor, name: ad-hoc}
                  payload:
                    model: tabicl-v2
                    task: classification
                    target: churned
                    context:
                      - {spend: 10.0, churned: 1}
                      - {spend: 95.0, churned: 0}
                    queries:
                      - {spend: 82.5}
              bare:
                summary: an entry's name without its organization, which is neither a full id nor a family's short name
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-3c4d5e6f708192a3b4c5d6e7f8091a2b
                  resource: {kind: predictor, name: ad-hoc}
                  payload:
                    model: tabicl-v2-classifier
                    target: churned
                    context:
                      - {spend: 10.0, churned: 1}
                      - {spend: 95.0, churned: 0}
                    queries:
                      - {spend: 82.5}
      responses:
        "200":
          description: one prediction per query, in query order
          content:
            application/vnd.apache.arrow.stream:
              schema: {type: string, format: binary}
              description: |
                to a request that sent its queries as Arrow and accepts it: the
                predictions as an Arrow IPC stream, the reply envelope as JSON
                in the schema metadata under `gf.result`, its result without
                `predictions`
            application/json:
              schema:
                $ref: "#/components/schemas/ResultReply"
              examples:
                scored:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-1f2e3d4c5b6a79880716253443526170
                    resource: {kind: predictor, name: ad-hoc}
                    result:
                      model: general-forecast/tabicl-v2-classifier@sha256:7a01c2e4b6d8f0a2c4e6f8a0b2d4f6a8c0e2f4a6b8d0f2a4c6e8f0a2b4d6f8a0
                      task: classification
                      context: {source: request, name: null, version: null, digest: null, rows: 4, as_of: null}
                      predictions:
                        - {id: 1041, label: 0, probabilities: {"0": 0.83, "1": 0.17}}
                      usage: {calls: 1, rows: 1, credits: 0.002, usd: 0.000002}
                forecast:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-2a3b4c5d6e7f8091a2b3c4d5e6f70819
                    resource: {kind: predictor, name: ad-hoc}
                    result:
                      model: general-forecast/chronos-2@sha256:0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f90
                      task: forecast
                      context: {source: request, name: null, version: null, digest: null, rows: 4, as_of: null}
                      predictions:
                        - {value: 18.2, quantiles: {"0.1": 16.1, "0.5": 18.2, "0.9": 20.4}}
                        - {value: 19.0, quantiles: {"0.1": 16.0, "0.5": 19.0, "0.9": 22.1}}
                      usage: {calls: 1, rows: 2, credits: 0.004, usd: 0.000004}
                rule:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-4d5e6f708192a3b4c5d6e7f8091a2b3c
                    resource: {kind: predictor, name: ad-hoc}
                    result:
                      model: general-forecast/tabicl-v2-classifier@sha256:7a01c2e4b6d8f0a2c4e6f8a0b2d4f6a8c0e2f4a6b8d0f2a4c6e8f0a2b4d6f8a0
                      task: classification
                      context: {source: request, name: null, version: null, digest: null, rows: 4, as_of: null}
                      predictions:
                        - {id: 1041, label: 0, probabilities: {"0": 0.83, "1": 0.17}}
                      usage: {calls: 1, rows: 1, credits: 0.002, usd: 0.000002}
        "422":
          description: the fields or the rows are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorReply"
              examples:
                task:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-5e6f708192a3b4c5d6e7f8091a2b3c4d
                    resource: {kind: predictor, name: ad-hoc}
                    error:
                      code: ValidationError
                      message: "task is not a field: the model determines the task, and the target column a short name's"
                      param: task
                bare:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3c4d5e6f708192a3b4c5d6e7f8091a2b
                    resource: {kind: predictor, name: ad-hoc}
                    error:
                      code: ValidationError
                      message: model tabicl-v2-classifier is not a catalog id
                      param: model
                      hint: use general-forecast/tabicl-v2-classifier
                selection:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-6e7f8091a2b3c4d5e6f708192a3b4c5d
                    resource: {kind: predictor, name: ad-hoc}
                    error:
                      code: ValidationError
                      message: selection reads 120000 rows per query; general-forecast/tabicl-v2-classifier reads at most 100000
                      param: selection
                      hint: lower selection.core or selection.neighbors
                      limit: 100000
                      actual: 120000
        "202":
          $ref: "#/components/responses/Accepted"
        "503":
          $ref: "#/components/responses/NotReady"

  /v1/projects/{project}/predictions/{id}:
    get:
      operationId: predictions.get
      tags: [hosted]
      summary: poll a prediction the hosted plane accepted
      description: |
        A prediction sent with `Prefer: respond-async` that the hosted plane
        could not answer in time was accepted with `202` and this route as
        its `Location`, as is one a server given an accepted timeout was
        still running at 0.8 of its request timeout. While it is still starting or running, the reply is
        `202` with the accept's envelope, its current `state`, a
        `Retry-After` and the `Location` again. Once it has its answer, the
        reply is that answer exactly, as the prediction itself would have
        been answered: its status, body and `Retry-After`, a `200` with the
        predictions or the error. It takes the permission predicting does,
        in the project the prediction was made in; an id that is unknown,
        from another project, or expired (answers are kept an hour) is
        `404`.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/prediction"
      responses:
        "200":
          description: the prediction's answer, one prediction per query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultReply"
              examples:
                done:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3abb2401f119428db148927c6a0d358c
                    resource: {kind: predictor, name: churn}
                    result:
                      model: general-forecast/tabicl-v2-classifier@sha256:7a01c2e4b6d8f0a2c4e6f8a0b2d4f6a8c0e2f4a6b8d0f2a4c6e8f0a2b4d6f8a0
                      task: classification
                      context: {source: snapshot, name: null, version: null, digest: sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e, rows: 1840, as_of: null}
                      revision: 7
                      environment: production
                      predictions:
                        - {id: 1041, label: 0, probabilities: {"0": 0.91, "1": 0.09}}
                        - {id: 1042, label: 1, probabilities: {"0": 0.22, "1": 0.78}}
                      usage: {calls: 1, rows: 2, credits: 0.004, usd: 0.000004}
        "202":
          $ref: "#/components/responses/Accepted"
        "404":
          description: no such prediction in the project, or its answer expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorReply"
              examples:
                missing:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c
                    resource: {kind: prediction, name: pred-0123456789abcdef01234567}
                    error:
                      code: NotFound
                      message: prediction pred-0123456789abcdef01234567 is not in project acme

  /v1/projects/{project}/predictors/{name}/environments:
    get:
      operationId: environments.list
      tags: [hosted]
      summary: list a predictor's environments
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/predictor"
      responses:
        "200":
          description: each environment's revision pointer and state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentListReply"
              examples:
                listed:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-a2b3c4d5e6f708192a3b4c5d6e7f8091
                    resource: {kind: predictor, name: churn}
                    result:
                      environments:
                        - {name: staging, revision: 8, state: ready, generation: 3, resolved: {model: general-forecast/kumo-tabular-medium-classifier, short: kumo-medium, model_digest: "sha256:d0f1d0a2b4c6e8f0a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4e6f8", base_digest: null, task: classification, context: customers, context_version: 8, context_digest: "sha256:91ac03b7e5d9f1a3c5e7b9d1f3a5c7e9b1d3f5a7c9e1b3d5f7a9c1e3b5d7f9a1", context_rows: 48210, inputs: [tenure_m, plan], types: {tenure_m: number, plan: category}}, url: "https://app.generalforecast.com/?project=acme#/predictors/churn"}
                        - {name: production, revision: 7, state: ready, generation: 9, resolved: {model: general-forecast/kumo-tabular-medium-classifier, short: kumo-medium, model_digest: "sha256:d0f1d0a2b4c6e8f0a2b4c6d8e0f2a4b6c8d0e2f4a6b8c0d2e4f6a8b0c2d4e6f8", base_digest: null, task: classification, context: customers, context_version: 8, context_digest: "sha256:91ac03b7e5d9f1a3c5e7b9d1f3a5c7e9b1d3f5a7c9e1b3d5f7a9c1e3b5d7f9a1", context_rows: 48210, inputs: [tenure_m, plan], types: {tenure_m: number, plan: category}}, url: "https://app.generalforecast.com/?project=acme#/predictors/churn"}

  /v1/projects/{project}/predictors/{name}/environments/{environment}:
    get:
      operationId: environments.get
      tags: [hosted]
      summary: show one environment
