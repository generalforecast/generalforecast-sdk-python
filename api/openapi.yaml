  /readyz:
    get:
      operationId: ready
      tags: [health]
      security: []
      summary: 200 once every served model is loaded and compiled
      description: |
        Readiness has no project and so no envelope. Before every served
        model is loaded and compiled the reply is 503 with
        `{"error": {"code": "ModelNotReady"}}`; `/predict` answers the same
        way, so a 200 here means predictions will not wait on a compile. A
        hosted plane's 200 also names its `build`.
      responses:
        "200":
          description: every served model is loaded and compiled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ready:
                  value: {status: ok}
        "503":
          description: a served model is still loading or compiling
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthError"
              examples:
                loading:
                  value:
                    error:
                      code: ModelNotReady
                      message: general-forecast/tabicl-v2-classifier is compiling 12 programs
                      hint: poll /readyz until it answers 200

  /livez:
    get:
      operationId: live
      tags: [health]
      security: []
      summary: 200 while the process answers, whether or not its models are ready
      description: |
        Liveness has no project and so no envelope. It answers 200 from the
        moment the server listens, while models still load or compile, so a
        supervisor restarts a process that stops answering without waiting
        on one that is only warming up; `/readyz` says when it is ready.
      responses:
        "200":
          description: the process answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                live:
                  value: {status: ok}

