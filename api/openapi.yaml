  /v1/projects/{project}/predictors/{name}/check:
    post:
      operationId: predictors.check
      tags: [hosted]
      summary: resolve a gf.yaml against its snapshot and answer the gf.lock
      description: |
        `gf check` uploads the manifest's snapshot file first (an Arrow
        stream through `snapshots.upload`, its rows as `pyarrow.csv` or
        `pyarrow.parquet` reads them), then sends the manifest's text with
        the snapshot's name. The service resolves the manifest as a
        revision is resolved and answers the lock to write, byte for byte
        the gf.lock gf check writes for the same gf.yaml, file and previous
        lock; what it inferred; the changes from `previous`; the normalized
        manifest `gf push` registers; and the resolved context.

        The manifest's `name` defaults to the route's; a manifest naming
        another predictor is refused (`ValidationError`, param `name`). A
        model digest other than the one `previous` pins is refused unless
        `upgrade` is true. With `keep`, a snapshot context's resolved rows
        are stored as the snapshot `<name>-<12 hex of their digest>` and
        `snapshot` answers it; `gf push` then registers the revision with
        `lock`, `snapshot.digest` and `manifest`. Without `keep` nothing is
        written, and the predictor need not exist.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/predictor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictorCheckRequest"
            examples:
              checked:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6
                  resource: {kind: predictor, name: churn}
                  payload:
                    manifest: "name: churn\nmodel: general-forecast/tabicl-v2-classifier\ntarget: churned\ncontext: {snapshot: context.csv}\n"
                    snapshot: churn-5fb6a4c6f24b
                    previous: null
                    upgrade: false
                    keep: false
      responses:
        "200":
          description: the lock to write, the model it pins, what was inferred and what changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictorCheckReply"
              examples:
                checked:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6
                    resource: {kind: predictor, name: churn}
                    result:
                      lock:
                        lock_version: 2
                        digest: sha256:b8858e48496369e48c8593d5808e8721f7b9d39fc9668bb2184230823c787da9
                        manifest: sha256:1f3e5d7c9b1a3f5e7d9c1b3a5f7e9d1c3b5a7f9e1d3c5b7a9f1e3d5c7b9a1f3e
                        predictor:
                          name: churn
                          model: general-forecast/tabicl-v2-classifier
                          model_digest: sha256:7a01c2e4b6d8f0a2c4e6f8a0b2d4f6a8c0e2f4a6b8d0f2a4c6e8f0a2b4d6f8a0
