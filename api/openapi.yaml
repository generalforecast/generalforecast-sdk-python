        name: {$ref: "#/components/schemas/Name"}
        organization: {$ref: "#/components/schemas/Name"}

    ProjectCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/ProjectCreate"}

    Permission:
      type: string
      description: |
        A project permission a key or role holds. Fine-tuning's:
        `snapshots:read` reads snapshots, `snapshots:write` uploads and
        deletes them, `runs:read` reads runs and their lineage, and
        `runs:write` creates and cancels runs; `models:read` reads the
        fine-tunes runs publish. The admin and editor roles hold all four;
        the viewer role holds `snapshots:read` and `runs:read`. `GET /auth/status` lists every permission with the
        roles that hold it.
      enum:
        - predictors:read
        - predictors:write
        - predictors:predict
        - contexts:read
        - contexts:write
        - contexts:history
        - sources:read
        - sources:write
        - models:read
        - snapshots:read
        - snapshots:write
        - runs:read
        - runs:write
        - keys:read
        - keys:write
        - secrets:read
        - secrets:write
        - members:read
        - members:write
        - sso:read
        - sso:write
        - audit:read
        - operators:read
        - operators:write
        - projects:read

    Key:
      type: object
      description: "`token` is present only in the create and rotate replies"
      required: [id, project, name, permissions, created_at, expires_at, revoked_at]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}
        project: {$ref: "#/components/schemas/Name"}
        name: {$ref: "#/components/schemas/Name"}
        permissions:
          type: array
          items: {$ref: "#/components/schemas/Permission"}
        created_at: {type: number}
        expires_at: {type: number}
        revoked_at: {type: [number, "null"]}
        token: {type: string, pattern: "^gf_[A-Za-z0-9_-]{32,}$"}
        replaces: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}

    KeyReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Key"}

    KeyList:
      type: object
      required: [keys]
      additionalProperties: false
      properties:
        keys:
          type: array
          items: {$ref: "#/components/schemas/Key"}

    KeyListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/KeyList"}

    KeyCreate:
      type: object
      required: [name, permissions]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        permissions:
          type: array
          items: {$ref: "#/components/schemas/Permission"}
          minItems: 1
        expires_in:
          type: number
          minimum: 60
          maximum: 7776000
          default: 2592000
          description: seconds; 30 days by default, 90 at most

    KeyCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/KeyCreate"}

    KeyRef:
      type: object
      required: [id]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}

    KeyRefRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/KeyRef"}

    KeyRevoked:
      type: object
      required: [id, revoked]
      additionalProperties: false
      properties:
        id: {type: string}
        revoked: {type: boolean, const: true}

    KeyRevokedReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/KeyRevoked"}

    Secret:
      type: object
      description: metadata only; a value is never returned
      required: [project, name, version, created_at, updated_at]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/Name"}
        name: {$ref: "#/components/schemas/Name"}
        version: {type: integer, minimum: 1}
        created_at: {type: number}
        updated_at: {type: number}

    SecretReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Secret"}

    SecretList:
      type: object
      required: [secrets]
      additionalProperties: false
      properties:
        secrets:
          type: array
          items: {$ref: "#/components/schemas/Secret"}

    SecretListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/SecretList"}

    SecretCreate:
      type: object
      required: [name, value]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        value: {type: string, minLength: 1, maxLength: 65536}

    SecretCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/SecretCreate"}

    SecretRotate:
      type: object
      required: [name, value, expected_version]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        value: {type: string, minLength: 1, maxLength: 65536}
        expected_version: {type: integer, minimum: 1}

    SecretRotateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/SecretRotate"}

    SecretRef:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}

    SecretRefRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/SecretRef"}

    SecretDeleted:
      type: object
      required: [name, deleted]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        deleted: {type: boolean, const: true}

    SecretDeletedReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/SecretDeleted"}

    RunState:
      type: string
      enum:
      - queued
      - setting_up
      - training
      - preempted
      - finished
      - cancelling
      - cancelled
      - failed
    RunData:
      type: object
      description: a snapshot a run reads, by its name and the digest the name had when the run was created
      required:
      - name
      - digest
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        digest:
          $ref: '#/components/schemas/Digest'
        phase:
          $ref: '#/components/schemas/Name'
          description: the phase that reads it, in a curriculum run's `data`; absent otherwise
    RunMethod:
      type: object
      description: |
        How a run changes the network: `{"type": "lora", "rank": 16}`, with
        `"input_adapter": true` to train an input adapter in front of it;
        `{"type": "input_adapter"}`; or `{"type": "full", "components":
        [...]}`, some of `column_encoder`, `row_encoder`,
        `in_context_transformer` and `prediction_head`. A method the base
        does not take is refused with 422.
      required:
      - type
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - lora
          - input_adapter
          - full
        rank:
          type: integer
          minimum: 1
          maximum: 256
          description: LoRA's rank, which `lora` needs
        input_adapter:
          type: boolean
          description: whether an input adapter trains beside LoRA; false when left out
        components:
          type: array
          minItems: 1
          description: the components full fine-tuning trains, which `full` needs
          items:
            $ref: '#/components/schemas/RunComponent'
    RunComponent:
      type: string
      description: a component full fine-tuning may train
      enum:
      - column_encoder
      - row_encoder
      - in_context_transformer
      - prediction_head
    RunArchitectureComponent:
      type: string
      description: a standard component kind of the shared attention block, or an addition to a model's cell embeddings, the same in every model
      enum:
      - attention.kv_heads
      - attention.query_scale
      - attention.qk_norm
      - attention.output_gate
      - positional_encoding
      - norm
      - norm_placement
      - feed_forward
      - attention.temperature
      - feed_forward_branch
      - cell_embedding.numeric
      - cell_embedding.categorical
    RunArchitectureOption:
      type: object
      description: |
        What a component becomes: `{"type": <option>}` with the option's
        settings beside it, as `{"type": "grouped", "heads": 2}` or
        `{"type": "rope", "theta": 10000}`. A catalog model's
        `architecture` lists each component's options, their settings and
        defaults; a setting left out takes its default, and an unknown one
        is refused with 422.
      required:
      - type
      properties:
        type:
          type: string
      additionalProperties:
        type:
        - integer
        - number
        - boolean
        - 'null'
    RunArchitectureInitType:
      type: string
      description: an init type, as a catalog model's `architecture.inits` lists them
      enum:
      - default
      - zeros
      - ones
      - constant
      - normal
      - truncated_normal
      - uniform
      - xavier_uniform
      - xavier_normal
      - kaiming_uniform
      - kaiming_normal
      - orthogonal
    RunArchitectureInit:
      type: object
      description: |
        How a change's new parameters start, each matching its
        `torch.nn.init` / `jax.nn.initializers` namesake: `default` (the
        option's documented init), `zeros`, `ones`, `constant` (`value`),
        `normal` (`mean` 0 and `std` 0.02 when left out),
        `truncated_normal` (`std` 0.02, cut at 2 standard deviations),
        `uniform` (`low` 0 and `high` 1), and `xavier_uniform`,
        `xavier_normal`, `kaiming_uniform`, `kaiming_normal` (fan in, ReLU
        gain) and `orthogonal`, which draw the change's matrices while its
        vectors take the option's default. Draws are deterministic in the
        run's `seed`, the component and the stage. Every init is accepted
        for every option with parameters.
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/RunArchitectureInitType'
      additionalProperties:
        type: number
    RunArchitectureChange:
      type: object
      description: |
        One change to the base's architecture, as a create sends it:
        `{"component": "attention.query_scale", "stages": ["icl"], "to":
        {"type": "gated_log_scale"}, "init": {"type": "normal", "std":
        0.02}}`. `stages` left out is every stage of the base that can take
        the option; `init` left out is `{"type": "default"}`, and an option
        without parameters (`none`, `pre`, `all`, `grouped`, `rope`) takes
        none.
      required:
      - component
      - to
      additionalProperties: false
      properties:
        component:
          $ref: '#/components/schemas/RunArchitectureComponent'
        stages:
          type: array
          minItems: 1
          description: some of the base's stages, as its catalog view lists them
          items:
            type: string
        to:
          $ref: '#/components/schemas/RunArchitectureOption'
        init:
          $ref: '#/components/schemas/RunArchitectureInit'
    RunResolvedArchitectureChange:
      type: object
      description: |
        A change as the run resolved it and its version records it: the
        stages it applies in, the option with every setting filled in (a
        null `hidden` is the block's own width), and its init with every
        setting filled in, null for an option without parameters
      required:
      - component
      - stages
      - to
      - init
      additionalProperties: false
      properties:
        component:
          $ref: '#/components/schemas/RunArchitectureComponent'
        stages:
          type: array
          items:
            type: string
        to:
          $ref: '#/components/schemas/RunArchitectureOption'
        init:
          anyOf:
          - $ref: '#/components/schemas/RunArchitectureInit'
          - type: 'null'
    RunWarning:
      type: object
      description: |
        Something about the run to know, which does not stop it.
        `uncalibrated_architecture`: the run changes the base's
        architecture, so the changed model is not calibrated to the base
        and starts from `start_loss` where the base scores `base_loss`, on
        the evaluation rows; both are null until step 0 measures them.
      required:
      - code
      - message
      - base_loss
      - start_loss
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - uncalibrated_architecture
        message:
          type: string
        base_loss:
          description: the base's loss on the evaluation rows; null until measured, or without a finite one
          anyOf:
          - type: number
          - type: 'null'
        start_loss:
          description: the changed model's loss on the same rows at step 0; null until measured, or without a finite one
          anyOf:
          - type: number
          - type: 'null'
    RunWaiting:
      type: object
      description: |
        the synthetic batches a run waits for before it trains, and how many
        of their tables are still pending. `data` holds the snapshots
        already pinned, and the batches' ready tables join it once every
        batch is done; absent once the run is not waiting.
      required:
      - batches
      - pending
      additionalProperties: false
      properties:
        batches:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SyntheticBatchName'
        pending:
          type: integer
          minimum: 0
    RunDataTag:
      type: object
      description: |
        every ready snapshot in the project carrying `tag`, sorted by name.
        The run expands it when it is created, or once the synthetic batches
        it names are done, and keeps the names and digests it found, so
        `runs.get` shows exactly what it trains on and tagging snapshots
        later changes nothing. A tag no ready or generating snapshot
        carries is refused with 422.
      required:
      - tag
      additionalProperties: false
      properties:
        tag:
          $ref: '#/components/schemas/RunTag'
    RunDataItem:
      description: a snapshot a run or phase trains on, by its name, or every ready snapshot carrying a tag
      oneOf:
      - $ref: '#/components/schemas/Name'
      - $ref: '#/components/schemas/RunDataTag'
    RunTag:
      type: string
      pattern: '^[a-z0-9][a-z0-9._:/-]{0,63}$'
      description: a label to find runs or snapshots by, as `recipe:fraud-v1`
    Run:
      type: object
      required:
      - name
      - state
      - reason
      - attempt
      - base
      - data
      - data_digest
      - method
      - evaluation
      - budget
      - seed
      - tags
      - plan
      - progress
      - created
      - updated
      - published
      - model
      - version
      additionalProperties: false
      properties:
        model:
          $ref: '#/components/schemas/RunModel'
          description: |
            the run's name: the model it publishes, `<project>/<name>@ft<version>`,
            fixed when it is created. The SDK's `runs` methods take it, and
            every `/runs/{run}` route takes it without its project,
            `<name>@ft<version>`. Once the run publishes, `published.model` is
            the same id.
        name:
          $ref: '#/components/schemas/Name'
          description: the fine-tune the run trains, the `name` its create sent
        version:
          type: integer
          minimum: 1
          description: the version the run publishes, `<project>/<name>@ft<version>`, fixed when
            it is created; a run that ends without publishing leaves that version unpublished,
            and the name's next run takes the next one
        state:
          $ref: '#/components/schemas/RunState'
        reason:
          description: why the run ended as it did, as `data` for a run whose synthetic batch ended with no ready table; null when there is nothing to say
          anyOf:
          - type: string
          - type: 'null'
        attempt:
          type: integer
          minimum: 0
        base:
          $ref: '#/components/schemas/ModelId'
          description: the catalog model the run trains from
        data:
          type: array
          description: |
            the snapshots the run reads, each pinned to its digest and each
            its own table; for a curriculum run every phase's snapshots in
            phase order, each with the `phase` that reads it
          items:
            $ref: '#/components/schemas/RunData'
        data_digest:
          description: |
            the digest of the data's digests, in order; runs of the same data
            share it. A curriculum run's is over its phases in order, each
            phase's name and its digests in order, so it is never a run
            with `data`'s. Null while the run is `waiting`.
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
        waiting:
          $ref: '#/components/schemas/RunWaiting'
          description: |
            the synthetic batches the run waits for before it trains,
            `{"batches": [...], "pending": <tables still pending>}`; absent
            when it waits for none
        phases:
          type: array
          description: a curriculum run's phases, in the order they train, each with its data pinned;
            absent for a run with `data`
          items:
            $ref: '#/components/schemas/RunPinnedPhase'
        architecture:
          type: array
          description: the changes to the base's architecture, resolved, in the order they apply;
            absent for a run that changes none
          items:
            $ref: '#/components/schemas/RunResolvedArchitectureChange'
        warnings:
          type: array
          description: what to know about the run that does not stop it; absent when there is nothing
          items:
            $ref: '#/components/schemas/RunWarning'
        progress:
          description: how far training has got, as of the trainer's latest report; null before the
            first
          anyOf:
          - $ref: '#/components/schemas/RunProgress'
          - type: 'null'
        method:
          $ref: '#/components/schemas/RunMethod'
        evaluation:
          $ref: '#/components/schemas/RunEvaluation'
        budget:
          anyOf:
          - type: object
          - type: 'null'
        seed:
          type: integer
        tags:
          type: array
          items:
            $ref: '#/components/schemas/RunTag'
        plan:
          description: how the run trains; for a curriculum run, the settings that span the whole run,
            `{}` when none were sent, while each phase's plan is in `phases`
          anyOf:
          - $ref: '#/components/schemas/RunPlan'
          - $ref: '#/components/schemas/RunCurriculumPlan'
        created:
          type: number
        updated:
          type: number
        usage:
          description: the GPU time the run metered and what it cost; null where nothing meters it
          anyOf:
          - $ref: '#/components/schemas/RunUsage'
          - type: 'null'
        published:
          description: the version the run published, once it has; null until then, and for a run that
            ends without publishing
          anyOf:
          - $ref: '#/components/schemas/RunPublished'
          - type: 'null'
    RunPhase:
      type: object
      description: |
        One phase of a curriculum run, as a create sends it: its `name`,
        unique in the run; the ready snapshots it trains on, unique in the
        phase, each its own table with its own encoding and holdout; and
        its `plan` (`RunPhasePlan`), its steps and how it samples episodes.
      required:
      - name
      - data
      - plan
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        data:
          type: array
          minItems: 1
          maxItems: 64
          description: |
            the ready snapshots the phase trains on, each a name or
            `{"tag": "<tag>"}` for every ready snapshot carrying the tag
            (`RunDataTag`); a snapshot may be in several phases. The run
            pins each to its digest. An episode draws from one table, and a
            table's share of the phase's episodes is its training rows over
            the phase's.
          items:
            $ref: '#/components/schemas/RunDataItem'
        plan:
          $ref: '#/components/schemas/RunPhasePlan'
    RunPhasePlan:
      type: object
      description: |
        A phase's own settings: its `steps`, how it samples episodes and its
        episodes per step, `{"steps": 400, "episode_sampling": {"rows":
        1024}}`. A setting left out takes the service's default, never the
        phase before's. Every other plan setting is set for the whole run,
        in the run's `plan` (`RunCurriculumPlan`), and is refused here with
        422.
      required:
      - steps
      additionalProperties: false
      properties:
        steps:
          type: integer
          minimum: 1
          maximum: 10000000
          description: how many steps the phase trains
        episode_sampling:
          $ref: '#/components/schemas/EpisodeSampling'
        episodes_per_step:
          type: integer
          minimum: 1
          maximum: 64
    RunCurriculumPlan:
      type: object
      description: |
        The settings of a curriculum run that span the whole run: the
        optimizer's, the learning-rate schedule's, the checks' and the
        checkpoints', `{"learning_rate": 1e-4, "warmup_steps": 20,
        "eval_steps": 25}`. One optimizer and one schedule run over the
        phases' steps together, and the trained weights and the
        optimizer's moments carry from one phase into the next. Checks,
        `early_stopping_patience` and the kept step belong to the last
        phase alone, from its first step; checkpoints are saved in every
        phase. `steps`, `episode_sampling` and `episodes_per_step` are set
        per phase (`RunPhasePlan`) and are refused here with 422.
      additionalProperties: false
      properties:
        learning_rate:
          type: number
          minimum: 1.0e-08
          maximum: 1
          description: the peak learning rate; 1e-4, or 1e-5 for full fine-tuning, when left out
        optimizer:
          type: string
          enum: [adamw]
        schedule:
          type: string
          enum: [cosine]
          description: a linear warmup, then a cosine to a tenth of the peak rate, over every phase's
            steps
        warmup_steps:
          type: integer
          minimum: 0
          description: the steps of the linear warmup, 20 when left out
        weight_decay:
          type: number
          minimum: 0
          maximum: 1
        beta2:
          type: number
          minimum: 0.5
          maximum: 0.99999
        grad_clip:
          type: number
          minimum: 1.0e-06
          maximum: 1000000
        eval_steps:
          type: integer
          minimum: 1
          maximum: 10000
          description: the steps between checks on the select rows in the last phase, 20 when left out
        early_stopping_patience:
          type: integer
          minimum: 0
          maximum: 1000
          description: checks in a row in the last phase that do not lower the run's lowest select
            loss, kept or not, before training stops; 0, never, when left out
        save_steps:
          type: integer
          minimum: 1
          maximum: 10000000
          description: the steps of a phase between checkpoints
        save_total_limit:
          type: integer
          minimum: 0
          maximum: 100
          description: the checkpoints kept besides the best
        save_only_model:
          type: boolean
          description: whether a checkpoint keeps the trained weights alone, without the optimizer's state
    RunPinnedPhase:
      type: object
      description: a curriculum run's phase as the run keeps it, each snapshot pinned to its digest
      required:
      - name
      - data
      - plan
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        data:
          type: array
          items:
            $ref: '#/components/schemas/RunData'
        plan:
          $ref: '#/components/schemas/RunPhasePlan'
    RunProgress:
      type: object
      description: |
        Where training is: the steps trained over the whole run and the
        latest training loss. A curriculum run adds the phase it is in, by
        name and by its place in `phases` (from 0), the steps trained within
        that phase, and each phase reached so far with its own steps and
        latest training loss.
      required:
      - step
      - loss
      additionalProperties: false
      properties:
        step:
          type: integer
          minimum: 0
          description: the steps trained, over every phase
        loss:
          description: the latest training loss; null without a finite one
          anyOf:
          - type: number
          - type: 'null'
        phase:
          $ref: '#/components/schemas/Name'
          description: the phase training is in
        phase_index:
          type: integer
          minimum: 0
          description: that phase's place in `phases`, from 0
        phase_step:
          type: integer
          minimum: 0
          description: the steps trained within that phase
        phases:
          type: array
          description: each phase reached so far, in order
          items:
            $ref: '#/components/schemas/RunPhaseProgress'
    RunPhaseProgress:
      type: object
      description: one phase's training so far
      required:
      - name
      - step
      - loss
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        step:
          type: integer
          minimum: 0
          description: the steps the phase has trained
        loss:
          description: the phase's latest training loss; null without a finite one
          anyOf:
          - type: number
          - type: 'null'
    RunPlan:
      type: object
      description: |
        How a run trains: its `steps`, how it samples episodes, the
        optimizer's settings and its checkpoint settings,
        `{"steps": 200, "learning_rate": 5e-5, "episode_sampling": {"rows": 1024}}`.
        A setting the trainer does not read is refused with 422.
      required:
      - steps
      additionalProperties: false
      properties:
        steps:
          type: integer
          minimum: 1
          maximum: 10000000
          description: how many steps the run trains
        episode_sampling:
          $ref: '#/components/schemas/EpisodeSampling'
        learning_rate:
          type: number
          minimum: 1.0e-08
          maximum: 1
          description: the peak learning rate; 1e-4, or 1e-5 for full fine-tuning, when left out
        optimizer:
          type: string
          enum: [adamw]
        schedule:
          type: string
          enum: [cosine]
          description: a linear warmup, then a cosine to a tenth of the peak rate
        warmup_steps:
          type: integer
          minimum: 0
          description: the steps of the linear warmup, 20 when left out
        weight_decay:
          type: number
          minimum: 0
          maximum: 1
        beta2:
          type: number
          minimum: 0.5
          maximum: 0.99999
        grad_clip:
          type: number
          minimum: 1.0e-06
          maximum: 1000000
        episodes_per_step:
          type: integer
          minimum: 1
          maximum: 64
        eval_steps:
          type: integer
          minimum: 1
          maximum: 10000
          description: the steps between checks on the select rows, 20 when left out
        early_stopping_patience:
          type: integer
          minimum: 0
          maximum: 1000
          description: checks in a row that do not lower the run's lowest select loss, kept or not,
            before training stops; 0, never, when left out
        save_steps:
          type: integer
          minimum: 1
          maximum: 10000000
          description: the steps between checkpoints
        save_total_limit:
          type: integer
          minimum: 0
          maximum: 100
          description: the checkpoints kept besides the best
        save_only_model:
          type: boolean
          description: whether a checkpoint keeps the trained weights alone, without the optimizer's state
    EpisodeSampling:
      type: object
      description: how the trainer draws an episode from the table's training rows
      additionalProperties: false
      properties:
        rows:
          description: an episode's rows, or `auto` for 640 (fewer when the table has fewer)
          oneOf:
          - type: integer
            minimum: 16
            maximum: 16384
          - type: string
            enum: [auto]
        context_fraction:
          type: number
          minimum: 0.5
          maximum: 0.95
          description: the share of an episode's rows that are its context, 0.8 when left out
    RunPublished:
      type: object
      description: |
        What a run published: the version, its weights' digest, the step the
        weights were kept at and how they scored on the rows the run held
        out, against the base on the same rows. The same as the lineage's
        `published` note. A version kept at step 0 predicts exactly as its
        base does: no check during training beat the base.
      required:
      - model
      - digest
      - kept_step
      - validation_loss
      - base_validation_loss
      additionalProperties: false
      properties:
        model:
          $ref: '#/components/schemas/ModelId'
          description: the version's id, `<project>/<name>@ft<version>`, which `models.get` reads and
            a predictor's `gf.yaml` names
        digest:
          $ref: '#/components/schemas/Digest'
          description: the digest of the version's weights
        kept_step:
          $ref: '#/components/schemas/KeptStep'
        validation_loss:
          description: the kept weights' loss on the held-out rows; null without a finite one
          anyOf:
          - type: number
          - type: 'null'
        base_validation_loss:
          description: the base's loss on the same rows; null without a finite one
          anyOf:
          - type: number
          - type: 'null'
        diverged_at_step:
          type: integer
          description: present when the loss stopped being finite there and training stopped; the
            version keeps the best step before it
        check_context_rows:
          type: integer
          description: the rows of each check context
        check_contexts:
          type: integer
          description: how many fixed contexts each check scored the select rows against
        report:
          description: the kept step against the base on the report rows, by table; null without report rows
          anyOf:
          - $ref: '#/components/schemas/RunReport'
          - type: 'null'
    RunReport:
      type: object
      description: the report rows' scores under `data`, the report rows of every snapshot the run
        holds rows out from (a curriculum run's last phase's) scored together
      required:
      - data
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/RunTableReport'
    RunTableReport:
      type: object
      description: |
        Report rows, scored once for the base and once for the kept step
        against the check contexts: their mean losses, the gain (the base's
        loss less the kept step's, above 0 when the kept step is better)
        with its 95% interval from the per-row gains, and task
        metrics for each: log loss, accuracy and, for two classes, ROC AUC;
        or CRPS, RMSE, MAE and R².
      required:
      - rows
      - base
      - kept
      - gain
      - ci95
      - metrics
      additionalProperties: false
      properties:
        rows:
          type: integer
        base:
          type: number
        kept:
          type: number
        gain:
          type: number
        ci95:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: number
        metrics:
          $ref: '#/components/schemas/RunReportMetrics'
    RunReportMetrics:
      type: object
      description: the task metrics of the base's and the kept step's predictions on the report rows
      required:
      - base
      - kept
      additionalProperties: false
      properties:
        base:
          type: object
          additionalProperties:
            type: number
        kept:
          type: object
          additionalProperties:
            type: number
    RunEvaluation:
      type: object
      description: |
        How the run holds out rows and keeps a step. `holdout` of the
        table's rows, clamped to 2,000..50,000 rows, are held out by its
        time column, its group column, or stratified by class or target;
        `report_share` of them are report rows, the rest select rows. Every
        `eval_steps`, a check scores every select row against `contexts`
        fixed contexts of `context_rows` training rows, the base's
        trained row cap when null, and a step becomes the new best only if
        its gain over the base, row by row, is more than
        `early_stopping_threshold.standard_errors` standard errors above 0
        and beats the best so far. Training stops early once the plan's
        `early_stopping_patience` checks in a row have not lowered the
        run's lowest select loss, significant or not, so a run whose gain
        is still rising goes on. A create may leave any setting out; the
        run says each.
      required:
      - holdout
      - context_rows
      - contexts
      - early_stopping_threshold
      - report_share
      additionalProperties: false
      properties:
        holdout:
          type: number
          minimum: 0.05
          maximum: 0.5
          description: the share of the table's rows held out, 0.2 when left out
        context_rows:
          description: the rows of each check context; the base's trained row cap when null
          anyOf:
          - type: integer
            minimum: 256
            maximum: 100000
          - type: 'null'
        contexts:
          type: integer
          minimum: 1
          maximum: 5
          description: the fixed check contexts, 3 when left out
        early_stopping_threshold:
          $ref: '#/components/schemas/EarlyStoppingThreshold'
        report_share:
          type: number
          minimum: 0.2
          maximum: 0.8
          description: the share of the held-out rows reported rather than checked, 0.5 when left out
    EarlyStoppingThreshold:
      type: object
      description: how far above 0 a step's paired gain over the base must be to keep it
      required:
      - standard_errors
      additionalProperties: false
      properties:
        standard_errors:
          type: number
          minimum: 0
          maximum: 5
          description: in standard errors of the per-row gain, 2 when left out
    RunEvaluationRequest:
      type: object
      description: a create's evaluation settings; each left out takes its default (`RunEvaluation`)
      additionalProperties: false
      properties:
        holdout:
          type: number
          minimum: 0.05
          maximum: 0.5
        context_rows:
          type: integer
          minimum: 256
          maximum: 100000
        contexts:
          type: integer
          minimum: 1
          maximum: 5
        early_stopping_threshold:
          $ref: '#/components/schemas/EarlyStoppingThreshold'
        report_share:
          type: number
          minimum: 0.2
          maximum: 0.8
    RunUsage:
      type: object
      required:
      - gpu_seconds
      - charged_gpu_seconds
      - voided_gpu_seconds
      - credits
      additionalProperties: false
      properties:
        gpu_seconds:
          type: number
          description: GPU seconds charged or still pending, as the run's budget counts them
        charged_gpu_seconds:
          type: number
          description: GPU seconds of attempts that ended charged
        voided_gpu_seconds:
          type: number
          description: GPU seconds lost on the service's side, never charged
        credits:
          type: number
          description: what gpu_seconds cost under the workspace's price book, before its included credits
    RunReply:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - result
        properties:
          result:
            $ref: '#/components/schemas/Run'
    RunList:
      type: object
      required:
      - runs
      additionalProperties: false
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/Run'
    RunListReply:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - result
        properties:
          result:
            $ref: '#/components/schemas/RunList'
    RunCreate:
      type: object
      description: |
        A run's settings. It trains on `data` with a `plan` (`RunPlan`), or
        on a curriculum of `phases`, with an optional `plan` of the settings
        that span the whole run (`RunCurriculumPlan`); a create that sends
        both `data` and `phases`, or neither, is refused with 422.
        `method`, `evaluation`, `budget`, `seed` and `tags` apply to the
        whole run either way. Every snapshot is its own table, never pooled
        with another, and has the base's task. With an input adapter every
        snapshot has exactly the last phase's columns in the same order
        (with `data`, every snapshot has the same columns).
      required:
      - name
      - base
      - method
      oneOf:
      - required: [data, plan]
        not:
          required: [phases]
        properties:
          plan:
            $ref: '#/components/schemas/RunPlan'
      - required: [phases]
        not:
          required: [data]
        properties:
          plan:
            $ref: '#/components/schemas/RunCurriculumPlan'
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
          description: |
            the fine-tune the run trains: its first run publishes
            `<project>/<name>@ft1`, and each run after the next version; a
            version never changes once published. A catalog model's name is
            refused with 422.
        base:
          $ref: '#/components/schemas/ModelId'
          description: |
            the catalog model the run trains from, always sent. Every version
            of a fine-tune trains afresh from the same base: another base is
            refused with 409 `base_mismatch`, and a fine-tune with 422
            `base_is_fine_tune`.
        data:
          type: array
          minItems: 1
          maxItems: 64
          description: |
            the ready snapshots the run trains on, each its own table with
            its own encoding and holdout, as one phase: a snapshot's name, or
            `{"tag": "<tag>"}` for every ready snapshot carrying the tag
            (`RunDataTag`), as `[{"tag": "synthetic-credit-warmup"},
            "credit-2026-01"]`. The run pins each snapshot to its digest.
            Never sent with `phases`.
          items:
            $ref: '#/components/schemas/RunDataItem'
        method:
          $ref: '#/components/schemas/RunMethod'
        plan:
          description: |
            how the run trains: with `data`, a `RunPlan`, its `steps`
            required; with `phases`, a `RunCurriculumPlan` of the settings
            that span the whole run, `{}` when left out.
          anyOf:
          - $ref: '#/components/schemas/RunPlan'
          - $ref: '#/components/schemas/RunCurriculumPlan'
        phases:
          type: array
          minItems: 1
          maxItems: 16
          description: |
            a curriculum in place of `data`: phases that train one after
            another, each on its own snapshots with its own `steps`,
            episode sampling and episodes per step (`RunPhase`). Names are
            unique in the run. With an input adapter every snapshot of
            every phase has exactly the last phase's columns, in its order.
            The phases' steps together are held to the step limit.
          items:
            $ref: '#/components/schemas/RunPhase'
        architecture:
          type: array
          minItems: 1
          maxItems: 64
          description: |
            changes to the base's architecture before it trains, at most one
            per component and stage (`RunArchitectureChange`); their new
            parameters train whatever the method. Works with every method
            and with `data` or `phases`.
          items:
            $ref: '#/components/schemas/RunArchitectureChange'
        evaluation:
          $ref: '#/components/schemas/RunEvaluationRequest'
        budget:
          type: object
        seed:
          type: integer
          minimum: 0
        tags:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/RunTag'
    RunCreateRequest:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - payload
        properties:
          payload:
            $ref: '#/components/schemas/RunCreate'
    RunCancel:
      type: object
      description: how a run is cancelled; an empty payload cancels without saving
      additionalProperties: false
      properties:
        save:
          type: boolean
          default: false
          description: publish the weights a training run has trained so far before it ends `cancelled`
    RunCancelRequest:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - payload
        properties:
          payload:
            $ref: '#/components/schemas/RunCancel'
    RunEvent:
      type: object
      required:
      - at
      - kind
      - body
      additionalProperties: false
      properties:
        at:
          type: number
        kind:
          type: string
        body:
          type: object
          description: |
            What happened. A `created` event's body is the run as created,
            its resolved `architecture` included. A `published` event is the run's `published`. A
            `metrics` event is one chunk of training:
            `steps`, `loss`, `validation_loss` and `seconds`; and, where the
            trainer reads them, `compile_seconds`, `train_seconds`,
            `chunk_steps`, `steps_per_second`, `rows_per_second`,
            `gpu_utilization` (%), `gpu_memory_used_bytes`,
            `gpu_memory_total_bytes`, `gpu_power_watts`, `gpu_samples`,
            `device_peak_bytes`, `device_bytes_limit`, `device_bytes_in_use`,
            `device_count`, `device_kind`, `gpu_name` and `gpu_type`. In a
            curriculum run `steps` counts over every phase, and a `metrics`
            event also names its `phase`, `phase_index` (from 0) and
            `phase_step`, the steps trained within that phase; its `loss`
            is that phase's.
    RunLineage:
      type: object
      required:
      - model
      - events
      additionalProperties: false
      properties:
        model:
          $ref: '#/components/schemas/RunModel'
          description: the run's `model`
        events:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
    RunLineageReply:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - result
        properties:
          result:
            $ref: '#/components/schemas/RunLineage'
    SnapshotState:
      type: string
      description: |
        `open` while an upload waits for its bytes, `pending` while a
        synthetic table is generated, then `ready`, or `rejected` with an
        `error`; an upload left open `expired`, and a snapshot `deleted`
      enum:
      - open
      - pending
      - ready
      - rejected
      - expired
      - deleted
    SnapshotColumn:
      type: object
      required:
      - name
      - type
      additionalProperties: false
      properties:
        name:
          type: string
        type:
          type: string
    SnapshotMetadata:
      type: object
      description: |
        A table's training metadata: its `target` and `task`, and
        optionally its `time` and `group` columns, its column types and its
        origin. A run refuses a snapshot without a target and task. The
        columns set how a run holds rows out of the snapshot: its latest rows
        with `time`, otherwise whole groups with `group`, otherwise a share
        stratified by class or target.
      required:
      - target
      - task
      additionalProperties: false
      properties:
        target:
          type: string
          minLength: 1
        task:
          type: string
          enum:
          - classification
          - regression
        column_types:
          type: object
          additionalProperties:
            type: string
            enum:
            - numerical
            - categorical
        time:
          type: string
          minLength: 1
          description: a column of times; a run holds out this snapshot's latest rows
        group:
          type: string
          minLength: 1
          description: a column of group keys; without `time`, a run holds out whole groups
        origin:
          description: |
            where the table came from: `{"kind": "uploaded"}` for one
            uploaded or streamed, the one an upload gets when it sends none;
            a live context's rows (`ContextOrigin`); or a synthetic batch's
            (`SyntheticOrigin`), which only the service sets
          oneOf:
          - $ref: '#/components/schemas/UploadedOrigin'
          - $ref: '#/components/schemas/ContextOrigin'
          - $ref: '#/components/schemas/SyntheticOrigin'
    Snapshot:
      type: object
      description: |
        A named, immutable table. `digest`, `rows` and `columns` are set
        once it is `ready`. A create that opens an upload also carries
        where its bytes go: `url`, `method` and `chunk_bytes`.
      required:
      - name
      - state
      - digest
      - bytes
      - rows
      - columns
      - metadata
      - tags
      - error
      - expires
      - created
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        state:
          $ref: '#/components/schemas/SnapshotState'
        digest:
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
        bytes:
          type: integer
          minimum: 0
          description: the stored table's size; 0 while a synthetic table is pending or after it was rejected
        rows:
          anyOf:
          - type: integer
          - type: 'null'
        columns:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/SnapshotColumn'
          - type: 'null'
        metadata:
          anyOf:
          - $ref: '#/components/schemas/SnapshotMetadata'
          - type: 'null'
        tags:
          type: array
          maxItems: 18
          description: |
            labels to find the snapshot by, sorted and without repeats.
            Besides the tags a user gave, the service adds reserved tags no
            request may set: `uploaded` on every snapshot of real data,
            uploaded, streamed or made from a live context, and `synthetic`
            and `synthetic-<batch>` on every table
            of a synthetic batch, so `snapshots.list` with
            `tag=synthetic-credit-warmup` lists that batch. Changing the
            user's tags (`snapshots.update`) keeps the reserved ones and
            changes neither its digest nor its rows, nor any run that reads
            it: a run pins digests, not tags.
          items:
            $ref: '#/components/schemas/RunTag'
        error:
          anyOf:
          - type: string
          - type: 'null'
        expires:
          description: when an open upload expires, in seconds since the epoch; null otherwise
          anyOf:
          - type: number
          - type: 'null'
        created:
          type: number
          description: when the snapshot was created, in seconds since the epoch
        url:
          description: a resumable session to `PUT` the bytes to, or null to send them to the plane
          anyOf:
          - type: string
          - type: 'null'
        method:
          type: string
          enum:
          - PUT
        chunk_bytes:
          type: integer
          minimum: 1
    SnapshotReply:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - result
        properties:
          result:
            $ref: '#/components/schemas/Snapshot'
    SnapshotList:
      type: object
      required:
      - snapshots
      additionalProperties: false
      properties:
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/Snapshot'
    SnapshotListReply:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - result
        properties:
          result:
            $ref: '#/components/schemas/SnapshotList'
    SnapshotCreate:
      type: object
      required:
      - name
      - bytes
      - format
      - metadata
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
          description: the snapshot's name, unique in the project and never reused
        bytes:
          type: integer
          minimum: 1
          maximum: 8589934592
        format:
          type: string
          const: parquet
        metadata:
          $ref: '#/components/schemas/SnapshotMetadata'
        tags:
          type: array
          maxItems: 16
          description: |
            the snapshot's tags, kept sorted and without repeats; none when
            left out. The reserved tags `uploaded`, `synthetic` and any
            starting `synthetic-` are refused with 422; the service adds
            `uploaded` itself.
          items:
            $ref: '#/components/schemas/RunTag'
    SnapshotCreateRequest:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - payload
        properties:
          payload:
            $ref: '#/components/schemas/SnapshotCreate'
    SnapshotUpdate:
      type: object
      description: |
        A snapshot's new tags, which replace the tags a user gave it; an
        empty list clears them. The reserved tags (`uploaded`, `synthetic`
        and any starting `synthetic-`) stay as they are and are refused
        here with 422. Nothing else about a snapshot changes, so any other
        field is refused with 422.
      required:
      - tags
      additionalProperties: false
      properties:
        tags:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/RunTag'
    SnapshotUpdateRequest:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - payload
        properties:
          payload:
            $ref: '#/components/schemas/SnapshotUpdate'
    UploadedOrigin:
      type: object
      description: a table someone uploaded or streamed; an upload's origin when it sends none
      required:
      - kind
      additionalProperties: false
      properties:
        kind:
          type: string
          const: uploaded
    ContextOrigin:
      type: object
      description: a table made from a live context's rows, as they stood at `as_of`
      required:
      - kind
      - context
      - as_of
      additionalProperties: false
      properties:
        kind:
          type: string
          const: context
        context:
          $ref: '#/components/schemas/Name'
          description: the live context the rows came from
        as_of:
          description: the time the rows were read as of, null for the context's latest rows
          anyOf:
          - type: string
          - type: number
          - type: 'null'
    SyntheticOrigin:
      type: object
      description: |
        A table a synthetic batch generated: the batch, the seed the table
        was drawn from, the generator's version, and every option as this
        table used it, with each range replaced by its draw and
        `schema_from` expanded to the schema it copied, with the source
        snapshot's name and digest. The service sets it; an upload that
        sends it is refused with 422.
      required:
      - kind
      - batch
      - seed
      - generator
      - options
      additionalProperties: false
      properties:
        kind:
          type: string
          const: synthetic
        batch:
          $ref: '#/components/schemas/SyntheticBatchName'
        seed:
          type: integer
          minimum: 0
          description: the seed the table was drawn from, the batch's seed plus the table's index unless `reject` turned down earlier draws
        generator:
          type: string
          minLength: 1
          description: the version of the generator that drew the table, as `scm-1`
        options:
          type: object
          description: every option as this table used it, ranges replaced by their draws
    SyntheticBatchName:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,53}$"
      description: |
        a batch's name: a snapshot name of at most 54 characters, so its
        tag `synthetic-<name>` is a tag and its tables' names `<name>-<i>`
        are names
    SyntheticBatchState:
      type: string
      enum:
      - pending
      - done
      description: a batch is `pending` while any of its tables is, then `done`, each table `ready` or `rejected`
    SyntheticFunction:
      type: string
      description: a kind of function a node of a synthetic table's causal graph applies to its parents
      enum: [linear, mlp, tree, gp, discretize, quadratic, cluster]
    SyntheticMissingPattern:
      type: string
      description: how a synthetic table's missing cells fall
      enum: [random, rows, blocks, by_target, censored, latent, near_empty]
    SyntheticRowsRange:
      type: object
      description: a range of rows per table, drawn log-uniformly
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 64, maximum: 50000}
        max: {type: integer, minimum: 64, maximum: 50000}
    SyntheticColumnsRange:
      type: object
      description: a range of feature columns per table
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 2, maximum: 100}
        max: {type: integer, minimum: 2, maximum: 100}
    SyntheticClassesRange:
      type: object
      description: a range of classes per table
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 2, maximum: 10}
        max: {type: integer, minimum: 2, maximum: 10}
    SyntheticCategoriesRange:
      type: object
      description: a range for the most categories a categorical column may have, drawn log-uniformly
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 2, maximum: 1000}
        max: {type: integer, minimum: 2, maximum: 1000}
    SyntheticGraphNodesRange:
      type: object
      description: a range of hidden nodes in a table's causal graph, drawn log-uniformly
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 2, maximum: 64}
        max: {type: integer, minimum: 2, maximum: 64}
    SyntheticGroupsRange:
      type: object
      description: a range of groups of correlated columns per table
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 1, maximum: 4}
        max: {type: integer, minimum: 1, maximum: 4}
    SyntheticLevelsRange:
      type: object
      description: a range of levels a coarsened column is cut into
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 2, maximum: 8}
        max: {type: integer, minimum: 2, maximum: 8}
    SyntheticHighCardinalityRange:
      type: object
      description: a range of high-cardinality categorical columns per table
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: integer, minimum: 0, maximum: 3}
        max: {type: integer, minimum: 0, maximum: 3}
    SyntheticShareRange:
      type: object
      description: a range of shares from 0 to 1
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: number, minimum: 0, maximum: 1}
        max: {type: number, minimum: 0, maximum: 1}
    SyntheticShare90Range:
      type: object
      description: a range of shares from 0 to 0.9
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: number, minimum: 0, maximum: 0.9}
        max: {type: number, minimum: 0, maximum: 0.9}
    SyntheticShare50Range:
      type: object
      description: a range of shares from 0 to 0.5
      required: [min, max]
      additionalProperties: false
      properties:
        min: {type: number, minimum: 0, maximum: 0.5}
        max: {type: number, minimum: 0, maximum: 0.5}
    SyntheticCategorical:
      type: object
      description: how many of a table's feature columns are categorical, and how many categories each may have
      additionalProperties: false
      properties:
        share:
          description: the share of feature columns that are categorical, 0 to 1; 0 to 0.5 when left out
          default: {min: 0, max: 0.5}
          anyOf:
          - {type: number, minimum: 0, maximum: 1}
          - $ref: '#/components/schemas/SyntheticShareRange'
        max_categories:
          description: |
            the most categories a categorical column may have, 2 to 1000;
            each column's count is drawn log-uniformly from 2 up to it; 2 to
            50 when left out
          default: {min: 2, max: 50}
          anyOf:
          - {type: integer, minimum: 2, maximum: 1000}
          - $ref: '#/components/schemas/SyntheticCategoriesRange'
    SyntheticCorrelated:
      type: object
      description: groups of feature columns made to move together through a shared hidden factor
      additionalProperties: false
      properties:
        share:
          description: the share of feature columns put in correlated groups, 0 to 1; 0, none, when left out
          default: 0
          anyOf:
          - {type: number, minimum: 0, maximum: 1}
          - $ref: '#/components/schemas/SyntheticShareRange'
        groups:
          description: how many groups those columns are split into, 1 to 4, each of at least 2 columns; 1 when left out
          default: 1
          anyOf:
          - {type: integer, minimum: 1, maximum: 4}
          - $ref: '#/components/schemas/SyntheticGroupsRange'
        strength:
          description: how strongly a group's columns follow its shared factor, 0 to 1, drawn per group; 0.2 to 0.7 when left out
          default: {min: 0.2, max: 0.7}
          anyOf:
          - {type: number, minimum: 0, maximum: 1}
          - $ref: '#/components/schemas/SyntheticShareRange'
    SyntheticCoarsened:
      type: object
      description: numeric columns cut into a few ordered levels, as a rounded or bucketed measurement is
      additionalProperties: false
      properties:
        share:
          description: the share of numeric columns coarsened, 0 to 1; 0, none, when left out
          default: 0
          anyOf:
          - {type: number, minimum: 0, maximum: 1}
          - $ref: '#/components/schemas/SyntheticShareRange'
        levels:
          description: how many equal-frequency levels a coarsened column is cut into, 2 to 8; 2 to 8 when left out
          default: {min: 2, max: 8}
          anyOf:
          - {type: integer, minimum: 2, maximum: 8}
          - $ref: '#/components/schemas/SyntheticLevelsRange'
    SyntheticMissing:
      type: object
      description: missing cells, null in categorical columns and NaN in numeric ones
      additionalProperties: false
      properties:
        rate:
          description: the share of all feature cells left missing, 0 to 0.9; 0, none, when left out
          default: 0
          anyOf:
          - {type: number, minimum: 0, maximum: 0.9}
          - $ref: '#/components/schemas/SyntheticShare90Range'
        patterns:
          type: array
          minItems: 1
          uniqueItems: true
          default: [random]
          description: |
            how the missing cells fall, the rate split across the patterns
            given: `random` cells, whole `rows`, `blocks` of rows in 2 to 5
            columns, rows of one class or target tail (`by_target`), a
            column's own or another column's tail (`censored`), rows a hidden
            factor makes sparse (`latent`), or a few columns almost wholly
            missing (`near_empty`); `[random]` when left out
          items:
            $ref: '#/components/schemas/SyntheticMissingPattern'
    SyntheticTarget:
      type: object
      description: how noisy, imbalanced or heavy-tailed the target `y` is
      additionalProperties: false
      properties:
        noise:
          description: the noise added to the target's score, as a share of its spread, 0 to 1; 0.01 to 0.1 when left out
          default: {min: 0.01, max: 0.1}
          anyOf:
          - {type: number, minimum: 0, maximum: 1}
          - $ref: '#/components/schemas/SyntheticShareRange'
        label_noise:
          description: the share of class labels flipped to another class, 0 to 0.5, classification only; 0 when left out
          default: 0
          anyOf:
          - {type: number, minimum: 0, maximum: 0.5}
          - $ref: '#/components/schemas/SyntheticShare50Range'
        imbalance:
          description: how unequal the classes are, from 0, balanced, to 1, steeply power-law, classification only; 0 when left out
          default: 0
          anyOf:
          - {type: number, minimum: 0, maximum: 1}
          - $ref: '#/components/schemas/SyntheticShareRange'
        heavy_tail:
          description: how far the target's tails are stretched, from 0, not at all, to 1, strongly, regression only; 0 when left out
          default: 0
          anyOf:
          - {type: number, minimum: 0, maximum: 1}
          - $ref: '#/components/schemas/SyntheticShareRange'
    SyntheticBatchCreate:
      type: object
      description: |
        A synthetic batch: its name, how many tables, the seed, and the
        options every table is drawn with. Each numeric option is an exact
        value or a range `{"min": a, "max": b}`, a <= b, both within the
        option's bounds, drawn once per table; an option left out takes its
        default. `task` is required without `schema_from`.
      required:
      - name
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/SyntheticBatchName'
          description: the batch's name, unique in the project; table `i` is the snapshot `<name>-<i>`
        count:
          type: integer
          minimum: 1
          maximum: 64
          default: 1
          description: how many tables the batch generates, 1 to 64 (a run's data takes at most 64 snapshots); 1 when left out
        seed:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: the seed the batch draws from, table `i` from `seed + i`; a random seed the service records when left out
        schema_from:
          $ref: '#/components/schemas/Name'
          description: |
            a ready snapshot whose feature columns, their types, its task and
            its class count every table copies; `task`, `columns` and
            `classes` that disagree with it, `categorical` and
            `high_cardinality_columns` are then refused
        task:
          type: string
          enum: [classification, regression]
          description: whether each table's target `y` is a class or a number; required without `schema_from`
        rows:
          description: the rows in each table, 64 to 50,000, a range drawn log-uniformly; 4096 when left out
          default: 4096
          anyOf:
          - {type: integer, minimum: 64, maximum: 50000}
          - $ref: '#/components/schemas/SyntheticRowsRange'
        columns:
          description: the feature columns in each table, 2 to 100; `schema_from`'s count, else 2 to 32, when left out
          default: {min: 2, max: 32}
          anyOf:
          - {type: integer, minimum: 2, maximum: 100}
          - $ref: '#/components/schemas/SyntheticColumnsRange'
        classes:
          description: the classes of each table's target, 2 to 10, classification only; `schema_from`'s count, else 2 to 10, when left out
          default: {min: 2, max: 10}
          anyOf:
          - {type: integer, minimum: 2, maximum: 10}
          - $ref: '#/components/schemas/SyntheticClassesRange'
        categorical:
          $ref: '#/components/schemas/SyntheticCategorical'
        functions:
          type: array
          minItems: 1
          uniqueItems: true
          default: [linear, mlp, tree, gp, discretize, quadratic, cluster]
          description: |
            the kinds of function a node of the causal graph may apply to its
            parents, one drawn per node: `linear` maps, small `mlp`s, random
            `tree`s, Gaussian-process-like `gp`s, `discretize` (snap to the
            nearest of a few centers), `quadratic` forms and soft `cluster`
            assignments; every kind when left out
          items:
            $ref: '#/components/schemas/SyntheticFunction'
        graph_nodes:
          description: the hidden nodes of each table's causal graph, 2 to 64, a range drawn log-uniformly; 2 to 32 when left out
          default: {min: 2, max: 32}
          anyOf:
          - {type: integer, minimum: 2, maximum: 64}
          - $ref: '#/components/schemas/SyntheticGraphNodesRange'
        irrelevant_columns:
          description: the share of feature columns drawn apart from the graph, carrying no signal, 0 to 0.9; 0 when left out
          default: 0
          anyOf:
          - {type: number, minimum: 0, maximum: 0.9}
          - $ref: '#/components/schemas/SyntheticShare90Range'
        correlated_columns:
          $ref: '#/components/schemas/SyntheticCorrelated'
        coarsened_columns:
          $ref: '#/components/schemas/SyntheticCoarsened'
        high_cardinality_columns:
          description: |
            how many numeric columns become categorical with 201 or more
            categories, 0 to 3, for tables of at least 400 rows; 0 when left
            out
          default: 0
          anyOf:
          - {type: integer, minimum: 0, maximum: 3}
          - $ref: '#/components/schemas/SyntheticHighCardinalityRange'
        missing:
          $ref: '#/components/schemas/SyntheticMissing'
        target:
          $ref: '#/components/schemas/SyntheticTarget'
        reject:
          type: array
          uniqueItems: true
          default: []
          description: |
            draws to turn down and draw again, up to 20 times before the
            table is `rejected`: `trivial`, a target almost perfectly
            predictable, and `unlearnable`, one no better predicted than by a
            constant; none when left out
          items:
            type: string
            enum: [trivial, unlearnable]
        tags:
          type: array
          maxItems: 16
          description: |
            tags every table carries besides `synthetic` and
            `synthetic-<name>`; the reserved tags are refused with 422
          items:
            $ref: '#/components/schemas/RunTag'
    SyntheticBatchCreateRequest:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - payload
        properties:
          payload:
            $ref: '#/components/schemas/SyntheticBatchCreate'
    SyntheticBatchCreated:
      type: object
      description: a batch as its create answers it, every table pending
      required:
      - name
      - tag
      - count
      - snapshots
      - state
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/SyntheticBatchName'
        tag:
          $ref: '#/components/schemas/RunTag'
          description: the tag every table carries, `synthetic-<name>`
        count:
          type: integer
          minimum: 1
          maximum: 64
        snapshots:
          type: array
          description: the tables' snapshot names, `<name>-0` to `<name>-<count - 1>`
          items:
            $ref: '#/components/schemas/Name'
        state:
          $ref: '#/components/schemas/SyntheticBatchState'
    SyntheticTable:
      type: object
      description: one table of a batch, by its snapshot name, with its state and, once rejected, why
      required:
      - name
      - state
      - error
      additionalProperties: false
      properties:
        name:
          $ref: '#/components/schemas/Name'
        state:
          $ref: '#/components/schemas/SnapshotState'
        error:
          anyOf:
          - type: string
          - type: 'null'
    SyntheticCounts:
      type: object
      description: how many of a batch's tables are in each state
      required:
      - pending
      - ready
      - rejected
      additionalProperties: false
      properties:
        pending:
          type: integer
          minimum: 0
        ready:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
    SyntheticBatch:
      description: a batch as `snapshots.synthetic` reads it
      allOf:
      - $ref: '#/components/schemas/SyntheticBatchCreated'
      - type: object
        required:
        - seed
        - options
        - tables
        - counts
        properties:
          seed:
            type: integer
            minimum: 0
            description: the seed the batch drew from, the one sent or the one the service chose
          options:
            $ref: '#/components/schemas/SyntheticBatchCreate'
            description: the batch's payload as it was sent
          tables:
            type: array
            items:
              $ref: '#/components/schemas/SyntheticTable'
          counts:
            $ref: '#/components/schemas/SyntheticCounts'
    SyntheticBatchCreatedReply:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - result
        properties:
          result:
            $ref: '#/components/schemas/SyntheticBatchCreated'
    SyntheticBatchReply:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - result
        properties:
          result:
            $ref: '#/components/schemas/SyntheticBatch'
    State:
      type: string
      enum: [pending, building, ready, failed, stopped]

    Revision:
      type: object
      description: an immutable pushed predictor
      required: [predictor, number, predictor_digest, model, created_at, status]
      additionalProperties: false
      properties:
        predictor: {$ref: "#/components/schemas/Name"}
        number: {type: integer, minimum: 1}
        predictor_digest: {$ref: "#/components/schemas/Digest"}
        model: {$ref: "#/components/schemas/ModelId"}
        created_at: {type: number}
        status: {$ref: "#/components/schemas/State"}

    RevisionReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Revision"}

    RevisionList:
      type: object
      required: [revisions]
      additionalProperties: false
      properties:
        revisions:
          type: array
          items: {$ref: "#/components/schemas/Revision"}

    RevisionListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/RevisionList"}

    LockedModel:
      type: object
      required: [files]
      additionalProperties: false
      properties:
        files:
          type: object
          description: each artifact file's sha256, hex
          additionalProperties: {type: string, pattern: "^[0-9a-f]{64}$"}

    LockResources:
      type: object
      description: the hosted serving resources gf.yaml declares
      additionalProperties: false
      properties:
        accelerator: {type: string, enum: [L4, A10G, L40S, cpu]}
        replicas_min: {type: integer, minimum: 0}
        replicas_max: {type: integer, minimum: 1}
        idle_seconds: {type: integer, minimum: 0}

    LockWriter:
      type: object
      description: |
        the gf that wrote a lock: its package version, and the revision of
        what its gf check writes for the same gf.yaml, rows and catalog. A
        lock without it was written under rules 1
      required: [gf, rules]
      additionalProperties: false
      properties:
        gf: {type: string}
        rules: {type: integer, minimum: 1}

    Lock:
      type: object
      description: |
        gf.lock: what gf check resolved gf.yaml into. `digest` is the
        canonical JSON digest of the document without `digest` and
        `checked_with`, the one identity of a predictor revision; `manifest`
        the digest of the normalized gf.yaml it resolves
      required: [lock_version, digest, manifest, predictor, model]
      additionalProperties: false
      properties:
        lock_version:
          type: integer
          enum: [1, 2]
          description: 2 when the predictor runs a derived model, which only that version has
        digest: {$ref: "#/components/schemas/Digest"}
        checked_with: {$ref: "#/components/schemas/LockWriter"}
        manifest: {$ref: "#/components/schemas/Digest"}
        predictor: {$ref: "#/components/schemas/Resolution"}
        resources: {$ref: "#/components/schemas/LockResources"}
        model: {$ref: "#/components/schemas/LockedModel"}

    RevisionRegister:
      type: object
      description: |
        a checked predictor's lock, its uploaded snapshot's digest, and the
        normalized gf.yaml the lock was written for, which the plane holds
        the lock to field by field
      required: [lock, snapshot, manifest]
      additionalProperties: false
      properties:
        lock: {$ref: "#/components/schemas/Lock"}
        snapshot:
          oneOf:
            - $ref: "#/components/schemas/Digest"
            - type: "null"
        manifest:
          type: object
          description: |
            the gf.yaml document the lock was checked for; the service
            normalizes it, and its digest is the lock's `manifest`

    RevisionRegisterRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/RevisionRegister"}

    PredictorCheck:
      type: object
      description: a gf.yaml as written, its uploaded snapshot, and the lock it replaces
      required: [manifest]
      additionalProperties: false
      properties:
        manifest: {type: string, description: "gf.yaml's text; its `name` defaults to the route's"}
        snapshot:
          type: [string, "null"]
          description: |
            a ready uploaded snapshot's name: required for a snapshot
            context, null for `request` and `live` contexts
        previous:
          oneOf:
            - type: object
            - type: "null"
          description: |
            the directory's gf.lock before this check, if any: changes are
            listed against it, and a model digest other than the one it pins
            is refused without `upgrade`
        upgrade:
          type: boolean
          default: false
          description: "`gf check --upgrade`: accept a model digest other than `previous` pins"
        keep:
          type: boolean
          default: false
          description: |
            store a snapshot context's resolved rows as a content-addressed
            snapshot, for `gf push`; without it nothing is written

    PredictorCheckRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/PredictorCheck"}

    PredictorCheckResult:
      type: object
      required: [lock, model, inferred, changes, manifest, context, snapshot]
      additionalProperties: false
      properties:
        lock: {$ref: "#/components/schemas/Lock"}
        model: {type: string, description: the model the lock pins}
        inferred:
          type: object
          description: what the service read from the snapshot that gf.yaml leaves out, by key
        changes:
          type: array
          description: "the lock's changes from `previous`, each `[op, key, old, new]` with op `+`, `-` or `~`"
          items:
            type: array
            minItems: 4
            maxItems: 4
        manifest:
          type: object
          description: the normalized gf.yaml document `gf push` registers
        context: {$ref: "#/components/schemas/CheckedContext"}
        snapshot:
          oneOf:
            - $ref: "#/components/schemas/KeptSnapshot"
            - type: "null"
          description: with `keep` and a snapshot context, the stored rows; null otherwise

    CheckedContext:
      type: object
      description: the context the lock resolved
      required: [kind, rows, query_rows, digest]
      properties:
        kind: {type: string, enum: [snapshot, request, live]}
        rows: {type: [integer, "null"], minimum: 0}
        query_rows: {type: [integer, "null"], minimum: 0}
        digest: {type: [string, "null"]}

    KeptSnapshot:
      type: object
      description: a snapshot context's resolved rows, stored for `gf push`
      required: [name, digest, rows]
      additionalProperties: false
      properties:
        name: {type: string, description: "`<name>-<12 hex of digest>`"}
        digest: {type: string, description: the lock's context digest, which a revision registers as `snapshot`}
        rows: {type: integer, minimum: 0}

    PredictorCheckReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/PredictorCheckResult"}

    EvaluationCreate:
      type: object
      required: [manifest, snapshot]
      additionalProperties: false
      properties:
        manifest:
          type: string
          description: gf.yaml's text; its context must be a snapshot with `holdout` or `until`
        snapshot: {type: string, description: the uploaded snapshot's name}
        models:
          type: [array, "null"]
          description: hostable models of the manifest's task to score; the manifest's model when null
          minItems: 1
          maxItems: 25
          items: {type: string}

    EvaluationCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/EvaluationCreate"}

    EvaluationState:
      type: string
      description: "`queued` and `running` go on; `finished`, `failed` and `cancelled` are final"
      enum: [queued, running, finished, failed, cancelled]

    EvaluationModel:
      type: object
      description: one model's scoring of the held-out rows
      required: [model, state, metrics, interval, scored, total, seconds, error]
      additionalProperties: false
      properties:
        model: {type: string}
        state: {$ref: "#/components/schemas/EvaluationState"}
        metrics:
          type: object
          description: gf eval's metrics, the mean over repeats
          additionalProperties: {type: [number, "null"]}
        interval:
          oneOf:
            - $ref: "#/components/schemas/EvaluationInterval"
            - type: "null"
          description: the primary metric's bootstrap interval; null until every draw of the model ends
        scored: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
        seconds: {type: [number, "null"]}
        error:
          oneOf:
            - $ref: "#/components/schemas/Error"
            - type: "null"
          description: why the model failed, when it did

    EvaluationInterval:
      type: object
      required: [metric, low, high, level, resamples]
      properties:
        metric: {type: string}
        low: {type: number}
        high: {type: number}
        level: {type: number}
        resamples: {type: integer, minimum: 1}

    EvaluationBilled:
      type: object
      description: what the evaluation was billed so far, on the prediction meters
      required: [predictions, rows, seconds]
      properties:
        predictions: {type: integer, minimum: 0}
        rows: {type: integer, minimum: 0}
        seconds: {type: number, minimum: 0}

    Evaluation:
      type: object
      required: [evaluation, state, held, repeats, context, task, metric, models, billed, created, started, finished]
      additionalProperties: false
      properties:
        evaluation: {type: integer, minimum: 1, description: the evaluation's number, counted per predictor}
        state: {$ref: "#/components/schemas/EvaluationState"}
        held: {type: [integer, "null"], description: the held-out rows scored}
        repeats: {type: integer, minimum: 1}
        context: {type: [integer, "null"], description: the context rows each model reads}
        task: {type: [string, "null"]}
        metric: {type: [string, "null"], description: the primary metric}
        models:
          type: array
          items: {$ref: "#/components/schemas/EvaluationModel"}
        billed: {$ref: "#/components/schemas/EvaluationBilled"}
        created: {type: number, description: Unix seconds}
        started: {type: [number, "null"]}
        finished: {type: [number, "null"]}

    EvaluationReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Evaluation"}

    RevisionDetails:
      type: object
      required: [revision, lock]
      additionalProperties: false
      properties:
        revision: {$ref: "#/components/schemas/Revision"}
        lock: {$ref: "#/components/schemas/Lock"}

    RevisionDetailsReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/RevisionDetails"}

    Environment:
      type: object
      description: a pointer to a revision; `generation` guards promote and rollback
      required: [predictor, name, revision, generation, status]
      additionalProperties: false
      properties:
        predictor: {$ref: "#/components/schemas/Name"}
        name: {$ref: "#/components/schemas/Name"}
        revision: {type: [integer, "null"]}
        generation: {type: integer, minimum: 0}
        status: {$ref: "#/components/schemas/State"}

    EnvironmentReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Environment"}

    EnvironmentList:
      type: object
      required: [environments]
      additionalProperties: false
      properties:
        environments:
          type: array
          items: {$ref: "#/components/schemas/Environment"}

    EnvironmentListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/EnvironmentList"}

    EnvironmentCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}

    EnvironmentCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/EnvironmentCreate"}

    Promote:
      type: object
      required: [revision, expected_generation]
      additionalProperties: false
      properties:
        revision: {type: integer, minimum: 1}
        expected_generation: {type: integer, minimum: 0}

    PromoteRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/Promote"}

    Metrics:
      type: object
      description: |
        serving facts: `context` is the context the environment is serving
        now, `accepted_version`/`serving_version` compare the newest accepted
        write of a live context with the one being served, `fresh` says
        whether they agree (null without a context)
      required: [status, context, accepted_version, serving_version, fresh, requests, errors, mean_latency_seconds]
      additionalProperties: false
      properties:
        status: {$ref: "#/components/schemas/State"}
        context:
          oneOf:
            - $ref: "#/components/schemas/ServingContext"
            - type: "null"
        accepted_version: {type: [integer, string, "null"]}
        serving_version: {type: [integer, string, "null"]}
        fresh: {type: [boolean, "null"]}
        requests: {type: integer, minimum: 0}
        errors: {type: integer, minimum: 0}
        mean_latency_seconds: {type: [number, "null"]}

    ServingContext:
      type: object
      description: |
        the context an environment serves: `source` is `snapshot`,
        `request` or `live/<context>`; the version fields and
        `freshness_lag_seconds` are set for live contexts
      required: [source, version, rows, as_of, accepted_version, serving_version, freshness_lag_seconds]
      additionalProperties: true
      properties:
        source: {type: string}
        version: {type: [integer, string, "null"]}
        rows: {type: integer, minimum: 0}
        as_of: {$ref: "#/components/schemas/AsOf"}
        accepted_version: {type: [integer, string, "null"]}
        serving_version: {type: [integer, string, "null"]}
        freshness_lag_seconds: {type: [number, "null"]}

    MetricsReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Metrics"}

    LogCursor:
      type: string
      pattern: "^[0-9]{1,18}$"
      description: an entry's place in its predictor's log, as a reply gave it

    LogLevel:
      type: string
      enum: [info, warn, error]

    LogEntry:
      type: object
      required: [id, at, level, source, code, message, environment, revision, request_id, fields]
      additionalProperties: false
      description: |
        One thing that happened. `id` is the entry's cursor, which `after`
        and `before` take.
      properties:
        id: {$ref: "#/components/schemas/LogCursor"}
        at:
          type: number
          description: when, in seconds since the epoch
        level: {$ref: "#/components/schemas/LogLevel"}
        source:
          type: string
          description: |
            who says so: `deploy` for a predictor's lifecycle, `plane` for the
            hosted service, `replica <name>` for a replica of the hosted pool
        code:
          type: string
          description: what happened, as a stable name such as `Promoted` or `PredictionFailed`
        message:
          type: string
          description: what happened, for a person
        environment:
          type: [string, "null"]
          description: the environment concerned; null for an entry about the whole predictor
        revision:
          type: [integer, "null"]
        request_id:
          type: [string, "null"]
          description: the request that caused it, if one did
        fields:
          type: object
          description: |
            more of what happened, as named numbers, booleans and text: a
            prediction's `key`, `rows`, `status` and `latency_ms`, a refusal's
            `error`, `param` and `help`
          additionalProperties:
            type: [string, number, boolean]

    Logs:
      type: object
      required: [logs, next, previous]
      additionalProperties: false
      description: |
        A page of a log, oldest first. `next` is the cursor to pass as
        `after` for the entries that follow the page.
      properties:
        logs:
          type: array
          items: {$ref: "#/components/schemas/LogEntry"}
        next: {$ref: "#/components/schemas/LogCursor"}
        previous:
          type: [string, "null"]
          pattern: "^[0-9]{1,18}$"
          description: |
            pass as `before` for the entries that precede this page; null when
            the page is empty or reaches the oldest entry kept

    LogsReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Logs"}

    LogBucket:
      type: object
      required: [at, info, warn, error]
      additionalProperties: false
      properties:
        at:
          type: number
          description: where the stretch starts, in seconds since the epoch
        info: {type: integer, minimum: 0}
        warn: {type: integer, minimum: 0}
        error: {type: integer, minimum: 0}

    LogHistogram:
      type: object
      required: [since, until, bucket_seconds, buckets]
      additionalProperties: false
      properties:
        since: {type: number}
        until: {type: number}
        bucket_seconds: {type: number}
        buckets:
          type: array
          items: {$ref: "#/components/schemas/LogBucket"}

    LogHistogramReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/LogHistogram"}

    PredictorDeleted:
      type: object
      required: [name, deleted]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        deleted: {type: boolean, const: true}

    PredictorDeletedReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/PredictorDeleted"}

    LiveContext:
      type: object
      description: a hosted, appendable context
      required: [name, inputs, targets, max_rows, rows, labeled_rows, sequence, accepted_at]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        inputs: {type: array, items: {type: string}}
        targets:
          type: object
          additionalProperties: {$ref: "#/components/schemas/ColumnType"}
        max_rows: {type: integer, minimum: 1}
        rows: {type: integer, minimum: 0}
        labeled_rows: {type: integer, minimum: 0}
        sequence: {type: integer, minimum: 0}
        accepted_at: {type: [number, "null"]}
        id: {type: string, description: the column that names each row}

    LiveContextReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/LiveContext"}

    LiveContextList:
      type: object
      required: [contexts]
      additionalProperties: false
      properties:
        contexts:
          type: array
          items: {$ref: "#/components/schemas/LiveContext"}

    LiveContextListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/LiveContextList"}

    LiveContextCreate:
      type: object
      required: [name, inputs, targets]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        inputs: {type: array, items: {type: string}, minItems: 1}
        targets:
          type: object
          additionalProperties: {$ref: "#/components/schemas/ColumnType"}
          minProperties: 1
        max_rows: {type: integer, minimum: 1, default: 100000}
        id: {type: string, description: "the column that names each row; `id` if left out"}
        types:
          type: object
          description: each input's type, `number` if left out
          additionalProperties: {$ref: "#/components/schemas/ColumnType"}
        max_writes: {type: integer, minimum: 1, default: 10000, description: write ids a retry may name}
        max_pending_labels: {type: integer, minimum: 0, default: 0}
        pending_ttl_seconds: {type: number, exclusiveMinimum: 0, default: 3600}

    LiveContextCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/LiveContextCreate"}

    LiveContextAppend:
      type: object
      required: [write_id, rows]
      additionalProperties: false
      properties:
        write_id: {type: string, minLength: 1, maxLength: 256}
        rows:
          type: array
          items: {$ref: "#/components/schemas/Row"}
          minItems: 1
          maxItems: 100

    LiveContextAppendRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/LiveContextAppend"}

    Label:
      type: object
      required: [id, value]
      additionalProperties: false
      properties:
        id: {type: [string, integer]}
        value: {type: [string, number, boolean]}

    LiveContextLabel:
      type: object
      required: [write_id, target, labels]
      additionalProperties: false
      properties:
        write_id: {type: string, minLength: 1, maxLength: 256}
        target: {type: string}
        labels:
          type: array
          items: {$ref: "#/components/schemas/Label"}
          minItems: 1
          maxItems: 100

    LiveContextLabelRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/LiveContextLabel"}

    Receipt:
      type: object
      description: durable acceptance of an append or label write
      required: [context, write_id, operation, rows, sequence, accepted_at, durably_accepted]
      additionalProperties: false
      properties:
        context: {$ref: "#/components/schemas/Name"}
        write_id: {type: string}
        operation: {type: string, enum: [append, label]}
        rows: {type: integer, minimum: 0}
        sequence: {type: integer, minimum: 0}
        accepted_at: {type: number}
        durably_accepted: {type: boolean}

    ReceiptReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Receipt"}

    PredictorCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}

    PredictorCreateRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/PredictorCreate"}

    PredictorCreatedReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/PredictorCreate"}

    ContextImport:
      type: object
      description: where a live context's rows come from, and how its columns map
      required: [context, source, format]
      additionalProperties: false
      properties:
        context: {$ref: "#/components/schemas/Name"}
        source:
          type: string
          maxLength: 2048
          description: "`upload://<digest>`, or `s3://`, `gs://`, `az://`, `azure://`, `snowflake://`, `bigquery://` or `context://` without credentials or query"
        format: {type: string, enum: [csv, tsv, parquet, arrow, json, jsonl, table]}
        credential_ref:
          type: [string, "null"]
          pattern: "^secret/[a-z][a-z0-9-]{0,62}$"
          description: the secret the operator's connector reads the source with
        digest:
          oneOf:
            - $ref: "#/components/schemas/Digest"
            - type: "null"
        mapping:
          type: array
          description: "`[context column, source column]` pairs"
          items:
            type: array
            items: {type: string}
            minItems: 2
            maxItems: 2
          default: []

    ContextImportRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/ContextImport"}

    WriteOperation:
      type: string
      enum: [create_features, attach_labels, correct_features, correct_labels, resupply_labels, import_record, checkpoint]

    Observation:
      type: object
      description: one observation's components; corrections name the versions they replace
      required: [key]
      additionalProperties: false
      properties:
        key: {type: string, minLength: 1}
        features: {type: object, additionalProperties: {type: [string, number, boolean, "null"]}}
        labels: {type: object, additionalProperties: {type: [string, number, boolean]}}
        event_at: {type: number}
        expected_feature_version: {type: integer, minimum: 1}
        expected_label_versions: {type: object, additionalProperties: {type: integer, minimum: 1}}

    MutationOperation:
      type: string
      description: the writes a client makes; imports and checkpoints are the server's
      enum: [create_features, attach_labels, correct_features, correct_labels, resupply_labels]

    Mutation:
      type: object
      required: [write_id, operation, records]
      additionalProperties: false
      properties:
        write_id: {type: string, minLength: 1, maxLength: 256}
        operation: {$ref: "#/components/schemas/MutationOperation"}
        records:
          type: array
          items: {$ref: "#/components/schemas/Observation"}
          minItems: 1
          maxItems: 100

    MutationRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/Mutation"}

    ComponentVersions:
      type: object
      required: [key, feature_version, label_versions]
      additionalProperties: false
      properties:
        key: {type: string}
        feature_version: {type: [integer, "null"]}
        label_versions: {type: object, additionalProperties: {type: integer}}

    AcceptedWrite:
      type: object
      description: a write's durable receipt, the same for every retry of its write id
      required: [project, context, write_id, operation, sequence, accepted_at, durably_accepted, changes, retry_valid_until]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/Name"}
        context: {$ref: "#/components/schemas/Name"}
        write_id: {type: string}
        operation: {$ref: "#/components/schemas/WriteOperation"}
        sequence: {type: integer, minimum: 0}
        accepted_at: {type: number}
        durably_accepted: {type: boolean}
        changes:
          type: array
          items: {$ref: "#/components/schemas/ComponentVersions"}
        retry_valid_until: {type: [number, "null"]}

    AcceptedWriteReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/AcceptedWrite"}

    ImportReceipt:
      type: object
      required: [context, digest, rows, sequence, accepted_at, receipt, mode, continuous]
      additionalProperties: false
      properties:
        context: {$ref: "#/components/schemas/Name"}
        digest: {$ref: "#/components/schemas/Digest"}
        rows: {type: integer, minimum: 0}
        sequence: {type: integer, minimum: 0}
        accepted_at: {type: number}
        receipt: {$ref: "#/components/schemas/AcceptedWrite"}
        mode: {type: string, const: explicit-refresh}
        continuous: {type: boolean, const: false}

    ImportReceiptReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/ImportReceipt"}

    ContextSnapshotQuery:
      type: object
      required: [target]
      additionalProperties: false
      properties:
        target: {type: string}
        knowledge_at: {type: [number, "null"], minimum: 0}
        event_before: {type: [number, "null"]}

    ContextSnapshotQueryRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/ContextSnapshotQuery"}

    SnapshotRow:
      type: object
      required: [key, features, label, feature_version, label_version, feature_accepted_at, label_accepted_at, event_at]
      additionalProperties: false
      properties:
        key: {type: string}
        features: {type: object, additionalProperties: {type: [string, number, boolean, "null"]}}
        label: {type: [string, number, boolean]}
        feature_version: {type: integer}
        label_version: {type: integer}
        feature_accepted_at: {type: number}
        label_accepted_at: {type: number}
        event_at: {type: [number, "null"]}

    ContextSnapshot:
      type: object
      required: [project, context, target, features, through_sequence, knowledge_at, event_before, rows, source_wait_count]
      additionalProperties: false
      properties:
        project: {$ref: "#/components/schemas/Name"}
        context: {$ref: "#/components/schemas/Name"}
        target: {type: string}
        features: {type: array, items: {type: string}}
        through_sequence: {type: integer, minimum: 0}
        knowledge_at: {type: number}
        event_before: {type: [number, "null"]}
        rows:
          type: array
          items: {$ref: "#/components/schemas/SnapshotRow"}
        source_wait_count: {type: integer, minimum: 0}

    ContextSnapshotReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/ContextSnapshot"}

    SourceMapping:
      type: object
      description: "which columns of a pinned file are an observation's key, features and labels; empty for JSONL already in that shape"
      additionalProperties: false
      properties:
        key: {type: string}
        features: {type: object, additionalProperties: {type: string}}
        labels: {type: object, additionalProperties: {type: string}}
        event_at: {type: string}
        label_types:
          type: object
          additionalProperties: {type: string, enum: [boolean, numeric]}

    SourcePinSpec:
      type: object
      required: [path, format, mapping]
      additionalProperties: false
      properties:
        path: {type: string, minLength: 1}
        format: {type: string, enum: [jsonl, csv]}
        mapping: {$ref: "#/components/schemas/SourceMapping"}

    SourcePinRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/SourcePinSpec"}

    SourcePin:
      type: object
      required: [source_id, digest, size_bytes, format, mapping]
      additionalProperties: false
      properties:
        source_id: {$ref: "#/components/schemas/Name"}
        digest: {$ref: "#/components/schemas/Digest"}
        size_bytes: {type: integer, minimum: 0, maximum: 8388608}
        format: {type: string, enum: [jsonl, csv]}
        mapping: {$ref: "#/components/schemas/SourceMapping"}

    SourcePinReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/SourcePin"}

    SourceList:
      type: object
      required: [sources]
      additionalProperties: false
      properties:
        sources:
          type: array
          items: {$ref: "#/components/schemas/SourcePin"}

    SourceListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/SourceList"}

    PermissionGrant:
      type: object
      description: a permission keys may hold; one that is not enforced authorizes nothing yet
      required: [name, description, enforced, roles]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Permission"}
