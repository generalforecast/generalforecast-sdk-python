  /v1/projects/{project}/snapshots/synthetic:
    post:
      operationId: snapshots.create_synthetic
      tags:
      - hosted
      summary: generate a batch of synthetic training tables
      description: |
        Generates `count` synthetic tables, each its own snapshot, from a
        causal-graph prior: random hidden nodes joined by random functions,
        with feature columns and a target read off the nodes. Table `i` is
        the snapshot `<name>-<i>`, counting from 0, so the batch
        `credit-warmup` of 64 tables is `credit-warmup-0` to
        `credit-warmup-63`. Every table carries the tags `synthetic` and
        `synthetic-<name>` besides the payload's `tags`, so
        `snapshots.list` with `tag=synthetic-credit-warmup` lists the batch
        and a run's `data` of `[{"tag": "synthetic-credit-warmup"}]` trains
        on every ready table of it.

        The reply comes at once, with every table `pending`, and a run can
        use the batch right away: a run naming its tag or its tables is
        created at once and starts training once the batch is done, on its
        ready tables (`Run.waiting`). Each table becomes `ready`, or
        `rejected` with its `error` when `reject` turned down every draw;
        `snapshots.synthetic` shows the batch's tables by state. A ready
        table is an ordinary snapshot:
        its target is `y`, its feature columns `x1` to `xN` with their
        `column_types`, and its `origin` records the seed and every option
        the table was drawn with (`SyntheticOrigin`).

        Every numeric option takes an exact value, as `"rows": 2048`, or a
        range, as `"rows": {"min": 1024, "max": 8192}`, drawn once per table
        from the table's seed. Table `i` draws from seed `seed + i`, so the
        same payload with the same `seed` makes the same tables.
        `schema_from` copies a ready snapshot's columns, their types, its
        task and its class count into every table.

        A batch's name is unique in the project, and each of its table
        names must be free: a name another snapshot ever had is refused
        with 409. The same create sent again, with the same name and the
        same payload, returns the batch; the same name with another payload
        is refused with 409. A batch holds at most 2,000,000 rows, `count`
        times the most rows a table may draw; a larger one, an option out
        of its bounds and an unknown field are refused with 422, `param`
        naming the field.
      parameters:
      - $ref: '#/components/parameters/project'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyntheticBatchCreateRequest'
            examples:
              create:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-3a7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                  resource:
                    kind: snapshot
                    name: credit-warmup
                  payload:
                    name: credit-warmup
                    count: 3
                    seed: 0
                    task: classification
                    rows: {min: 1024, max: 8192}
                    columns: 24
                    classes: 2
                    categorical:
                      share: {min: 0, max: 0.5}
                      max_categories: 50
                    functions: [linear, mlp, tree]
                    graph_nodes: {min: 2, max: 32}
                    irrelevant_columns: 0.1
                    correlated_columns:
                      share: {min: 0, max: 0.6}
                      groups: {min: 1, max: 4}
                      strength: {min: 0.2, max: 0.7}
                    coarsened_columns:
                      share: 0.2
                      levels: {min: 2, max: 8}
                    high_cardinality_columns: 1
                    missing:
                      rate: {min: 0, max: 0.1}
                      patterns: [random, by_target, censored]
                    target:
                      noise: {min: 0.01, max: 0.1}
                      label_noise: 0.02
                      imbalance: {min: 0, max: 0.8}
                    reject: [trivial, unlearnable]
                    tags: [stage:warmup]
              schema_from:
                summary: tables shaped like an uploaded snapshot
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-3b7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                  resource:
                    kind: snapshot
                    name: credit-shaped
                  payload:
                    name: credit-shaped
                    count: 2
                    schema_from: credit-2026-01
                    rows: 4096
              unknown_field:
                x-gf-invalid: true
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-3c7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                  resource:
                    kind: snapshot
                    name: credit-warmup
                  payload:
                    name: credit-warmup
                    task: classification
                    depth: 4
      responses:
        '202':
          description: the batch, with every table pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyntheticBatchCreatedReply'
              examples:
                create:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3a7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                    resource:
                      kind: snapshot
                      name: credit-warmup
                    result:
                      name: credit-warmup
                      tag: synthetic-credit-warmup
                      count: 3
                      snapshots: [credit-warmup-0, credit-warmup-1, credit-warmup-2]
                      state: pending
                schema_from:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3b7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                    resource:
                      kind: snapshot
                      name: credit-shaped
                    result:
                      name: credit-shaped
                      tag: synthetic-credit-shaped
                      count: 2
                      snapshots: [credit-shaped-0, credit-shaped-1]
                      state: pending
        '200':
          description: the same create sent again, answered with the batch it made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyntheticBatchCreatedReply'
        '409':
          description: the batch exists with another payload, or one of its table names is taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorReply'
              examples:
                taken:
                  x-gf-hosted: true
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3d7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                    resource:
                      kind: snapshot
                      name: credit-warmup
                    error:
                      code: Conflict
                      message: snapshot credit-warmup-0 exists; a batch's tables need names no snapshot ever had
                      param: name
                      hint: name the batch something else
        '422':
          description: an unknown field, an option out of its bounds, a batch of more than 2,000,000
            rows, a reserved tag, or options that disagree with `schema_from`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorReply'
              examples:
                unknown_field:
                  x-gf-hosted: true
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3c7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                    resource:
                      kind: snapshot
                      name: credit-warmup
                    error:
                      code: ValidationError
                      message: depth is not a synthetic batch option
                      param: depth
                too_many_rows:
                  x-gf-hosted: true
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3e7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                    resource:
                      kind: snapshot
                      name: credit-warmup
                    error:
                      code: ValidationError
                      message: 64 tables of up to 50000 rows is 3200000 rows; a batch holds at most 2000000
                      param: count
                      hint: send fewer tables or fewer rows
