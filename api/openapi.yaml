  /v1/projects/{project}/predictors/{name}/evaluations:
    post:
      operationId: evaluations.create
      tags: [hosted]
      summary: score a gf.yaml's held-out rows on the service
      description: |
        `gf eval` uploads the manifest's snapshot first, then starts an
        evaluation of `models`, the manifest's own model when left out, on
        the rows the manifest holds out, and answers the evaluation in
        state `queued`. Poll `evaluations.get` until `state` is `finished`,
        `failed` or `cancelled`. The same request id and payload answer the
        same evaluation; another payload under it is a 409 `Conflict`.

        Only a classification or regression manifest whose context is a
        snapshot with `holdout` or `until` can be evaluated. Refusals: a
        manifest gf check refuses (422 `ValidationError`, gf's message and
        `param`); a context other than a snapshot (param `context`), no
        held-out labelled row (param `holdout`), a forecast predictor
        (param `model`); a model of another task or not hostable (422
        `ValidationError`, reason `model_not_hostable`, param `models`);
        past 10,000 held-out rows or 25 models times repeats (422
        `CapacityExceeded`); an unknown or unready snapshot (404 or 409,
        param `snapshot`); and 429 `CapacityExceeded` reason
        `run_limit_reached` while the project has as many evaluations and
        Playground runs going as it may. Evaluations bill as Playground
        runs do.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/predictor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluationCreateRequest"
            examples:
              started:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7
                  resource: {kind: predictor, name: churn}
                  payload:
                    manifest: "name: churn\nmodel: general-forecast/tabicl-v2-classifier\ntarget: churned\ncontext: {snapshot: context.csv, holdout: {fraction: 0.2, seed: 0}}\n"
                    snapshot: churn-5fb6a4c6f24b
                    models: [general-forecast/tabicl-v2-classifier, general-forecast/kumo-tabular-medium-classifier]
      responses:
        "200":
          description: the evaluation, queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvaluationReply"
              examples:
                started:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7
                    resource: {kind: predictor, name: churn}
                    result:
                      evaluation: 3
                      state: queued
                      held: 368
                      repeats: 1
                      context: 1472
                      task: classification
                      metric: auroc
                      models:
                        - {model: general-forecast/tabicl-v2-classifier, state: queued, metrics: {}, interval: null, scored: 0, total: 368, seconds: null, error: null}
                        - {model: general-forecast/kumo-tabular-medium-classifier, state: queued, metrics: {}, interval: null, scored: 0, total: 368, seconds: null, error: null}
                      billed: {predictions: 0, rows: 0, seconds: 0.0}
                      created: 1761400000.0
                      started: null
                      finished: null

