    PredictorCreateRequest:
      allOf:
      - $ref: "#/components/schemas/Envelope"
      - type: object
        required: [payload]
        properties:
          payload:
            $ref: "#/components/schemas/PredictorCreate"

    SourcePrepare:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [bigquery, gcs, s3, databricks, snowflake]}

    SourcePrepareRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/SourcePrepare"}

    SourceIdentity:
      type: object
      description: the workspace's Google service account
      required: [email, unique_id, principal]
      additionalProperties: false
      properties:
        email: {type: string}
        unique_id: {type: string, pattern: "^[0-9]+$"}
        principal: {type: string, description: "the IAM member to grant, `serviceAccount:<email>`"}

    SourceGrant:
      type: object
      required: [role, "on"]
      additionalProperties: false
      properties:
        role: {type: string, description: "the IAM role, `roles/...`"}
        "on": {type: string, enum: [dataset, bucket, project], description: what to grant the role on}

    SourcePrepared:
      type: object
      required: [kind, identity, grants, steps]
      additionalProperties: false
      properties:
        kind: {type: string, enum: [bigquery, gcs, s3, databricks, snowflake]}
        identity: {$ref: "#/components/schemas/SourceIdentity"}
        grants:
          type: array
          items: {$ref: "#/components/schemas/SourceGrant"}
        steps:
          type: array
          description: what the customer does, in order, as the console and the CLI show it
          items: {type: string}
        oidc: {$ref: "#/components/schemas/SourceTrust"}
        policy: {$ref: "#/components/schemas/SourcePolicy"}

    SourceTrust:
      type: object
      description: "what another cloud trusts: the issuer, subject and audience of the account's Google ID tokens"
      required: [issuer, subject]
      additionalProperties: false
      properties:
        issuer: {type: string}
        subject: {type: string, description: the account's unique id}
        audience: {type: string, description: "the tokens' audience, which the trust names; Snowflake's is its own"}

    SourcePolicy:
      type: object
      description: "the document the customer pastes: an AWS role's trust policy, a Databricks service principal's federation policy"
      required: [format, text]
      additionalProperties: false
      properties:
        format: {type: string, enum: [json]}
        text: {type: string}

    SourcePreparedReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/SourcePrepared"}

    SourceList:
      type: object
      description: "`available` says whether this plane can connect sources at all"
      required: [sources, available]
      additionalProperties: false
      properties:
        available: {type: boolean}
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"

    SourceListReply:
      allOf:
      - $ref: "#/components/schemas/Envelope"
      - type: object
        required: [result]
        properties:
          result:
            $ref: "#/components/schemas/SourceList"

    PermissionGrant:
      type: object
      description: |
        a permission a role holds; one that is not enforced authorizes
        nothing yet. `key_grantable` says whether an API key may hold it:
        false for those only a signed-in browser session uses
        (`operators:read`, `sso:read`) and for every reserved one, true for
        every other enforced permission. `keys.create` and `keys.rotate`
        refuse a key a permission it may not hold
      required: [name, description, enforced, key_grantable, roles]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Permission"}
        description: {type: string}
        enforced: {type: boolean}
        key_grantable: {type: boolean}
        roles:
          type: array
          items: {type: string, enum: [admin, editor, viewer, scorer]}

    KeyIdentity:
      type: object
      required: [id, name, project, expires_at]
      additionalProperties: false
      properties:
        id: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}
        name: {$ref: "#/components/schemas/Name"}
        project: {$ref: "#/components/schemas/Name"}
        expires_at: {type: [number, "null"], description: Unix seconds; null for a key that never expires}
        ephemeral: {type: boolean, description: a notebook login's short-lived key}

    WorkspaceIdentity:
      type: object
      required: [id, display_name]
      additionalProperties: false
      properties:
        id: {type: string}
        display_name: {type: string}

    Principal:
      type: object
      description: the credential's kind and id, with what the server knows of it
      required: [kind, id]
      additionalProperties: true
      properties:
        kind: {type: string}
        id: {type: string}

    AuthStatus:
      type: object
      required: [authenticated, principal, sign_in, secrets, capabilities, permission_inventory, bootstrap, trains, limits]
      additionalProperties: false
      properties:
        authenticated: {type: boolean, const: true}
        principal: {$ref: "#/components/schemas/Principal"}
        sign_in:
          type: array
          description: the sign-in providers the server has configured, none when it signs no one in
          items: {type: string, enum: [google, microsoft, github]}
        secrets: {type: string, enum: [configured, unconfigured]}
        capabilities:
          type: array
          items: {$ref: "#/components/schemas/Capability"}
        permission_inventory:
          type: array
          items: {$ref: "#/components/schemas/PermissionGrant"}
        bootstrap: {type: string, enum: [unconfigured, available, consumed]}
        trains:
          type: boolean
          description: |
            whether this service fine-tunes models at all, as it has a
            trainer configured; not a plan's say: a plan without fine-tuning
            is told by `runs.create`'s 402 `plan_required`
        limits: {$ref: "#/components/schemas/UploadLimits"}
        key: {$ref: "#/components/schemas/KeyIdentity"}
        email: {type: [string, "null"]}
        machine: {type: [string, "null"]}
        workspace:
          oneOf:
            - $ref: "#/components/schemas/WorkspaceIdentity"
            - type: "null"
        url: {type: string, description: "the console page of the caller's project"}

    UploadLimits:
      type: object
      description: |
        the sizes this service takes data in, for a client to size its
        requests by instead of copying them: one streamed snapshot
        (`snapshots.create` with an Arrow body, `?name=`) holds at most
        `snapshot_rows` rows and `snapshot_bytes` bytes; a resumable upload
        at most `upload_rows` rows and `upload_bytes` bytes, or
        `csv_bytes` for a CSV, sent in chunks of `chunk_bytes` unless the
        upload names its own; a JSON request body holds at most
        `request_bytes`
      required: [snapshot_bytes, snapshot_rows, upload_bytes, upload_rows, csv_bytes, chunk_bytes, request_bytes]
      additionalProperties: false
      properties:
        snapshot_bytes: {type: integer, minimum: 1}
        snapshot_rows: {type: integer, minimum: 1}
        upload_bytes: {type: integer, minimum: 1}
        upload_rows: {type: integer, minimum: 1}
        csv_bytes: {type: integer, minimum: 1}
        chunk_bytes: {type: integer, minimum: 1}
        request_bytes: {type: integer, minimum: 1}

    AuthStatusReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/AuthStatus"}

    LoggedOut:
      type: object
      required: [revoked]
      additionalProperties: false
      properties:
        revoked: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}

    LoggedOutReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/LoggedOut"}

    Organization:
      type: object
      required: [name, account]
      additionalProperties: false
