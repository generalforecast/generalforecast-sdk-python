        workspace: {$ref: "#/components/schemas/Name"}
        issuer: {type: string}
        subject: {type: string}
        role: {$ref: "#/components/schemas/WorkspaceRole"}
    MemberRole:
      type: object
      required: [issuer, subject, role]
      additionalProperties: false
      properties:
        issuer: {type: string}
        subject: {type: string}
        role: {$ref: "#/components/schemas/WorkspaceRole"}
    MemberRoleChanged:
      type: object
      required: [member]
