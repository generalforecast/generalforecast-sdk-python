    get:
      operationId: runs.list
      tags:
      - hosted
      summary: list the project's runs
      description: Every run, by fine-tune name and then version; `state`, `data_digest` and `tag`
        each list only the runs that match. A state that is not a run state is refused with
        `ValidationError`.
      parameters:
      - $ref: '#/components/parameters/project'
