components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: an API key from `gf admin key create`, or the login token `gf login` stores

  parameters:
    project:
      name: project
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
      description: the project; `gf whoami` shows the one in use
    predictor:
      name: name
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
      description: the predictor's `name` from gf.yaml
    evaluation:
      name: evaluation
      in: path
      required: true
      schema: {type: integer, minimum: 1}
      description: the evaluation's number, counted per predictor, as `evaluations.create` answered it
    environment:
      name: environment
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
    prefer:
      name: Prefer
      in: header
      required: false
      schema: {type: string, example: "respond-async, wait=20"}
      description: |
        `respond-async, wait=N` (RFC 7240) asks the hosted plane to accept a
        prediction it has not answered within `N` seconds (1 to 25, 20 when
        left out) and answer `202` with the prediction to poll, rather than
        hold the request open while hosted inference starts. Without
        `respond-async` the request is held until its answer.
    prediction:
      name: id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/PredictionId"}
      description: the prediction's id, from the `Location` of its `202`
    key:
      name: key
      in: path
      required: true
      schema: {type: string, pattern: "^key-[0-9a-f]{20,24}$"}
    run:
      name: run
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/RunRef'
    snapshot:
      name: snapshot
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Name'
    batch:
      name: name
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SyntheticBatchName'
      description: the synthetic batch's name
    secret:
      name: secret
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
    context:
      name: name
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
      description: the live context's name
    source:
      name: source
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
      description: a pin's `source_id`
    model:
      name: model
      in: path
      required: true
      schema:
        oneOf:
          - {$ref: "#/components/schemas/ModelName"}
          - {$ref: "#/components/schemas/FineTuneName"}
      description: |
        a catalog model's name without its `general-forecast/` prefix, such
        as `tabicl-v2-classifier`; one of the project's fine-tunes by its
        name, such as `credit-default`, for its latest version and every
        version; or one version as `<name>@ft<version>`, such as
        `credit-default@ft3`. A path segment holds no `/`, so a fine-tune's
        owner is the path's project. A fine-tune's name matches `ModelName`
        too: no fine-tune takes a catalog model's name, and a catalog name
        reads the catalog model

    workspace:
      name: workspace
      in: path
      required: true
      schema: {$ref: "#/components/schemas/Name"}
      description: the workspace's id, `ws-` and 16 hex digits for one made on sign-up
    join_request:
      name: id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/JoinRequestId"}
    invitation:
      name: id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/InvitationId"}
    waitlist_entry:
      name: id
      in: path
      required: true
      schema: {$ref: "#/components/schemas/WaitlistId"}

  responses:
    Accepted:
      description: |
        hosted only: the prediction is accepted and still starting or
        running; poll its `Location` after `Retry-After` seconds
      headers:
        Location:
          description: the prediction to poll, `/v1/projects/{project}/predictions/{id}`
          schema: {type: string}
        Retry-After:
          description: seconds before polling again, 5 or the pool's longer wait, at most 30
          schema: {type: integer, minimum: 1, maximum: 30}
        Preference-Applied:
          description: "`respond-async`, on the accept"
          schema: {type: string}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PredictionAccepted"
          examples:
            accepted:
              x-gf-hosted: true
              value:
                api_version: gf/v1
                project: acme
                request_id: r-3abb2401f119428db148927c6a0d358c
                resource: {kind: prediction, name: pred-0123456789abcdef01234567}
                result:
                  id: pred-0123456789abcdef01234567
                  state: starting
                  created: 1761200000
                  retry_after: 5
    NotReady:
      description: a served model is still loading or compiling
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            loading:
              value:
                api_version: gf/v1
                project: acme
                request_id: r-9e0f1a2b3c4d5e6f708192a3b4c5d6e7
                resource: {kind: predictor, name: churn}
                error:
                  code: ModelNotReady
                  message: general-forecast/tabicl-v2-classifier is compiling 12 programs
                  hint: poll /readyz until it answers 200

  schemas:
    Name:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}$"
      description: a resource name

    ModelName:
      type: string
      pattern: "^[a-z0-9][a-z0-9.-]{0,62}$"
      description: |
        a catalog model's name, its id without `general-forecast/`, such as
        `tabpfn-3.5-classifier`; unlike a chosen resource name it may start
        with a digit and hold dots

    RunModel:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}/[a-z][a-z0-9-]{0,62}@ft[1-9]\\d*$"
      description: |
        the model a run publishes, `<project>/<name>@ft<version>`, which
        names the run too: the fine-tune it trains and the version it
        publishes, as the catalog and `gf.yaml` name that version

    RunRef:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}(?:@ft[1-9]\\d*)?$"
      description: |
        a run by its `model` without the project, which the path names,
        `credit-default@ft2`, or a fine-tune's name alone, `credit-default`,
        for the name's latest run

    FineTuneName:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}@ft[1-9]\\d*$"
      description: |
        a project's fine-tune version by its name and version, as
        `credit-default@ft3` names `<project>/credit-default@ft3`

    ModelId:
      type: string
      pattern: "^[a-z][a-z0-9-]{0,62}/[a-z0-9][a-z0-9.-]{0,62}(?:@ft[1-9]\\d*)?(?:@sha256:[0-9a-f]{64})?(?:@\\d+)?(?:\\*\\d+)?$"
      description: |
        a catalog model id, `general-forecast/<name>`, or a derived model's,
        `<owner>/<name>@ft<version>`; then an optional digest pin
        (`@sha256:<digest>`) and variant suffix (`@4*2`)

    Digest:
      type: string
      pattern: "^sha256:[0-9a-f]{64}$"

    Task:
      type: string
      enum: [classification, regression, forecast]

    ResourceKind:
      type: string
      enum: [predictor, model, project, api-key, secret, context, source, workspace, snapshot, run, prediction]

    Resource:
      type: object
      description: what the envelope is about; GET lists use the collection name
      required: [kind, name]
      additionalProperties: false
      properties:
        kind: {$ref: "#/components/schemas/ResourceKind"}
        name: {type: string, minLength: 1, maxLength: 63}

    Envelope:
      type: object
      description: the fields every request and reply carries
      required: [api_version, project, request_id, resource]
      properties:
        api_version: {type: string, const: gf/v1}
        project: {$ref: "#/components/schemas/Name"}
        request_id: {type: string, minLength: 1, maxLength: 128, pattern: "^[\\x20-\\x7e]+$"}
        resource: {$ref: "#/components/schemas/Resource"}

    ErrorCode:
      type: string
      enum: [ValidationError, NotFound, Unauthorized, CapacityExceeded, ModelNotReady, Internal, Conflict, Unsupported, PaymentRequired]
      description: |
        ValidationError 422, NotFound 404, Unauthorized 401, CapacityExceeded
        422, ModelNotReady 503, Internal 500, Conflict 409 (a compare-and-swap
        on a stale generation), Unsupported 501 (an operation this server
        does not offer), PaymentRequired
        402 (the workspace's plan or credit does not cover the request).

        Hosted fine-tuning's gates, with their `reason`:
        `PaymentRequired` 402 `plan_required` (fine-tuning needs a Pro or
        Enterprise plan) and `credits_exhausted` (an enforced workspace has
        used its credits, which also refuses predictions);
        `Unauthorized` 403 `fine_tuning_unavailable` (fine-tuning is not
        turned on for the project);
        `CapacityExceeded` 429 `run_limit_reached` (the project has as many
        runs, Playground runs or evaluations queued or running as it may), `quota_exceeded` (the project's
        training data would pass its quota) and `snapshot_quota_exceeded`.
        Those three 429s carry `limit` and `actual`, and lift only when the
        caller ends a run or deletes data, so clients do not retry them; a
        429 `rate_limited` passes on its own and may be retried.
        A run's create is refused with `Conflict` 409 `run_active` (another
        run of the fine-tune is still queued or running) or `base_mismatch`
        (the fine-tune's versions train from another base), and with
        `ValidationError` 422 `base_is_fine_tune` (a fine-tune sent as the
        base). An evaluation refuses a model with `ValidationError` 422
        `model_not_hostable` (another task's model, or one the service does
        not host).

    Error:
      type: object
      description: |
        `param` names the payload field (`target`, `inputs.plan`, `queries`);
        every limit error carries `limit` and `actual` and names the model in
        `message`. The request id is in the envelope.
      required: [code, message]
      additionalProperties: false
      properties:
        code: {$ref: "#/components/schemas/ErrorCode"}
        message: {type: string}
        reason:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
          description: |
            The finer reason behind `code`, when the service has one. A
            refused browser session says why with `reauthentication_required`,
            `link_confirmation_required`, `session_required` or
            `waitlist_required`; `ErrorCode` lists fine-tuning's.
        param: {type: string}
        hint: {type: string}
        limit: {type: integer}
        actual: {type: integer}

    ErrorReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [error]
          properties:
            error: {$ref: "#/components/schemas/Error"}

    Row:
      type: object
      description: one record; column names are keys, cells are scalars
      additionalProperties:
        type: [string, number, boolean, "null"]

    Inputs:
      type: object
      description: |
        inputs by rule rather than by list: `exclude` removes columns from the
        inferred set, `types` overrides inferred types; forecast predictors
        use `past` and `future` instead
      additionalProperties: false
      properties:
        exclude: {type: array, items: {type: string}}
        types:
          type: object
          additionalProperties: {$ref: "#/components/schemas/Kind"}
        past: {type: array, items: {type: string}}
        future: {type: array, items: {type: string}}

    ColumnType:
      type: string
      enum: [number, category, text, boolean, date, timestamp]

    Kind:
      type: string
      description: |
        a column's kind, the one vocabulary gf.yaml's `inputs.types` and
        gf.lock use: whole numbers, real numbers, 0/1 flags, categories, free
        text, dates and times, and booleans
      enum: [int, float, "0/1", category, text, timestamp, bool]

    Selection:
      type: object
      description: |
        which context rows a query sees; fractions below 1 are of the model's
        row cap, integers are rows; `core: null` is the whole table
      additionalProperties: false
      properties:
        core: {type: [number, "null"], default: 0.25}
        neighbors: {type: number, default: 0.75}
        kind: {type: string, enum: [stratified, random], default: stratified}
        recent: {type: [integer, "null"]}

    Manifest:
      type: object
      description: |
        the ad hoc predictor: the gf.yaml fields, with `context` and `queries`
        as rows instead of a context declaration; `name` and `resources` are
        file-only
      required: [model, target, context, queries]
      additionalProperties: false
      properties:
        model: {$ref: "#/components/schemas/ModelId"}
        target: {type: string}
        id: {type: string}
        inputs:
          oneOf:
            - type: array
              items: {type: string}
            - $ref: "#/components/schemas/Inputs"
        time: {type: string}
        series: {type: array, items: {type: string}}
        related:
          description: |
            which series forecast jointly, at most 8 to a group: `all`, or the
            series columns whose values name each group; every series forecasts
            on its own when left out
          oneOf:
            - {type: string, enum: [all]}
            - type: array
              items: {type: string}
        frequency:
          oneOf:
            - {type: string, pattern: "^[1-9][0-9]*(s|min|h|d|w)$"}
            - {type: number, exclusiveMinimum: 0}
          description: "`1d`, `1h`, `7d`, or seconds as a number"
        horizon: {type: integer, minimum: 1}
        quantiles:
          type: array
          items: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
          default: [0.1, 0.5, 0.9]
        outputs:
          type: array
          items: {type: string, enum: [label, value, probabilities, quantiles]}
          description: defaults by task; classification label+probabilities, regression value, forecast value+quantiles
        selection: {$ref: "#/components/schemas/Selection"}
        context:
          type: array
          items: {$ref: "#/components/schemas/Row"}
        queries:
          type: array
          items: {$ref: "#/components/schemas/Row"}
          minItems: 1

    ManifestRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/Manifest"}

    Queries:
      type: object
      description: |
        the declared predictor payload; `context` only when the manifest
        declares `context: {request: ...}`
      required: [queries]
      additionalProperties: false
      properties:
        queries:
          type: array
          items: {$ref: "#/components/schemas/Row"}
          minItems: 1
        context:
          type: array
          items: {$ref: "#/components/schemas/Row"}
        as_of: {$ref: "#/components/schemas/AsOfRequest"}

    QueriesRequest:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [payload]
          properties:
            payload: {$ref: "#/components/schemas/Queries"}

    ContextKind:
      type: string
      enum: [snapshot, request, live]

    AsOfRequest:
      description: |
        for a live context, score against the rows accepted at or before this
        instant: an RFC 3339 time (one with no offset is UTC), or a number of
        seconds since the epoch. Anything else is a `ValidationError` whose
        `param` is `as_of`. A snapshot or request context refuses it the same
        way.
      oneOf:
        - {type: string, format: date-time}
        - {type: number, minimum: 0}

    AsOf:
      description: |
        an instant as every reply carries it: an RFC 3339 UTC string such as
        `2026-10-27T08:00:00Z`, or null
      oneOf:
        - {type: string, format: date-time, pattern: "Z$"}
        - {type: "null"}

    ContextInfo:
      type: object
      description: |
        the context a prediction actually used. `source` is the context's kind; `name` names
        a live context; `version` is a live context's accepted sequence;
        `digest` is a snapshot's content digest; `rows` counts the rows read;
        `as_of` is the instant a live context was read as of. Each field a
        source does not have is null.
      required: [source, name, version, digest, rows, as_of]
      additionalProperties: false
      properties:
        source: {$ref: "#/components/schemas/ContextKind"}
        name:
          oneOf:
            - $ref: "#/components/schemas/Name"
            - type: "null"
        version: {type: [integer, "null"], minimum: 0}
        digest:
          oneOf:
            - $ref: "#/components/schemas/Digest"
            - type: "null"
        rows: {type: integer, minimum: 0}
        as_of: {$ref: "#/components/schemas/AsOf"}

    Prediction:
      type: object
      description: |
        the query's id under the manifest's id column name when it declares
        one (omitted when it does not); `label` and `probabilities` for
        classification, `value` for regression, `value` and `quantiles` for
        forecasts
      additionalProperties: {type: [string, integer]}
      properties:
        label: {type: [string, integer, boolean]}
        value: {type: number}
        probabilities:
          type: object
          additionalProperties: {type: number}
        quantiles:
          type: object
          additionalProperties: {type: number}

    Result:
      type: object
      required: [model, task, context, predictions]
      additionalProperties: false
      properties:
        model: {$ref: "#/components/schemas/ModelId"}
        task: {$ref: "#/components/schemas/Task"}
        context: {$ref: "#/components/schemas/ContextInfo"}
        predictor:
          oneOf:
            - $ref: "#/components/schemas/Name"
            - type: "null"
        revision: {type: [integer, "null"], minimum: 1}
        environment:
          oneOf:
            - $ref: "#/components/schemas/Name"
            - type: "null"
        predictions:
          type: array
          items: {$ref: "#/components/schemas/Prediction"}

    ResultReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Result"}

    PredictionId:
      type: string
      pattern: "^pred-[0-9a-f]{24}$"
      description: a prediction the hosted plane accepted, `pred-` and 24 hex digits

    PredictionStatus:
      type: object
      description: |
        a prediction the hosted plane accepted and is still working on:
        `starting` while hosted inference starts, `running` once it has
        taken the work
      required: [id, state, created, retry_after]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/PredictionId"}
        state: {type: string, enum: [starting, running]}
        created: {type: number, description: when it was accepted, in unix seconds}
        retry_after: {type: integer, minimum: 1, maximum: 30, description: seconds before polling again}

    PredictionAccepted:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/PredictionStatus"}

    Limits:
      type: object
      description: the most a model accepts in one call
      required: [context_rows, queries, inputs]
      additionalProperties: false
      properties:
        context_rows: {type: integer, minimum: 1}
        queries: {type: integer, minimum: 1}
        inputs: {type: integer, minimum: 1}

    Shape:
      type: object
      description: a compiled program's shape
      required: [context_rows, queries, inputs]
      additionalProperties: false
      properties:
        context_rows: {type: integer, minimum: 1}
        queries: {type: integer, minimum: 1}
        inputs: {type: integer, minimum: 1}
        classes: {type: integer, minimum: 2}

    LockInput:
      type: object
      description: |
        an input column as gf.lock pins it: its kind (null when a request or
        live context's rows were not seen) and its role, `input` for a
        tabular model, `past` or `future` for a forecaster's covariates
      required: [name, type, role]
      additionalProperties: false
      properties:
        name: {type: string}
        type:
          oneOf:
            - $ref: "#/components/schemas/Kind"
            - type: "null"
        role: {type: string, enum: [input, past, future]}

    ContextLock:
      type: object
      description: |
        the context as gf.lock pins it: a snapshot's file, its context rows'
        digest and count and the split that made its queries; a live
        context's name; a request context's most rows per call
      required: [kind]
      additionalProperties: false
      properties:
        kind: {$ref: "#/components/schemas/ContextKind"}
        rows: {type: integer, minimum: 0}
        query_rows: {type: integer, minimum: 0}
        digest: {$ref: "#/components/schemas/Digest"}
        path: {type: string}
        name: {$ref: "#/components/schemas/Name"}
        max_rows: {type: integer, minimum: 1}
        until: {type: string, description: labeled rows at or after this ISO time are queries}
        holdout: {$ref: "#/components/schemas/LockHoldout"}

    LockHoldout:
      type: object
      description: |
        a seeded random draw of the labeled rows are queries: `fraction` of
        them or `rows` of them, exactly one of the two. `stratify`, `group`
        and `repeats` are present only when the manifest sets them, so a
        holdout of a fraction and a seed is `{fraction, seed}`
      required: [seed]
      additionalProperties: false
      properties:
        fraction:
          type: number
          exclusiveMinimum: 0
          exclusiveMaximum: 1
          description: the share of the labeled rows held out, rounded to a row
        rows:
          type: integer
          minimum: 1
          description: how many labeled rows are held out, fewer than there are
        seed: {type: integer, minimum: 0}
        stratify:
          type: boolean
          description: |
            true when the held-out rows keep the target's shares: each class
            of a classifier's target, each of ten equal-count bins of a
            regressor's, within a row
        group:
          type: string
          description: |
            a column whose values never straddle the split: whole values are
            held out until they hold the size asked; never with `stratify`
        repeats:
          type: integer
          minimum: 2
          maximum: 100
          description: |
            how many draws the holdout is, draw r seeded `seed + r`. The
            lock's digest, rows and query_rows are the first draw's, the
            context a push deploys; `gf eval` scores every draw

    ResolvedSelection:
      type: object
      description: |
        the selection as gf.lock pins it, in rows: `exact` reads the whole
        context, `retrieved` a core and each query's nearest rows, and
        `adaptive` resolves per call for a context only calls carry
      required: [strategy, core, neighbors, kind, recent, seed]
      additionalProperties: false
      properties:
        strategy: {type: string, enum: [exact, adaptive, retrieved]}
        core: {type: [integer, "null"], minimum: 0}
        neighbors: {type: integer, minimum: 0}
        kind: {type: string, enum: [stratified, random, balanced, diverse]}
        recent: {type: [integer, "null"], minimum: 0}
        seed: {type: integer, minimum: 0}

    DerivedBase:
      type: object
      description: |
        what a derived model runs on: the catalog base and its digest, which
        its weights are only valid with, how many bags of weights it
        averages (each counts as one estimator), and what kind of change
        its weights make
      required: [base, base_digest, bags, kind]
      additionalProperties: false
      properties:
        base: {$ref: "#/components/schemas/ModelId"}
        base_digest: {$ref: "#/components/schemas/Digest"}
        bags: {type: integer, minimum: 1, maximum: 64}
        kind:
          type: string
          enum: [lora, input_adapter, full]
          description: as `DerivedModel.kind`

    Resolution:
      type: object
      description: the resolved predictor gf.lock pins
      required: [name, model, model_digest, task, target, target_type, outputs, inputs, context, selection]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        model: {$ref: "#/components/schemas/ModelId"}
        model_digest: {$ref: "#/components/schemas/Digest"}
        derived: {$ref: "#/components/schemas/DerivedBase"}
        task: {$ref: "#/components/schemas/Task"}
        target: {type: string}
        target_type:
          oneOf:
            - $ref: "#/components/schemas/Kind"
            - type: "null"
        classes: {type: array, items: {type: [string, integer, boolean]}}
        id: {type: string}
        id_type:
          oneOf:
            - $ref: "#/components/schemas/Kind"
            - type: "null"
        time: {type: string}
        time_type:
          oneOf:
            - $ref: "#/components/schemas/Kind"
            - type: "null"
        series: {type: array, items: {type: string}}
        series_types:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/Kind"
              - type: "null"
        related:
          type: array
          items: {type: string}
          description: |
            a forecaster's declared groups: empty for one group of every
            series, else the series columns whose values name each group;
            absent, every series forecasts on its own
        frequency: {type: [string, number]}
        horizon: {type: integer, minimum: 1}
        quantiles: {type: array, items: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}}
        outputs: {type: array, items: {type: string}, minItems: 1}
        inputs:
          type: array
          items: {$ref: "#/components/schemas/LockInput"}
        context: {$ref: "#/components/schemas/ContextLock"}
        selection: {$ref: "#/components/schemas/ResolvedSelection"}

    Serving:
      type: object
      description: whether this server has the predictor's model loaded and compiled
      required: [loaded, compiled, warm_shapes]
      additionalProperties: false
      properties:
        loaded: {type: boolean}
        compiled: {type: boolean}
        warm_shapes:
          type: array
          items: {$ref: "#/components/schemas/Shape"}

    Predictor:
      type: object
      description: |
        a predictor by name, with its environments. Its resolution (the fields
        `Resolution` names, `limits` and `serving`) is there once it resolves:
        once the predictor has a revision, from its latest. `created_at` and `latest_revision`
        come from the hosted journal; a declared predictor has neither.
      required: [name, environments]
      additionalProperties: false
      properties:
        name: {$ref: "#/components/schemas/Name"}
        created_at: {type: number}
        latest_revision: {type: [integer, "null"], minimum: 1}
        environments:
          type: array
          description: the hosted environments
          items: {$ref: "#/components/schemas/Environment"}
        lock_digest:
          $ref: "#/components/schemas/Digest"
          description: the digest of the gf.lock the predictor resolves to
        model: {$ref: "#/components/schemas/ModelId"}
        model_digest: {$ref: "#/components/schemas/Digest"}
        task: {$ref: "#/components/schemas/Task"}
        target: {type: string}
        target_type:
          oneOf:
            - $ref: "#/components/schemas/Kind"
            - type: "null"
        classes: {type: array, items: {type: [string, integer, boolean]}}
        id: {type: string}
        time: {type: string}
        series: {type: array, items: {type: string}}
        inputs:
          type: array
          items: {$ref: "#/components/schemas/LockInput"}
        context: {$ref: "#/components/schemas/ContextLock"}
        selection: {$ref: "#/components/schemas/ResolvedSelection"}
        limits: {$ref: "#/components/schemas/Limits"}
        serving: {$ref: "#/components/schemas/Serving"}

    PredictorReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/Predictor"}

    PredictorList:
      type: object
      required: [predictors]
      additionalProperties: false
      properties:
        predictors:
          type: array
          items: {$ref: "#/components/schemas/Predictor"}

    PredictorListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/PredictorList"}

    Model:
      type: object
      description: |
        the catalog's description of a served model: `model` is the resolved
        id with its content digest, `limits` what one call may send here,
        `warm_shapes` the shapes compiled at startup
      required: [model, name, task, artifact, bounds, capabilities, runtime, license, repository, revision, limits, warm_shapes]
      additionalProperties: false
      properties:
        model:
          type: string
          description: |
            the id with its content digest: `general-forecast/<name>@sha256:<digest>`
            for a catalog model, `<project>/<name>@ft<version>@sha256:<digest>`
            with the weights' digest for a fine-tune. It is the resolved id a
            prediction's `model` reports; name a model by `name`.
        name:
          $ref: "#/components/schemas/ModelId"
          description: |
            the model's id, which `gf.yaml`, `models.get` and a run's `base`
            take: `general-forecast/<name>`, or a fine-tune version's
            `<project>/<name>@ft<version>`
        derived: {$ref: "#/components/schemas/DerivedModel"}
        versions:
          type: array
          items: {$ref: "#/components/schemas/FineTuneVersion"}
          description: |
            every version of a fine-tune, newest first: present when
            `models.get` names a fine-tune without a version, and the rest of
            the model is then its latest version
        task: {$ref: "#/components/schemas/Task"}
        repository: {type: string}
        revision: {type: string}
        license: {type: string}
        runtime: {type: string, enum: [cpu, gpu]}
        artifact: {$ref: "#/components/schemas/Artifact"}
        artifact_verification: {type: string}
        license_source: {type: string, description: where a forecaster's license is pinned}
        variant: {$ref: "#/components/schemas/ModelVariant"}
        bounds:
          type: object
          description: |
            the model's own caps, before this server's limits; a forecaster's
            `quantiles` lists the levels it outputs
          additionalProperties:
            oneOf:
              - {type: array, items: {type: number}}
              - {type: [integer, number, "null"]}
        capabilities:
          type: array
          items: {$ref: "#/components/schemas/Capability"}
        limits: {$ref: "#/components/schemas/Limits"}
        warm_shapes:
          type: array
          items: {$ref: "#/components/schemas/Shape"}
        architecture: {$ref: "#/components/schemas/ModelArchitecture"}

    ModelArchitecture:
      type: object
      description: |
        what a run's `architecture` may change of a catalog model: its
        stages, every standard component kind with its options, their
        settings and default inits and what the model cannot take, and
        the init types. Present on the catalog models a run may change, the
        ones that can be fine-tuned.
      required: [stages, components, inits]
      additionalProperties: false
      properties:
        stages:
          type: array
          description: the groups of the model's attention blocks a change may name in `stages`
          items: {type: string}
        components:
          type: array
          items: {$ref: "#/components/schemas/ArchitectureComponent"}
        inits:
          type: array
          items: {$ref: "#/components/schemas/ArchitectureInit"}

    ArchitectureComponent:
      type: object
      description: a component kind, its options and what this model cannot take of it
      required: [component, description, options, unavailable]
      additionalProperties: false
      properties:
        component: {$ref: "#/components/schemas/RunArchitectureComponent"}
        description: {type: string}
        options:
          type: array
          items: {$ref: "#/components/schemas/ArchitectureOption"}
        unavailable:
          type: array
          items: {$ref: "#/components/schemas/ArchitectureUnavailable"}

    ArchitectureOption:
      type: object
      description: one option of a component, its settings, and how its new parameters start under the `default` init; `default_init` is null for an option without parameters, which takes no init
      required: [type, description, settings, default_init]
      additionalProperties: false
      properties:
        type: {type: string}
        description: {type: string}
        settings:
          type: array
          items: {$ref: "#/components/schemas/ArchitectureSetting"}
        default_init: {type: [string, "null"]}

    ArchitectureSetting:
      type: object
      description: one setting of an option or an init; `default` is its value when left out (null for a width the block gives), absent for a `required` one
      required: [name, type, description]
      additionalProperties: false
      properties:
        name: {type: string}
        type: {type: string, enum: [integer, number, boolean]}
        description: {type: string}
        default: {type: [integer, number, boolean, "null"]}
        minimum: {type: number}
        required: {type: boolean}

    ArchitectureUnavailable:
      type: object
      description: options of a component the model cannot take in some stages, and why; empty `options` is every option, empty `stages` every stage
      required: [options, stages, reason]
      additionalProperties: false
      properties:
        options:
          type: array
          items: {type: string}
        stages:
          type: array
          items: {type: string}
        reason: {type: string}

    ArchitectureInit:
      type: object
      description: an init type; a `fan_based` one draws matrices alone, a change's vectors then taking the option's default
      required: [type, description, settings, fan_based]
      additionalProperties: false
      properties:
        type: {type: string}
        description: {type: string}
        settings:
          type: array
          items: {$ref: "#/components/schemas/ArchitectureSetting"}
        fan_based: {type: boolean}

    DerivedModel:
      type: object
      description: |
        what a fine-tune is made of, as a predictor's lock records it: its
        base, pinned, and its weights; present on the project's fine-tunes
        alone, which otherwise describe themselves as their base does
      required: [base, base_digest, digest, bags, kind, version, created, kept_step]
      additionalProperties: false
      properties:
        base: {$ref: "#/components/schemas/ModelId"}
        base_digest: {$ref: "#/components/schemas/Digest"}
        digest: {$ref: "#/components/schemas/Digest"}
        bags: {type: integer, minimum: 1, description: estimators the weights hold, averaged when served}
        kind: {$ref: "#/components/schemas/FineTuneKind"}
        version: {type: integer, minimum: 1}
        created: {type: number, description: "when the version was published, in seconds since the epoch, as every resource's `created`"}
        kept_step: {$ref: "#/components/schemas/KeptStep"}
        architecture:
          type: array
          description: |
            the changes to the base's architecture the version was trained
            and is served with, resolved, as its run's `architecture`;
            absent for a version that changes none
          items: {$ref: "#/components/schemas/RunResolvedArchitectureChange"}

    FineTuneKind:
      type: string
      enum: [lora, input_adapter, full]
      description: |
        what the weights change of the base: low-rank adapters on its layers
        (`lora`), an input adapter in front of it (`input_adapter`), or the
        named components' own weights (`full`), the names a run's `changes`
        use. A version trained with LoRA beside an input adapter is
        `input_adapter`: the LoRA is stored with it.

    KeptStep:
      type: [integer, "null"]
      minimum: 0
      description: |
        the training step whose weights the version keeps: the one that
        scored best on the rows the run held out. Step 0 is the base
        itself: no check during training beat the base, so the version
        predicts exactly as its base does. Null for a version whose run
        did not say.

    FineTuneVersion:
      type: object
      description: |
        one published version of a fine-tune: its id, its weights' digest
        and the step its run kept. The run that trained it has the same id
        as its `model`. A version never changes: its id names the same
        weights for as long as it exists.
      required: [name, digest, version, kind, created, kept_step]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/ModelId"
          description: the version's id, `<project>/<name>@ft<version>`, which a predictor's `gf.yaml` names
        digest:
          $ref: "#/components/schemas/Digest"
          description: the digest of the version's weights, which `gf.lock` pins
        version: {type: integer, minimum: 1}
        kind: {$ref: "#/components/schemas/FineTuneKind"}
        created: {type: number, description: "when the version was published, in seconds since the epoch, as every resource's `created`"}
        kept_step: {$ref: "#/components/schemas/KeptStep"}

    ModelVariant:
      type: object
