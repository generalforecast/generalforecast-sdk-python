  /v1/projects/{project}/runs/{run}/cancel:
    post:
      operationId: runs.cancel
      tags:
      - hosted
      summary: cancel a run
      description: A run a trainer is working on moves to `cancelling` until it stops, then ends `cancelled`.
        With `save`, a run that is training stops at its next report and publishes the weights trained
        so far as the version the run was created for, as a run stopped by its budget does; the run's
        `published`, and its lineage's `published` note, name the version. Without `save` nothing is published.
        A run that is not training (queued, setting up or preempted) has no weights in hand, so
        `save` publishes nothing. Cancelling an ended or cancelling run returns it unchanged.
      parameters:
      - $ref: '#/components/parameters/project'
      - $ref: '#/components/parameters/run'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCancelRequest'
            examples:
              cancel:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-097c1e9a2b4d6f8031a5c7e9b2d4f6a8
                  resource:
                    kind: run
                    name: credit-default@ft1
                  payload: {}
