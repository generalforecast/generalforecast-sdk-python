                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-7c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f
                    resource: {kind: source, name: identity}
                    result:
                      kind: bigquery
                      identity:
                        email: gfws-3f9a1c2b4d5e6f70@gf-sources.iam.gserviceaccount.com
                        unique_id: "104857600000000000001"
                        principal: serviceAccount:gfws-3f9a1c2b4d5e6f70@gf-sources.iam.gserviceaccount.com
                      grants:
                        - {role: roles/bigquery.dataViewer, "on": dataset}
                        - {role: roles/bigquery.jobUser, "on": project}
                        - {role: roles/bigquery.readSessionUser, "on": project}
                      steps:
                        - "Grant serviceAccount:gfws-3f9a1c2b4d5e6f70@gf-sources.iam.gserviceaccount.com BigQuery Data Viewer (roles/bigquery.dataViewer) on the dataset."
                        - "Grant it BigQuery Job User (roles/bigquery.jobUser) and BigQuery Read Session User (roles/bigquery.readSessionUser) on your project that pays for its queries, and name that project as the source's billing_project."

  /v1/projects/{project}/snapshots:
