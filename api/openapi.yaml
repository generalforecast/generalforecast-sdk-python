  /v1/projects/{project}/sources:prepare:
    post:
      operationId: sources.prepare
      tags: [hosted]
      summary: make or show the identity a data source of a kind is granted to
      description: |
        Makes the workspace's Google service account if it has none and
        answers its address, its unique id and what the customer sets up
        for a source of `kind`, in `steps`, in order. BigQuery and Cloud
        Storage grant the account Google roles (`grants`): BigQuery's Data
        Viewer on the dataset, and Job User and Read Session User on the
        project its queries run and bill in, the source's
        `billing_project`; Cloud Storage's Object Viewer on the bucket.
        S3, Databricks and Snowflake grant no Google role: they trust the
        account's Google ID tokens, whose issuer, subject and audience
        `oidc` names, and `policy` is the document to paste (an IAM role's
        trust policy, a service principal's federation policy). No kind
        stores a secret. The same account answers every kind and every
        later call. Needs `sources:manage`, which only the admin role
        holds; each answer and each refusal is in the project's audit log.
      parameters:
        - $ref: "#/components/parameters/project"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourcePrepareRequest"
            examples:
              bigquery:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-7c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f
                  resource: {kind: source, name: identity}
                  payload: {kind: bigquery}
      responses:
