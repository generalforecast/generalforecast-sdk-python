        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/AuditLog"}

    DeviceLoginStart:
      type: object
      required: [machine, client]
      additionalProperties: false
      properties:
        machine: {type: string, description: the machine the key is named after}
        client:
          type: string
          enum: [cli, notebook]
          description: a CLI's key lasts 90 days; a notebook's 12 hours, and is ephemeral

    DeviceLoginGrant:
      type: object
      required: [device_code, user_code, verification_uri, verification_uri_complete, expires_in, interval]
      additionalProperties: false
      properties:
        device_code: {type: string, pattern: "^gf_dc_[A-Za-z0-9_-]{43}$"}
        user_code: {type: string, pattern: "^[A-Z0-9]{4}-[A-Z0-9]{4}$"}
        verification_uri: {type: string}
        verification_uri_complete: {type: string}
        expires_in: {type: integer, minimum: 1}
        interval: {type: integer, minimum: 1}

    DeviceLoginPoll:
      type: object
      required: [device_code]
      additionalProperties: false
      properties:
        device_code: {type: string, pattern: "^gf_dc_[A-Za-z0-9_-]{43}$"}

    DeviceLoginToken:
      type: object
      required: [access_token, token_type, expires_at, key, email, workspace, project, url]
      additionalProperties: false
      properties:
        access_token: {type: string}
        token_type: {type: string, const: bearer}
        expires_at: {type: [number, "null"], description: Unix seconds the token stops working}
        key: {$ref: "#/components/schemas/KeyIdentity"}
        email: {type: string}
        workspace: {$ref: "#/components/schemas/WorkspaceIdentity"}
        project: {$ref: "#/components/schemas/Name"}
        url: {type: string, description: the project's console page}

    LoginErrorReply:
      type: object
      description: |
        why a device login cannot go on, outside the envelope as the login is.
        `reason` says which: `authorization_pending` (`Unauthorized`, poll
        again), `slow_down` (`ValidationError`, poll less often),
        `expired_token` and `access_denied` (`Unauthorized`, start again) or
        `rate_limited` (`CapacityExceeded`).
      required: [error]
      additionalProperties: false
      properties:
        error: {$ref: "#/components/schemas/Error"}

    WorkspaceRole:
      type: string
      enum: [admin, editor, viewer, scorer]
      description: a workspace member's role; `admin` manages the workspace
    JoinRequestId: {type: string, pattern: "^jr-[0-9a-f]{16}$"}
    InvitationId: {type: string, pattern: "^inv-[0-9a-f]{16}$"}
    WaitlistId: {type: string, pattern: "^wl-[0-9a-f]{16}$"}
    WorkspaceName: {type: string, minLength: 1, maxLength: 80, description: "a workspace's display name, without leading or trailing spaces"}
    UserCode: {type: string, minLength: 8, maxLength: 16, description: "the code `gf login` prints, `XXXX-XXXX` from BCDFGHJKLMNPQRSTVWXZ, taken in any case and with or without the dash"}
    WorkspaceSummary:
      type: object
      description: "a workspace the caller belongs to: its role there and the projects it may use"
      required: [workspace, display_name, role, admin, default_project, projects]
      additionalProperties: false
      properties:
        workspace: {$ref: "#/components/schemas/Name"}
        display_name: {type: string}
        role:
          oneOf:
            - {$ref: "#/components/schemas/WorkspaceRole"}
            - {type: "null"}
        admin: {type: boolean}
        default_project:
          oneOf:
            - {$ref: "#/components/schemas/Name"}
            - {type: "null"}
        projects:
          type: array
          items: {$ref: "#/components/schemas/Name"}
    WorkspaceDetails:
      type: object
      description: |
        a workspace as `workspaces.get` reads it: its summary, its
        organization and when it was made. Its fields are listed whole, as
        `WorkspaceSummary` allows no other fields.
      required: [workspace, display_name, role, admin, default_project, projects, organization, created_at]
      additionalProperties: false
      properties:
        workspace: {$ref: "#/components/schemas/Name"}
        display_name: {type: string}
        role:
          oneOf:
            - {$ref: "#/components/schemas/WorkspaceRole"}
            - {type: "null"}
        admin: {type: boolean}
        default_project:
          oneOf:
            - {$ref: "#/components/schemas/Name"}
            - {type: "null"}
        projects:
          type: array
          items: {$ref: "#/components/schemas/Name"}
        organization: {$ref: "#/components/schemas/Name"}
        created_at: {type: number}
    JoinRequest:
      type: object
      description: a request to join a workspace, as the person who asked sees it
      required: [id, workspace, display_name, state, created_at, decided_at]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/JoinRequestId"}
        workspace: {$ref: "#/components/schemas/Name"}
        display_name: {type: string}
        state:
          type: string
          enum: [pending, approved, denied, cancelled]
        created_at: {type: number}
        decided_at:
          type: [number, "null"]
    JoinRequestAdmin:
      type: object
      description: a request to join a workspace, as its admins see it
      required: [id, workspace, subject, email, name, domain, state, role, created_at, decided_at, decided_by]
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/JoinRequestId"}
        workspace: {$ref: "#/components/schemas/Name"}
        subject: {type: string}
        email: {type: string}
        name:
          type: [string, "null"]
        domain: {type: string}
        state:
          type: string
          enum: [pending, approved, denied, cancelled]
        role:
          oneOf:
            - {$ref: "#/components/schemas/WorkspaceRole"}
            - {type: "null"}
        created_at: {type: number}
        decided_at:
          type: [number, "null"]
        decided_by:
          type: [string, "null"]
    OnboardingProfile:
      type: object
      description: the signed-in person's verified email, all null until they sign in again
      required: [email, email_domain, display_name, personal_domain]
      additionalProperties: false
      properties:
        email:
          type: [string, "null"]
        email_domain:
          type: [string, "null"]
        display_name:
          type: [string, "null"]
        personal_domain:
          type: [boolean, "null"]
    DiscoveredWorkspace:
      type: object
      description: a workspace the person's email domain may ask to join
      required: [workspace, display_name, domain, request]
      additionalProperties: false
      properties:
        workspace: {$ref: "#/components/schemas/Name"}
        display_name: {type: string}
        domain: {type: string}
        request:
          oneOf:
            - {$ref: "#/components/schemas/JoinRequest"}
            - {type: "null"}
    Onboarding:
      type: object
      description: "where a signed-in person stands: their workspaces, those their domain may join, and whether they may create one"
      required: [state, profile, workspaces, discovered, requests, can_create_workspace, signup, workspace_name, sign_in_url]
      additionalProperties: false
      properties:
        state:
          type: string
          enum: [member, onboarding, reauthentication_required]
        profile: {$ref: "#/components/schemas/OnboardingProfile"}
        workspaces:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceSummary"}
        discovered:
          type: array
          items: {$ref: "#/components/schemas/DiscoveredWorkspace"}
        requests:
          type: array
          items: {$ref: "#/components/schemas/JoinRequest"}
        can_create_workspace: {type: boolean}
        signup:
          type: string
          enum: [open, waitlist, pending]
        workspace_name:
          type: [string, "null"]
        sign_in_url: {type: string}
    WorkspaceList:
      type: object
      required: [workspaces]
      additionalProperties: false
      properties:
        workspaces:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceSummary"}
    WorkspaceCreate:
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        display_name: {$ref: "#/components/schemas/WorkspaceName"}
    WorkspaceCreated:
      type: object
      description: "`created` is false when the request id already made this workspace"
      required: [workspace, organization, created]
      additionalProperties: false
      properties:
        workspace: {$ref: "#/components/schemas/WorkspaceSummary"}
        organization: {$ref: "#/components/schemas/Name"}
        created: {type: boolean}
    WorkspaceRef:
      type: object
      required: [workspace]
      additionalProperties: false
      properties:
        workspace: {$ref: "#/components/schemas/Name"}
    WorkspaceRename:
      type: object
      required: [workspace, display_name]
      additionalProperties: false
      properties:
        workspace: {$ref: "#/components/schemas/Name"}
        display_name: {$ref: "#/components/schemas/WorkspaceName"}
    WorkspaceJoin:
      type: object
      description: "`workspace` is set once the caller is a member, `request` while a join request is pending or was denied lately"
      required: [status, workspace, request]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [already_member, pending, denied]
        workspace:
          oneOf:
            - {$ref: "#/components/schemas/WorkspaceSummary"}
            - {type: "null"}
        request:
          oneOf:
            - {$ref: "#/components/schemas/JoinRequest"}
            - {type: "null"}
    WorkspaceMember:
      type: object
      description: one membership in the workspace, its organizations or projects
      required: [issuer, subject, email, name, scope_kind, scope_id, role]
      additionalProperties: false
      properties:
        issuer: {type: string}
        subject: {type: string}
        email:
          type: [string, "null"]
        name:
          type: [string, "null"]
        scope_kind:
          type: string
          enum: [account, organization, project]
        scope_id: {type: string}
        role: {$ref: "#/components/schemas/WorkspaceRole"}
    WorkspaceMemberList:
      type: object
      required: [members]
      additionalProperties: false
      properties:
        members:
          type: array
          items: {$ref: "#/components/schemas/WorkspaceMember"}
    MemberRoleChange:
