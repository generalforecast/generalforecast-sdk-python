                        bytes: 52428800
                        rows: 500000
                        columns:
                        - name: income
                          type: double
                        - name: defaulted
                          type: int64
                        metadata:
                          target: defaulted
                          task: classification
                          origin:
                            kind: uploaded
                        tags: [credit, stage:signal, uploaded]
                        error: null
                        expires: null
                        created: 1761200000.0
                      - name: churn-history-2026-01
                        state: ready
                        digest: sha256:b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2
                        bytes: 73416
                        rows: 1840
                        columns:
                        - name: spend
                          type: double
                        - name: churned
                          type: bool
                        metadata:
                          target: churned
                          task: classification
                          origin:
                            kind: context
                            context: churn-history
                            as_of: "2026-01-01T00:00:00Z"
                        tags: [uploaded]
                        error: null
                        expires: null
                        created: 1761200100.0
    post:
      operationId: snapshots.create
      tags:
      - hosted
      summary: create a named snapshot, by a resumable Parquet upload or an Arrow stream
      description: |
        A snapshot is an immutable table, named in its project: training
        runs read it by name, and predictor revisions and context imports
        by digest. A name is never reused, even once its snapshot is
        deleted; the same name with the same content returns the snapshot,
        and with other content is refused with 409. `tags` label it for
        `snapshots.list` to find by `tag`; `snapshots.update` replaces them
        later. An Arrow stream's snapshot starts without tags of its own.
        Every snapshot of real data, uploaded, streamed or made from a live
        context, also carries the reserved tag `uploaded`, which the service
        adds; `uploaded`, `synthetic` and any
        tag starting `synthetic-` are refused in `tags` with 422.

        A JSON payload opens a resumable upload of a Parquet table of up to
        8 GiB, with its size and training metadata. `url` is a resumable
        session to `PUT` the bytes to, in `chunk_bytes` chunks with
        `Content-Range`; a plane without object storage answers `url: null`
        and takes the same chunks at `snapshots.bytes`. Once every declared
        byte is stored, the plane
        verifies the upload on its own: it reads the Parquet footer, checks
        the named columns exist and hashes the rows, and the snapshot
        becomes `ready`, or `rejected` with an `error`. An upload left open
        for a day expires.

        An Arrow IPC stream body is a table of at most 100,000 rows and
        32 MiB, `ready` at once. It is not an envelope, so the request id
        and project ride in headers, and the query names the snapshot and,
        optionally, its training metadata. The digest is of the normalized
        table, so a client can check it against its own.
      parameters:
      - $ref: '#/components/parameters/project'
      - name: name
        in: query
        required: false
        description: an Arrow stream's snapshot name, which an Arrow stream must send
        schema:
          $ref: '#/components/schemas/Name'
      - name: target
        in: query
        required: false
        description: an Arrow stream's target column, sent with `task`
        schema:
          type: string
      - name: task
        in: query
        required: false
        description: an Arrow stream's task, sent with `target`
        schema:
          type: string
          enum:
          - classification
          - regression
      - name: time
        in: query
        required: false
        description: an Arrow stream's time column
        schema:
          type: string
      - name: group
        in: query
        required: false
        description: an Arrow stream's group column
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SnapshotCreateRequest'
            examples:
              create:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-0b7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                  resource:
                    kind: snapshot
                    name: credit-2026-01
                  payload:
                    name: credit-2026-01
                    bytes: 52428800
                    format: parquet
                    tags: [credit, stage:signal]
                    metadata:
                      target: defaulted
                      task: classification
                      time: applied_at
          application/vnd.apache.arrow.stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: the snapshot, and for an upload where to send its bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotReply'
              examples:
                create:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-0b7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                    resource:
                      kind: snapshot
                      name: credit-2026-01
                    result:
                      name: credit-2026-01
                      state: open
                      digest: null
                      bytes: 52428800
                      rows: null
                      columns: null
                      metadata:
                        target: defaulted
                        task: classification
                        time: applied_at
                        origin:
                          kind: uploaded
                      tags: [credit, stage:signal, uploaded]
                      error: null
                      expires: 1761286400.0
                      created: 1761200000.0
                      url: https://storage.googleapis.com/upload/storage/v1/b/gf-artifacts/o?uploadType=resumable&upload_id=ADPycdu
                      method: PUT
                      chunk_bytes: 8388608
                streamed:
                  summary: an Arrow stream, ready at once
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-1c4524901f88a3b4730006b3bf14c7fc
                    resource:
                      kind: snapshot
                      name: fraud-5fb6a4c6f24b
                    result:
                      name: fraud-5fb6a4c6f24b
                      state: ready
                      digest: sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e
                      bytes: 73416
                      rows: 1840
                      columns:
                      - name: amount
                        type: double
                      - name: is_fraud
                        type: bool
                      metadata: null
                      tags: [uploaded]
                      error: null
                      expires: null
                      created: 1761200000.0
        '402':
          description: the workspace's plan takes no resumable upload or synthetic batch (the Free plan), or its credits are used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorReply'
              examples:
                plan_required:
                  x-gf-hosted: true
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-0a2c1e9a2b4d6f8031a5c7e9b2d4f402
                    resource:
                      kind: snapshot
                      name: credit-2026-01
                    error:
                      code: PaymentRequired
                      message: the Free plan takes tables of up to 100,000 rows and 32 MiB and does not include fine-tuning; upgrade to Pro to send larger tables and fine-tune models
                      reason: plan_required
        '409':
          description: the name is another table's; a name is never reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorReply'
              examples:
                taken:
                  x-gf-hosted: true
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-0b7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                    resource:
                      kind: snapshot
                      name: credit-2026-01
                    error:
                      code: Conflict
                      message: snapshot credit-2026-01 exists; a snapshot never changes and its name is never reused
                      param: name
                      hint: name the new table something else
    put:
      operationId: snapshots.put
      tags: [hosted]
      summary: hold a context by its digest, for a prediction to name instead of sending it
      description: |
        With an empty body, asks whether the service holds the snapshot of
        `digest`: 200 when it does, 404 when it does not, so nothing is sent
        twice. With an Arrow IPC stream body whose digest is `digest`, stores
        it and answers 201. A prediction then names it as
        `context: {"snapshot": "<digest>"}`.
      parameters:
        - $ref: "#/components/parameters/project"
        - name: digest
          in: query
          required: true
          schema: {$ref: "#/components/schemas/Digest"}
      requestBody:
        required: false
        content:
          application/vnd.apache.arrow.stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: the service holds it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldSnapshotReply"
              examples:
                held:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-5c0e8a4b2d6f8a0c1e3b5d7f9a1c3e5b
                    resource: {kind: snapshot, name: snapshots}
                    result: {digest: sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e, rows: 26048}
        "201":
          description: stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeldSnapshotReply"
        "404":
          description: the service does not hold it; send it with the same PUT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorReply"
              examples:
                absent:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-6d1f9b5c3e7a9b1d2f4c6e8a0b2d4f6c
                    resource: {kind: snapshot, name: snapshots}
                    error: {code: NotFound, message: no snapshot sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e}

  /v1/projects/{project}/snapshots/synthetic:
    post:
      operationId: snapshots.create_synthetic
      tags:
      - hosted
      summary: generate a batch of synthetic training tables
      description: |
        Generates `count` synthetic tables, each its own snapshot, from a
        causal-graph prior: random hidden nodes joined by random functions,
        with feature columns and a target read off the nodes. Table `i` is
        the snapshot `<name>-<i>`, counting from 0, so the batch
        `credit-warmup` of 64 tables is `credit-warmup-0` to
        `credit-warmup-63`. Every table carries the tags `synthetic` and
        `synthetic-<name>` besides the payload's `tags`, so
        `snapshots.list` with `tag=synthetic-credit-warmup` lists the batch
        and a run's `data` of `[{"tag": "synthetic-credit-warmup"}]` trains
        on every ready table of it.

        The reply comes at once, with every table `pending`, and a run can
        use the batch right away: a run naming its tag or its tables is
        created at once and starts training once the batch is done, on its
        ready tables (`Run.waiting`). Each table becomes `ready`, or
        `rejected` with its `error` when `reject` turned down every draw;
        `snapshots.synthetic` shows the batch's tables by state. A ready
        table is an ordinary snapshot:
        its target is `y`, its feature columns `x1` to `xN` with their
        `column_types`, and its `origin` records the seed and every option
        the table was drawn with (`SyntheticOrigin`).

        Every numeric option takes an exact value, as `"rows": 2048`, or a
        range, as `"rows": {"min": 1024, "max": 8192}`, drawn once per table
        from the table's seed. Table `i` draws from seed `seed + i`, so the
        same payload with the same `seed` makes the same tables.
        `schema_from` copies a ready snapshot's columns, their types, its
        task and its class count into every table.

        A batch's name is unique in the project, and each of its table
        names must be free: a name another snapshot ever had is refused
        with 409. The same create sent again, with the same name and the
        same payload, returns the batch; the same name with another payload
        is refused with 409. A batch holds at most 2,000,000 rows, `count`
        times the most rows a table may draw; a larger one, an option out
        of its bounds and an unknown field are refused with 422, `param`
        naming the field.
      parameters:
      - $ref: '#/components/parameters/project'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyntheticBatchCreateRequest'
            examples:
              create:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-3a7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                  resource:
                    kind: snapshot
                    name: credit-warmup
                  payload:
                    name: credit-warmup
                    count: 3
                    seed: 0
                    task: classification
                    rows: {min: 1024, max: 8192}
                    columns: 24
                    classes: 2
                    categorical:
                      share: {min: 0, max: 0.5}
                      max_categories: 50
                    functions: [linear, mlp, tree]
                    graph_nodes: {min: 2, max: 32}
                    irrelevant_columns: 0.1
                    correlated_columns:
                      share: {min: 0, max: 0.6}
                      groups: {min: 1, max: 4}
                      strength: {min: 0.2, max: 0.7}
                    coarsened_columns:
                      share: 0.2
                      levels: {min: 2, max: 8}
                    high_cardinality_columns: 1
                    missing:
                      rate: {min: 0, max: 0.1}
                      patterns: [random, by_target, censored]
                    target:
                      noise: {min: 0.01, max: 0.1}
                      label_noise: 0.02
                      imbalance: {min: 0, max: 0.8}
                    reject: [trivial, unlearnable]
                    tags: [stage:warmup]
              schema_from:
                summary: tables shaped like an uploaded snapshot
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-3b7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                  resource:
                    kind: snapshot
                    name: credit-shaped
                  payload:
                    name: credit-shaped
                    count: 2
                    schema_from: credit-2026-01
                    rows: 4096
              unknown_field:
                x-gf-invalid: true
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-3c7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                  resource:
                    kind: snapshot
                    name: credit-warmup
                  payload:
                    name: credit-warmup
                    task: classification
                    depth: 4
      responses:
        '202':
          description: the batch, with every table pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyntheticBatchCreatedReply'
              examples:
                create:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3a7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                    resource:
                      kind: snapshot
                      name: credit-warmup
                    result:
                      name: credit-warmup
                      tag: synthetic-credit-warmup
                      count: 3
                      snapshots: [credit-warmup-0, credit-warmup-1, credit-warmup-2]
                      state: pending
                      created: 1761200000.0
                      origin: {surface: cli, notebook: null, client: generalforecast/1.0.0, by: "maya@acme.com"}
                      url: "https://app.generalforecast.com/?project=acme#/fine-tunes"
                schema_from:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3b7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                    resource:
                      kind: snapshot
                      name: credit-shaped
                    result:
                      name: credit-shaped
                      tag: synthetic-credit-shaped
                      count: 2
                      snapshots: [credit-shaped-0, credit-shaped-1]
                      state: pending
                      created: 1761200000.0
                      origin: {surface: cli, notebook: null, client: generalforecast/1.0.0, by: "maya@acme.com"}
                      url: "https://app.generalforecast.com/?project=acme#/fine-tunes"
        '200':
          description: the same create sent again, answered with the batch it made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyntheticBatchCreatedReply'
        '402':
          description: the workspace's plan takes no resumable upload or synthetic batch (the Free plan), or its credits are used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorReply'
              examples:
                plan_required:
                  x-gf-hosted: true
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-0b2c1e9a2b4d6f8031a5c7e9b2d4f402
                    resource:
                      kind: snapshot
                      name: credit-warmup
                    error:
                      code: PaymentRequired
                      message: the Free plan takes tables of up to 100,000 rows and 32 MiB and does not include fine-tuning; upgrade to Pro to send larger tables and fine-tune models
                      reason: plan_required
        '409':
          description: the batch exists with another payload, or one of its table names is taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorReply'
              examples:
                taken:
                  x-gf-hosted: true
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3d7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                    resource:
                      kind: snapshot
                      name: credit-warmup
                    error:
                      code: Conflict
                      message: snapshot credit-warmup-0 exists; a batch's tables need names no snapshot ever had
                      param: name
                      hint: name the batch something else
        '422':
          description: an unknown field, an option out of its bounds, a batch of more than 2,000,000
            rows, a reserved tag, or options that disagree with `schema_from`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorReply'
              examples:
                unknown_field:
                  x-gf-hosted: true
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3c7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                    resource:
                      kind: snapshot
                      name: credit-warmup
                    error:
                      code: ValidationError
                      message: depth is not a synthetic batch option
                      param: depth
                too_many_rows:
                  x-gf-hosted: true
                  value:
