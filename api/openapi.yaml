  /v1/projects/{project}/predictors/{name}/environments/{environment}/logs:
    get:
      operationId: environments.logs
      tags: [hosted]
      summary: one page of an environment's log
      description: |
        What happened to the predictor in this environment: deploys, replicas
        starting and stopping, and each prediction with its request id, who
        called, its rows and how it ended. An entry names columns, models and
        environments and quotes a refusal's message and hint; it never holds a
        value from a row, a token or a whole key. A caller is named by a key's
        masked id, as `gf_...Jfwo`, or as `console session`.

        A page is oldest first. With neither cursor it is the newest `limit`
        entries. To tail, read once, then ask again with `after` set to the
        reply's `next`: a page of `limit` entries may have more behind it, and
        an empty one has nothing new. Predictions past a few a minute in one
        environment are counted into one `PredictionsSummarized` entry for
        the minute. Entries are kept 30 days, the newest 2,000 events and
        5,000 predictions of a predictor.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/predictor"
        - $ref: "#/components/parameters/environment"
        - name: limit
          in: query
          required: false
          description: the most entries in the page
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: after
          in: query
          required: false
          description: a cursor; the oldest `limit` entries newer than it
          schema: {$ref: "#/components/schemas/LogCursor"}
        - name: before
          in: query
          required: false
          description: a cursor; the newest `limit` entries older than it. Not with `after`.
          schema: {$ref: "#/components/schemas/LogCursor"}
        - name: level
          in: query
          required: false
          description: the least level kept
          schema: {$ref: "#/components/schemas/LogLevel"}
        - name: q
          in: query
          required: false
          description: |
            a substring, in any case, of an entry's code, message, source,
            request id or field values
          schema: {type: string, minLength: 1, maxLength: 128}
        - name: since
          in: query
          required: false
          description: only entries at or after this time, as epoch seconds or RFC 3339
          schema: {type: string, example: "2026-11-18T20:00:00Z"}
        - name: until
          in: query
          required: false
          description: only entries at or before this time, as epoch seconds or RFC 3339
          schema: {type: string, example: "2026-11-18T21:00:00Z"}
      responses:
        "200":
          description: the page, oldest first, with a cursor each way
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsReply"
              examples:
                shown:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-08192a3b4c5d6e7f8091a2b3c4d5e6f7
                    resource: {kind: predictor, name: churn}
                    result:
                      logs:
                        - id: "1795034467412000"
                          at: 1795034467.412
                          level: info
                          source: deploy
                          code: Promoted
                          message: Deployed churn revision 2 to staging in 7.8s
                          environment: staging
                          revision: 2
                          request_id: r-3abb2401f119428db148927c6a0d358c
                          fields: {model: general-forecast/tabicl-v2-classifier, generation: 3}
                        - id: "1795034671207000"
                          at: 1795034671.207
                          level: warn
                          source: replica a1f
                          code: PredictionFailed
                          message: "predict 422 ValidationError: unknown column `Tenure`"
                          environment: staging
                          revision: 2
                          request_id: r-7d10c2e4b6d84f0a9c4e6f8a0b2d4f6a
                          fields: {key: gf_...Jfwo, rows: 1, status: 422, latency_ms: 3.1, error: ValidationError, help: "did you mean `tenure`?"}
                      next: "1795034671207000"
                      previous: null

  /v1/projects/{project}/predictors/{name}/environments/{environment}/logs/histogram:
    get:
      operationId: environments.logs.histogram
      tags: [hosted]
      summary: an environment's log entries counted over a time range, by level
      description: |
        The range ends at `until`, now when left out, and starts at `since`,
        an hour before when left out. It is cut into `buckets` equal
        stretches; every one is listed, oldest first, with how many entries
        of each level it holds.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/predictor"
        - $ref: "#/components/parameters/environment"
        - name: since
          in: query
          required: false
          description: where the range starts, as epoch seconds or RFC 3339
          schema: {type: string, example: "2026-11-18T20:00:00Z"}
        - name: until
          in: query
          required: false
          description: where the range ends, as epoch seconds or RFC 3339
          schema: {type: string, example: "2026-11-18T21:00:00Z"}
        - name: buckets
