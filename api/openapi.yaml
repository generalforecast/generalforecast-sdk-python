openapi: 3.1.0
info:
  title: General Forecast API
  version: gf/v1
  summary: score rows with a predictor, declared in gf.yaml or sent ad hoc
  description: |
    Every request and reply carries the same envelope: `api_version`,
    `project`, `request_id`, `resource` and either `payload` (request),
    `result` (success) or `error` (failure). Four words name the data on
    every route: `context` (rows the model learns from), `queries` (rows to
    score), `inputs` (columns the model may read) and `target` (the column to
    predict). Model ids are always `general-forecast/<name>`; a bare name is
    refused with a hint naming the canonical id.

    Routes under `/v1` outside a project, such as `/v1/projects`,
    `/v1/workspaces` and `/v1/auth/status`, still name the client's project:
    in the envelope, and in an `X-GF-Project` header that must match it. Two
    hosted routes sit outside the envelope as health does: the CLI login,
    `x-gf-envelope: false`, and the Arrow upload `POST /snapshots`, whose
    body is a stream and whose reply is enveloped.

    `api/generate.py` emits `src/generalforecast/_api.py` and
    `clients/typescript/src/types.ts` from this file. A request example
    marked `x-gf-invalid: true` is one the schema itself refuses; its reply
    example of the same name shows the error. A reply example marked
    `x-gf-hosted: true` is one only the hosted service gives, such as a
    fine-tune's.
servers:
  - url: https://app.generalforecast.com
    description: hosted
security:
  - apiKey: []
tags:
  - name: predictors
    description: declared predictors, and the ad hoc predictor
  - name: models
    description: the catalog this server can run, with its limits
  - name: health
    description: process readiness, outside the envelope
  - name: hosted
    description: the hosted control plane the CLI `admin` group and the SDK call

paths:
  /v1/projects/{project}/predictors/{name}/predict:
    post:
      operationId: predictors.predict
      tags: [predictors]
      summary: score queries with a declared predictor
      description: |
        The predictor's manifest supplies the model, target, inputs and
        context. The payload carries only `queries`, and `context` when the
        manifest declares `context: {request: ...}`; otherwise `context` is
        refused with `param: "context"` and the message `context is declared
        by the predictor`. `target`, `inputs`, `model` and `task` are refused
        with `param` naming the field and the message `declared by the
        predictor`.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/predictor"
        - $ref: "#/components/parameters/prefer"
        - name: env
          in: query
          required: false
          description: |
            the environment whose revision scores the queries; `production` when
            left out.
          schema: {type: string, pattern: "^[a-z][a-z0-9-]{0,62}$", default: production}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueriesRequest"
            examples:
              scored:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-3abb2401f119428db148927c6a0d358c
                  resource: {kind: predictor, name: churn}
                  payload:
                    queries:
                      - {customer_id: 1041, spend: 82.5, plan: pro}
                      - {customer_id: 1042, spend: 12.0, plan: free}
              declared:
                x-gf-invalid: true
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-8f1b2c3d4e5f60718293a4b5c6d7e8f9
                  resource: {kind: predictor, name: churn}
                  payload:
                    target: churned
                    queries:
                      - {customer_id: 1041, spend: 82.5, plan: pro}
              context:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-0c1d2e3f405162738495a6b7c8d9e0f1
                  resource: {kind: predictor, name: churn}
                  payload:
                    context:
                      - {customer_id: 7, spend: 10.0, plan: free, churned: 1}
                    queries:
                      - {customer_id: 1041, spend: 82.5, plan: pro}
              missing:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-5a6b7c8d9e0f1a2b3c4d5e6f708192a3
                  resource: {kind: predictor, name: nothing}
                  payload:
                    queries:
                      - {customer_id: 1041, spend: 82.5, plan: pro}
      responses:
        "200":
          description: one prediction per query, in query order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultReply"
              examples:
                scored:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3abb2401f119428db148927c6a0d358c
                    resource: {kind: predictor, name: churn}
                    result:
                      model: general-forecast/tabicl-v2-classifier@sha256:7a01c2e4b6d8f0a2c4e6f8a0b2d4f6a8c0e2f4a6b8d0f2a4c6e8f0a2b4d6f8a0
                      task: classification
                      context: {source: snapshot, name: null, version: null, digest: sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e, rows: 1840, as_of: null}
                      revision: 7
                      environment: production
                      predictions:
                        - {id: 1041, label: 0, probabilities: {"0": 0.91, "1": 0.09}}
                        - {id: 1042, label: 1, probabilities: {"0": 0.22, "1": 0.78}}
        "404":
          description: no predictor of that name in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorReply"
              examples:
                missing:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-5a6b7c8d9e0f1a2b3c4d5e6f708192a3
                    resource: {kind: predictor, name: nothing}
                    error:
                      code: NotFound
                      message: predictor nothing is not in project acme
                      param: name
                      hint: list predictors with `gf status`
        "422":
          description: the payload names something the predictor declares
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorReply"
              examples:
                declared:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-8f1b2c3d4e5f60718293a4b5c6d7e8f9
                    resource: {kind: predictor, name: churn}
                    error:
                      code: ValidationError
                      message: declared by the predictor
                      param: target
                      hint: remove `target` from the payload; churn predicts `churned`
                context:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-0c1d2e3f405162738495a6b7c8d9e0f1
                    resource: {kind: predictor, name: churn}
                    error:
                      code: ValidationError
                      message: context is declared by the predictor
                      param: context
                      hint: churn reads its context from the snapshot context.csv
        "202":
          $ref: "#/components/responses/Accepted"
        "503":
          $ref: "#/components/responses/NotReady"

  /v1/projects/{project}/predict:
    post:
      operationId: predict
      tags: [predictors]
      summary: score queries with an ad hoc predictor
      description: |
        The payload is a manifest fragment plus rows: `model`, `target`,
        `context` and `queries` are required; `inputs`, `id`, `time`,
        `series`, `frequency`, `horizon`, `quantiles`, `outputs` and
        `selection` take the manifest's names and defaults. There is no `task`
        (the model determines it) and no `options` object. The rows bind as a
        request context's do, so text and category inputs are read as the
        model reads them in process, and a forecaster's `inputs` may split
        into `past` and `future`. Every limit error carries `limit` and
        `actual` and names the model in `message`.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/prefer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManifestRequest"
            examples:
              scored:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-1f2e3d4c5b6a79880716253443526170
                  resource: {kind: predictor, name: ad-hoc}
                  payload:
                    model: general-forecast/tabicl-v2-classifier
                    target: churned
                    id: customer_id
                    inputs: [spend, plan]
                    context:
                      - {customer_id: 1, spend: 10.0, plan: free, churned: 1}
                      - {customer_id: 2, spend: 95.0, plan: pro, churned: 0}
                      - {customer_id: 3, spend: 40.0, plan: pro, churned: 0}
                      - {customer_id: 4, spend: 5.0, plan: free, churned: 1}
                    queries:
                      - {customer_id: 1041, spend: 82.5, plan: pro}
              forecast:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-2a3b4c5d6e7f8091a2b3c4d5e6f70819
                  resource: {kind: predictor, name: ad-hoc}
                  payload:
                    model: general-forecast/chronos-2
                    target: units
                    time: date
                    series: [sku]
                    frequency: 1d
                    horizon: 2
                    quantiles: [0.1, 0.5, 0.9]
                    inputs: {past: [], future: [price]}
                    context:
                      - {sku: a, date: "2026-01-01", price: 9.5, units: 12}
                      - {sku: a, date: "2026-01-02", price: 9.5, units: 14}
                      - {sku: a, date: "2026-01-03", price: 9.0, units: 15}
                      - {sku: a, date: "2026-01-04", price: 9.0, units: 17}
                    queries:
                      - {sku: a, date: "2026-01-05", price: 8.5}
                      - {sku: a, date: "2026-01-06", price: 8.5}
              bare:
                x-gf-invalid: true
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-3c4d5e6f708192a3b4c5d6e7f8091a2b
                  resource: {kind: predictor, name: ad-hoc}
                  payload:
                    model: tabicl-v2-classifier
                    target: churned
                    context:
                      - {spend: 10.0, churned: 1}
                      - {spend: 95.0, churned: 0}
                    queries:
                      - {spend: 82.5}
      responses:
        "200":
          description: one prediction per query, in query order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultReply"
              examples:
                scored:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-1f2e3d4c5b6a79880716253443526170
                    resource: {kind: predictor, name: ad-hoc}
                    result:
                      model: general-forecast/tabicl-v2-classifier@sha256:7a01c2e4b6d8f0a2c4e6f8a0b2d4f6a8c0e2f4a6b8d0f2a4c6e8f0a2b4d6f8a0
                      task: classification
                      context: {source: request, name: null, version: null, digest: null, rows: 4, as_of: null}
                      predictions:
                        - {id: 1041, label: 0, probabilities: {"0": 0.83, "1": 0.17}}
                forecast:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-2a3b4c5d6e7f8091a2b3c4d5e6f70819
                    resource: {kind: predictor, name: ad-hoc}
                    result:
                      model: general-forecast/chronos-2@sha256:0b1c2d3e4f5061728394a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d7e8f90
                      task: forecast
                      context: {source: request, name: null, version: null, digest: null, rows: 4, as_of: null}
                      predictions:
                        - {value: 18.2, quantiles: {"0.1": 16.1, "0.5": 18.2, "0.9": 20.4}}
                        - {value: 19.0, quantiles: {"0.1": 16.0, "0.5": 19.0, "0.9": 22.1}}
        "422":
          description: the manifest fragment or the rows are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorReply"
              examples:
                bare:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3c4d5e6f708192a3b4c5d6e7f8091a2b
                    resource: {kind: predictor, name: ad-hoc}
                    error:
                      code: ValidationError
                      message: model tabicl-v2-classifier is not a catalog id
                      param: model
                      hint: use general-forecast/tabicl-v2-classifier
                capacity:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-6e7f8091a2b3c4d5e6f708192a3b4c5d
                    resource: {kind: predictor, name: ad-hoc}
                    error:
                      code: CapacityExceeded
                      message: queries exceed the limit for general-forecast/tabicl-v2-classifier
                      param: queries
                      hint: split the queries, or push a predictor and call it in batches
                      limit: 100
                      actual: 1000
        "202":
          $ref: "#/components/responses/Accepted"
        "503":
          $ref: "#/components/responses/NotReady"

  /v1/projects/{project}/predictions/{id}:
    get:
      operationId: predictions.get
      tags: [hosted]
      summary: poll a prediction the hosted plane accepted
      description: |
        A prediction sent with `Prefer: respond-async` that the hosted plane
        could not answer in time was accepted with `202` and this route as
        its `Location`. While it is still starting or running, the reply is
        `202` with the accept's envelope, its current `state`, a
        `Retry-After` and the `Location` again. Once it has its answer, the
        reply is that answer exactly, as the prediction itself would have
        been answered: its status, body and `Retry-After`, a `200` with the
        predictions or the error. It takes the permission predicting does,
        in the project the prediction was made in; an id that is unknown,
        from another project, or expired (answers are kept an hour) is
        `404`.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/prediction"
      responses:
        "200":
          description: the prediction's answer, one prediction per query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultReply"
              examples:
                done:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-3abb2401f119428db148927c6a0d358c
                    resource: {kind: predictor, name: churn}
                    result:
                      model: general-forecast/tabicl-v2-classifier@sha256:7a01c2e4b6d8f0a2c4e6f8a0b2d4f6a8c0e2f4a6b8d0f2a4c6e8f0a2b4d6f8a0
                      task: classification
                      context: {source: snapshot, name: null, version: null, digest: sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e, rows: 1840, as_of: null}
                      revision: 7
                      environment: production
                      predictions:
                        - {id: 1041, label: 0, probabilities: {"0": 0.91, "1": 0.09}}
                        - {id: 1042, label: 1, probabilities: {"0": 0.22, "1": 0.78}}
        "202":
          $ref: "#/components/responses/Accepted"
        "404":
          description: no such prediction in the project, or its answer expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorReply"
              examples:
                missing:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c
                    resource: {kind: prediction, name: pred-0123456789abcdef01234567}
                    error:
                      code: NotFound
                      message: prediction pred-0123456789abcdef01234567 is not in project acme

  /v1/projects/{project}/predictors:
    get:
      operationId: predictors.list
      tags: [predictors]
      summary: list the project's predictors
      parameters:
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          description: every predictor this server or project knows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictorListReply"
              examples:
                listed:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-7f8091a2b3c4d5e6f708192a3b4c5d6e
                    resource: {kind: predictor, name: predictors}
                    result:
                      predictors:
                        - name: churn
                          model: general-forecast/tabicl-v2-classifier
                          model_digest: sha256:7a01c2e4b6d8f0a2c4e6f8a0b2d4f6a8c0e2f4a6b8d0f2a4c6e8f0a2b4d6f8a0
                          task: classification
                          target: churned
                          target_type: "0/1"
                          classes: [0, 1]
                          id: customer_id
                          lock_digest: sha256:761724ce8080b6f6e1a2257adaff9c5b3f2434127f2b27b6d13ac3cf4c86777c
                          inputs:
                            - {name: spend, type: float, role: input}
                            - {name: plan, type: category, role: input}
                            - {name: signups, type: int, role: input}
                          context: {kind: snapshot, rows: 1840, query_rows: 212, digest: sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e}
                          selection: {strategy: retrieved, core: 1000, neighbors: 3000, kind: stratified, recent: null, seed: 0}
                          limits: {context_rows: 100000, queries: 100, inputs: 32}
                          environments:
                            - {predictor: churn, name: production, revision: 7, generation: 9, status: ready}
                          serving: {loaded: true, compiled: true, warm_shapes: [{context_rows: 4096, queries: 128, inputs: 3, classes: 2}]}

    post:
      operationId: predictors.create
      tags: [hosted]
      summary: create a predictor's name, before any revision
      description: |
        Idempotent: creating a name that exists answers as the first create did,
        and makes no revision and readies no environment. A deleted predictor's
        name is not made again.
      parameters:
        - $ref: "#/components/parameters/project"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PredictorCreateRequest"
            examples:
              created:
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-9b92cd2a0bbf3740455d8b5c8e7c06b8
                  resource: {kind: predictor, name: churn}
                  payload: {name: churn}
      responses:
        "200":
          description: the predictor's name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictorCreatedReply"
              examples:
                created:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-9b92cd2a0bbf3740455d8b5c8e7c06b8
                    resource: {kind: predictor, name: churn}
                    result: {name: churn}
  /v1/projects/{project}/predictors/{name}:
    get:
      operationId: predictors.get
      tags: [predictors]
      summary: show a predictor's resolved manifest, lock digests, context, environments and serving facts
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/predictor"
      responses:
        "200":
          description: the resolution gf check prints, plus what is serving it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictorReply"
              examples:
                shown:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-8091a2b3c4d5e6f708192a3b4c5d6e7f
                    resource: {kind: predictor, name: churn}
                    result:
                      name: churn
                      model: general-forecast/tabicl-v2-classifier
                      model_digest: sha256:7a01c2e4b6d8f0a2c4e6f8a0b2d4f6a8c0e2f4a6b8d0f2a4c6e8f0a2b4d6f8a0
                      task: classification
                      target: churned
                      target_type: "0/1"
                      classes: [0, 1]
                      id: customer_id
                      lock_digest: sha256:761724ce8080b6f6e1a2257adaff9c5b3f2434127f2b27b6d13ac3cf4c86777c
                      inputs:
                        - {name: spend, type: float, role: input}
                        - {name: plan, type: category, role: input}
                        - {name: signups, type: int, role: input}
                      context: {kind: snapshot, rows: 1840, query_rows: 212, digest: sha256:5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b5fb6a4c6f24bd5fb3623f97e}
                      selection: {strategy: retrieved, core: 1000, neighbors: 3000, kind: stratified, recent: null, seed: 0}
                      limits: {context_rows: 100000, queries: 100, inputs: 32}
                      environments:
                        - {predictor: churn, name: staging, revision: 8, generation: 3, status: ready}
                        - {predictor: churn, name: production, revision: 7, generation: 9, status: ready}
                      serving: {loaded: true, compiled: true, warm_shapes: [{context_rows: 4096, queries: 128, inputs: 3, classes: 2}]}
        "404":
          description: no predictor of that name in the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorReply"
              examples:
                missing:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-91a2b3c4d5e6f708192a3b4c5d6e7f80
                    resource: {kind: predictor, name: nothing}
                    error:
                      code: NotFound
                      message: predictor nothing is not in project acme
                      param: name
                      hint: list predictors with `gf status`

  /v1/projects/{project}/models:
    get:
      operationId: models.list
      tags: [models]
      summary: list the catalog with per-model limits
      parameters:
        - $ref: "#/components/parameters/project"
      responses:
        "200":
          description: the models this server can run and what each accepts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListReply"
              examples:
                listed:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-a2b3c4d5e6f708192a3b4c5d6e7f8091
                    resource: {kind: model, name: models}
                    result:
                      models:
                        - model: general-forecast/tabicl-v2-classifier@sha256:7a01c2e4b6d8f0a2c4e6f8a0b2d4f6a8c0e2f4a6b8d0f2a4c6e8f0a2b4d6f8a0
                          name: general-forecast/tabicl-v2-classifier
                          task: classification
                          repository: general-forecast/tabicl-v2-classifier
                          revision: 5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b
                          license: BSD-3-Clause
                          runtime: cpu
                          artifact:
                            repository: general-forecast/tabicl-v2-classifier
                            revision: 5fb6a4c6f24bd5fb3623f97e3c62186e12e28e5b
                            digest: sha256:7a01c2e4b6d8f0a2c4e6f8a0b2d4f6a8c0e2f4a6b8d0f2a4c6e8f0a2b4d6f8a0
                            license: BSD-3-Clause
                            digest_format: sha256-of-sorted-compact-json-file-sha256-map
                            files: {LICENSE: 4f90c5fa25a2b7883d6235c7f0b11f942a37859b9f89ac36157cc485329913b4, config.json: 7ec2941cc537535e1bd8f37d33fc97cea97953343d69d765a261ee6a1605d937, model.safetensors: 58f5fc1f276744f721974079c19d2f67efacc39083c54483fe3feba52297d253}
                          artifact_verification: required-before-load
                          bounds: {context_rows: 100000, query_rows: 100, features: 32, classes: 10, quantile_step: null, codes: 8, estimators: 8, members: 16}
                          capabilities:
                            - {name: classification, state: supported}
                            - {name: hosted-predictor, state: supported}
                            - {name: request-context, state: supported}
                          limits: {context_rows: 100000, queries: 100, inputs: 32}
                          warm_shapes: [{context_rows: 4096, queries: 128, inputs: 3, classes: 2}]

  /v1/projects/{project}/models/{model}:
    get:
      operationId: models.get
      tags: [models]
      summary: show a catalog model, or one of the project's fine-tunes with its versions
      description: |
        `{model}` is one of three things. A catalog model's name, such as
        `tabicl-v2-classifier`, reads that model. A fine-tune's version, such
        as `credit-default@ft3`, reads that version as the list shows it,
        with `derived`. A fine-tune's name alone, such as `credit-default`,
        reads its latest version the same way, plus `versions`: every
        version the project has published under the name, newest first,
        each by its id and its weights' digest, with the step it kept. The
        run that made a version has the version's id as its `model`, so
        `runs.get` reads it by that id.

        A run publishes the next version of the fine-tune it names, and no
        fine-tune may take a catalog model's name, so a name is one or the
        other.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/model"
      responses:
        "200":
          description: |
            the model, as the list shows it; for a fine-tune named without a
            version, its latest version and `versions`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelReply"
