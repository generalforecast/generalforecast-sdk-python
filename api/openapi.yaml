  /v1/projects/{project}/snapshots:
    get:
      operationId: snapshots.list
      tags:
      - hosted
      summary: list the project's snapshots
      description: Every snapshot that is not deleted, oldest first; `tag` lists only the snapshots
        carrying it. A deleted snapshot is still read by its name, and its name stays taken.
      parameters:
      - $ref: '#/components/parameters/project'
      - name: tag
        in: query
        required: false
        description: list only the snapshots carrying this tag
        schema:
          $ref: '#/components/schemas/RunTag'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotListReply'
              examples:
                list:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-1a7c1e9a2b4d6f8031a5c7e9b2d4f6a8
                    resource:
                      kind: snapshot
                      name: snapshots
                    result:
                      snapshots:
                      - name: credit-2026-01
                        state: ready
                        digest: sha256:a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1
                        bytes: 52428800
                        rows: 500000
                        columns:
                        - name: income
                          type: double
                        - name: defaulted
                          type: int64
                        metadata:
                          target: defaulted
                          task: classification
                          origin:
                            kind: uploaded
                        tags: [credit, stage:signal, uploaded]
                        error: null
                        expires: null
                        created: 1761200000.0
                      - name: churn-history-2026-01
                        state: ready
                        digest: sha256:b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2
                        bytes: 73416
                        rows: 1840
                        columns:
                        - name: spend
                          type: double
                        - name: churned
                          type: bool
                        metadata:
                          target: churned
                          task: classification
                          origin:
                            kind: context
                            context: churn-history
                            as_of: "2026-01-01T00:00:00Z"
                        tags: [uploaded]
                        error: null
                        expires: null
                        created: 1761200100.0
    post:
      operationId: snapshots.create
      tags:
      - hosted
      summary: create a named snapshot, by a resumable Parquet upload or an Arrow stream
      description: |
        A snapshot is an immutable table, named in its project: training
        runs read it by name, and predictor revisions and context imports
        by digest. A name is never reused, even once its snapshot is
        deleted; the same name with the same content returns the snapshot,
        and with other content is refused with 409. `tags` label it for
        `snapshots.list` to find by `tag`; `snapshots.update` replaces them
        later. An Arrow stream's snapshot starts without tags of its own.
        Every snapshot of real data, uploaded, streamed or made from a live
        context, also carries the reserved tag `uploaded`, which the service
        adds; `uploaded`, `synthetic` and any
        tag starting `synthetic-` are refused in `tags` with 422.

        A JSON payload opens a resumable upload of a Parquet table of up to
        8 GiB, with its size and training metadata. `url` is a resumable
        session to `PUT` the bytes to, in `chunk_bytes` chunks with
        `Content-Range`. Once every declared byte is stored, the plane
        verifies the upload on its own: it reads the Parquet footer, checks
        the named columns exist and hashes the rows, and the snapshot
        becomes `ready`, or `rejected` with an `error`. An upload left open
        for a day expires.

        An Arrow IPC stream body is a table of at most 100,000 rows and
        32 MiB, `ready` at once. It is not an envelope, so the request id
        and project ride in headers, and the query names the snapshot and,
        optionally, its training metadata. The digest is of the normalized
        table, so a client can check it against its own. `gf push` names
        its snapshot `<predictor>-<first 12 hex digits of the digest>`.
      parameters:
      - $ref: '#/components/parameters/project'
      - name: name
        in: query
        required: false
        description: an Arrow stream's snapshot name, which an Arrow stream must send
        schema:
          $ref: '#/components/schemas/Name'
      - name: target
        in: query
        required: false
        description: an Arrow stream's target column, sent with `task`
        schema:
          type: string
      - name: task
        in: query
        required: false
