    ModelListReply:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [result]
          properties:
            result: {$ref: "#/components/schemas/ModelList"}

    Health:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: {type: string, const: ok}
        build:
          $ref: "#/components/schemas/Build"
          description: |
            the code a hosted plane runs, on its 200 from `/readyz`; `/livez`
            leaves it out

    Build:
      type: object
      required: [commit, version, gf_commit, gf_version]
      additionalProperties: false
