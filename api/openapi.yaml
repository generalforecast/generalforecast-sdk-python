    SourcePreviewed:
      type: object
      description: |
        a table's or a query's first 20 rows. `table` or `sql` is what was
        read and `location` where; `type` is the source's kind of table
        (`QUERY` for a query) and `readable` whether its rows can be read
        and imported, `sample` empty when not. `rows` and `bytes` are what
        the source says before reading, null where it says nothing.
        `columns` name each column's type as the source names it; each
        sample cell is text, cut to 256 characters, or null
      required: [source, table, sql, location, type, readable, rows, bytes, columns, sample]
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/Name"
        table: {type: [string, "null"]}
        sql: {type: [string, "null"]}
        location: {type: string}
        type: {type: string}
        readable: {type: boolean}
        rows: {type: [integer, "null"], minimum: 0}
        bytes: {type: [integer, "null"], minimum: 0}
        columns:
          type: array
          items:
            $ref: "#/components/schemas/SourceColumn"
        sample:
          type: array
          maxItems: 20
          items:
            type: array
            items: {type: [string, "null"]}

    SourceColumn:
      type: object
      required: [name, type, mode]
      additionalProperties: false
      properties:
        name: {type: string}
        type: {type: string}
        mode: {type: string, enum: [NULLABLE, REQUIRED, REPEATED]}

