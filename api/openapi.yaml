      tags: [hosted]
      summary: "send a chunk of a snapshot's upload, when it has no signed URL"
      description: |
        A plane without object storage opens an upload with `url: null` and
        takes its chunks here, in order, each with `Content-Range: bytes
        <first>-<last>/<total>`, where `total` is the upload's declared
        `bytes`. The reply says how many bytes the plane holds; once it
        holds them all, it verifies the upload as it does one sent to a
        signed URL.
      parameters:
      - $ref: "#/components/parameters/project"
      - $ref: "#/components/parameters/snapshot"
      - name: Content-Range
        in: header
        required: true
        schema: {type: string, pattern: "^bytes \\d+-\\d+/\\d+$"}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: the bytes held so far
          content:
