  /v1/projects/{project}/models/{model}:
    get:
      operationId: models.get
      tags: [models]
      summary: show a catalog model, or one of the project's fine-tunes with its versions
      description: |
        `{model}` is one of three things. A catalog model's short name, such
        as `tabicl-v2` (with `task` when the family has more than one), or its
        name, such as `tabicl-v2-classifier`, reads that model. A fine-tune's version, such
        as `credit-default@ft3`, reads that version as the list shows it,
        with `derived`. A fine-tune's name alone, such as `credit-default`,
        reads its latest version the same way, plus `versions`: every
        version the project has published under the name, newest first,
        each by its id and its weights' digest, with the step it kept. The
        run that made a version has the version's id as its `model`, so
        `runs.get` reads it by that id.

        A run publishes the next version of the fine-tune it names, and no
        fine-tune may take a catalog model's name, so a name is one or the
        other.
      parameters:
        - $ref: "#/components/parameters/project"
        - $ref: "#/components/parameters/model"
        - name: task
          in: query
          required: false
          description: the task a short name resolves for, and the models listed
          schema: {$ref: "#/components/schemas/Task"}
      responses:
        "200":
          description: |
            the model, as the list shows it; for a fine-tune named without a
            version, its latest version and `versions`
