            application/json:
              schema:
                $ref: "#/components/schemas/ModelReply"
              examples:
                shown:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-b3c4d5e6f708192a3b4c5d6e7f8091a2
                    resource: {kind: model, name: tabicl-v2-classifier}
