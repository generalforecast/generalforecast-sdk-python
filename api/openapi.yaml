        description: list only the runs in this state; every run when left out
        schema:
          $ref: '#/components/schemas/RunState'
      - name: data_digest
        in: query
        required: false
        description: list only the runs over the data with this digest, the runs' `data_digest`
        schema:
          $ref: '#/components/schemas/Digest'
      - name: tag
        in: query
        required: false
        description: list only the runs carrying this tag
        schema:
          $ref: '#/components/schemas/RunTag'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunListReply'
              examples:
                list:
                  value:
                    api_version: gf/v1
                    project: acme
                    request_id: r-057c1e9a2b4d6f8031a5c7e9b2d4f6a8
                    resource:
                      kind: run
                      name: runs
                    result:
                      runs:
                      - model: acme/credit-default@ft1
                        name: credit-default
                        version: 1
                        state: queued
                        reason: null
                        attempt: 0
                        base: general-forecast/tabicl-v2-classifier
                        data:
                        - name: credit-2026-01
                          digest: sha256:a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1
                        data_digest: sha256:c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3
                        method:
                          type: lora
                          rank: 16
                          input_adapter: false
                        evaluation:
                          holdout: 0.2
                          context_rows: null
                          contexts: 3
                          early_stopping_threshold:
                            standard_errors: 2.0
                          report_share: 0.5
                        budget: null
                        seed: 0
                        tags: []
                        plan:
                          steps: 200
                        progress: null
                        created: 1761200000.0
                        updated: 1761200000.0
                        published: null
    post:
      operationId: runs.create
      tags:
      - hosted
      summary: create a fine-tuning run
      description: |
        Starts a run that publishes the next version of the fine-tune
        `name`: the first run of a name publishes `<project>/<name>@ft1`,
        the next `@ft2`. The run's `model` is that version's id,
        `<project>/<name>@ft<version>`, from the start. Every
        `/runs/{run}` route takes it without the project, which the path
        already names: `credit-default@ft2` for that run, or the name alone
        for the name's latest run.

        `data` names ready snapshots of the base's task; the run pins each
        to its digest, and holds them until it ends. An item may be
        `{"tag": "<tag>"}` in place of a name, in `data` or a phase's
        `data`: the run takes every ready snapshot carrying the tag, sorted
        by name, as a synthetic batch's `synthetic-<name>` tag takes its
        tables, and refuses with 422 a tag no ready or generating snapshot carries. The run
        keeps the names and digests it found, so tagging snapshots later
        changes nothing it trains on.

        A run may name a synthetic batch that is still generating, by its
        tag or by its tables' names: it is created at once, stays `queued`
        with `waiting` naming the batches and how many of their tables are
        still pending, and starts training once every batch is done, on
        the batches' ready tables (rejected ones left out). If a batch ends
        with no ready table, or is deleted, the run fails with reason
        `data`. Each snapshot is its
        own table with its own encoding and holdout, never pooled with
        another, and an episode draws from one table. `method` says how the
        network changes, and `plan` how it trains (`RunPlan`): a run is
        created with its plan and starts training once it is set up.

        `phases` in place of `data` makes a curriculum run: up to 16 phases
        that train in order, each on its own snapshots with its own steps,
        episode sampling and episodes per step (`RunPhase`); `phases` beside
        `data` is refused with 422. The run's `plan` is then optional and
        holds the settings that span the whole run (`RunCurriculumPlan`):
        one optimizer and one learning-rate schedule run over the phases'
        steps together, and the trained weights and the optimizer's moments
        carry from one phase into the next. Rows are held out only from the
        last phase's snapshots, and only the last phase checks steps and
        keeps one; no step of an earlier phase is ever published. The run
        keeps `phases` with each snapshot pinned, and its `data` lists every
        phase's snapshots with the `phase` that reads each.

        `architecture` changes parts of the base before it trains: a list
        of changes (`RunArchitectureChange`), each a standard component
        kind, the stages it applies in (every stage that can take it when
        left out), the option it becomes and how its new parameters start,
        at most one per component and stage. The kinds and options are the
        same for every model; the base's catalog view lists them under
        `architecture`, with its stages and what it cannot take. Every
        change's new parameters train whatever the method, at the plan's
        learning rate. Such a run skips the step-0 parity check: from its
        creation its `warnings` hold `uncalibrated_architecture`, with the
        base's loss and the changed model's loss on the evaluation rows once
        step 0 measures them, and a step is still kept only when it beats
        the base. The run's `architecture` holds the changes resolved, every
        setting and init setting filled in, and the version it publishes
        records them (`DerivedModel.architecture`) and serves the changed
        model.

        `base` is always sent. Every version of a fine-tune trains afresh
        from one catalog model, so a base other than the one the name's
        versions were trained from is refused with 409 `base_mismatch`, and
        a fine-tune as `base` with 422 `base_is_fine_tune`. A new run while
        another run of the name is still queued or running is refused with
        409 `run_active`. A name that is a catalog model's is refused with
        422.

        A create sent again with the same request id, as the SDK sends a
        retry, returns the run the first one made rather than start
        another; the same request id with another payload is refused with
        409. `evaluation` says how the run holds out rows and keeps a step
        (`RunEvaluation`): a step is kept only when its gain over the base
        on the select rows is significant, and the published version
        reports the kept step against the base on the report rows. A run
        that finds no significant step publishes the base itself, kept at
        step 0.
