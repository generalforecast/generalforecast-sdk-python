  /v1/device-logins:
    post:
      operationId: device.start
      tags: [hosted]
      x-gf-envelope: false
      security: []
      summary: start a device login for the CLI or a notebook, to approve in a signed-in browser
      description: |
        The device flow of RFC 8628, outside the envelope: no credential, no
        project. The user opens `verification_uri_complete`, signs in and
        approves the code, while the client polls `/v1/device-logins/token`
        every `interval` seconds with `device_code`, the only credential the
        login has. `client: cli` mints a 90-day key named `cli-<machine>`;
        `client: notebook` a key that expires in 12 hours, `ephemeral`, named
        `notebook-<machine>`, which `GET /keys` lists only with
        `?ephemeral=true` and the plane deletes 7 days after it expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLoginStart"
            examples:
              login:
                value: {machine: maya-mbp, client: notebook}
      responses:
        "200":
          description: the next step of the login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginGrant"
              examples:
                login:
                  value:
                    device_code: gf_dc_0123456789abcdefghijklmnopqrstuvwxyzABCDEFG
                    user_code: WDJB-MJHT
                    verification_uri: https://app.generalforecast.com/device
                    verification_uri_complete: https://app.generalforecast.com/device?code=WDJB-MJHT
                    expires_in: 600
                    interval: 5
        "429":
          description: "too many logins are pending; try again shortly"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginErrorReply"

  /v1/device-logins/token:
    post:
      operationId: device.token
      tags: [hosted]
      x-gf-envelope: false
      security: []
      summary: redeem an approved device login for an API key, once
      description: |
        Until the browser decides, a poll answers 400 with the reason
        `authorization_pending`, or `slow_down` when it comes sooner than
        `interval` allows, which then grows by 5 seconds. A denied login answers
        403 with `access_denied`, and an expired or redeemed code 400 with
        `expired_token`. An approved one answers once with the key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLoginPoll"
            examples:
              login:
                value: {device_code: gf_dc_0123456789abcdefghijklmnopqrstuvwxyzABCDEFG}
      responses:
        "200":
          description: the next step of the login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLoginToken"
              examples:
                login:
                  value:
                    access_token: gf_0123456789abcdefghijklmnopqrstuvwxyzABCDEFG
                    token_type: bearer
                    expires_at: 1795294444.0
                    key: {id: key-0f1e2d3c4b5a69788796aabb, name: notebook-maya-mbp, project: acme, expires_at: 1795294444.0, ephemeral: true}
                    email: maya@acme.com
                    workspace: {id: acme-inc, display_name: Acme Inc}
                    project: acme
                    url: https://app.generalforecast.com/?project=acme
        "400":
          description: "not yet, too soon, or no longer: the error's reason says which"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginErrorReply"
              examples:
                refused:
                  value:
                    error: {code: Unauthorized, message: waiting for browser approval, reason: authorization_pending}

