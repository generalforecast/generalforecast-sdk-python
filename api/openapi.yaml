    Origin:
      type: object
      description: "where a resource was made: the surface from the request's `X-GF-Origin` header (`api` when it sends none) and who made it"
      required: [surface, notebook, client, by]
      additionalProperties: false
      properties:
        surface:
          type: string
          enum: [console, cli, notebook, script, api]
        notebook:
          type:
          - string
          - "null"
          description: "jupyter, colab, hex, marimo, databricks or vscode, for a notebook"
        client:
          type:
          - string
          - "null"
          description: "the client's name and version, `generalforecast/1.0.0`"
        by:
          type:
          - string
          - "null"
          description: "the caller's email, or its key's id"

    ModelField:
      description: "a model by its short name, such as `tabicl-v2`, or its full id; a short name resolves to its family's entry for the task given, else the task inferred from the target column, else the family's only task"
      anyOf:
      - $ref: "#/components/schemas/ModelId"
      - $ref: "#/components/schemas/ModelName"

    Code:
      type: object
      description: "the same resource made in code: the SDK call, the `gf` command and a curl request"
      required: [python, cli, curl]
      additionalProperties: false
      properties:
        python: {type: string}
        cli: {type: string}
        curl: {type: string}

    Deleted:
      type: object
      required: [name, deleted]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        deleted: {type: boolean, const: true}

    LargeContext:
      type: object
      description: "the large-context line: GPU seconds past `large_context_cells` in the price book, and their cost"
      required: [gpu_seconds, credits, usd]
      additionalProperties: false
      properties:
        gpu_seconds: {type: number}
        credits: {type: number}
        usd: {type: number}

    Estimate:
      type: object
      description: |
        what a call or a run would cost from the live price book: model
        calls, scored rows, credits (1 credit is $0.001) and dollars. `calls`
        is the model calls the queries of each call decode in, as the
        engine's worker splits them by its shape buckets (the engine's
        `gf_engine.hosting.estimate_calls`); no model bounds the queries of
        a call, and an answered call's `timing.calls` says what it took
      required: [calls, rows, credits, usd]
      additionalProperties: false
      properties:
        calls: {type: integer, minimum: 0}
        rows: {type: integer, minimum: 0}
        credits: {type: number}
        usd: {type: number}
        large_context:
          $ref: "#/components/schemas/LargeContext"
        warnings:
          type: array
          items: {type: string}

    SourceKind:
      type: string
      enum: [bigquery, gcs, snowflake, databricks, s3, postgres]

    Column:
      type: object
      required: [name, type, missing, distinct]
      additionalProperties: false
      properties:
        name: {type: string}
        type:
          $ref: "#/components/schemas/ColumnType"
        missing: {type: integer, minimum: 0}
        distinct:
          type:
          - integer
          - "null"

    ContextData:
      type: object
      description: "an upload's announcement; the bytes follow in chunks unless the rows are unchanged"
      required: [format, bytes, digest]
      additionalProperties: false
      properties:
        format:
          type: string
          enum: [parquet, arrow, csv]
        bytes: {type: integer, minimum: 1}
        digest:
          $ref: "#/components/schemas/Digest"
          description: "the table's digest; rows equal to the latest version's answer `unchanged: true` and no bytes are sent"
        rows: {type: integer, minimum: 0}
        file:
          type:
          - string
          - "null"
          description: "the file the rows came from, for the console"

    ContextSourceRead:
      type: object
      description: "what a context reads from a source: one `table` or a `sql` query"
      required: [source]
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/Name"
        table: {type: string}
        sql: {type: string}

    ContextSource:
      type: object
      required: [source, kind, table, sql]
      additionalProperties: false
      properties:
        source:
          $ref: "#/components/schemas/Name"
        kind:
          $ref: "#/components/schemas/SourceKind"
        table:
          type:
          - string
          - "null"
        sql:
          type:
          - string
          - "null"

    ContextCreate:
      type: object
      description: "one origin: `data` (an upload, version 1), `source` (an import, or with `kind: live` a read at call time cached for `freshness_seconds`), or `kind: live` with `columns` for rows that arrive through `append`"
      required: [name, kind]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [snapshot, live]
        data:
          $ref: "#/components/schemas/ContextData"
        source:
          $ref: "#/components/schemas/ContextSourceRead"
        columns:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ColumnType"
        targets:
          type: array
          items: {type: string}
        id:
          type:
          - string
          - "null"
        time:
          type:
          - string
          - "null"
        freshness_seconds: {type: integer, minimum: 60, maximum: 86400}

    ContextUploadTarget:
      type: object
      required: [version, url, chunk_bytes]
      additionalProperties: false
      properties:
        version: {type: integer, minimum: 1}
        url:
          type:
          - string
          - "null"
          description: "a signed URL for the chunks, or null for the `bytes` route"
        chunk_bytes: {type: integer, minimum: 1}

    Context:
      type: object
      description: "the data a model learns from; `version` is the latest (or the one read), `upload` where an upload's chunks go"
      required: [name, kind, state, version, versions, digest, rows, columns, id, time, source, freshness_seconds, read_at, error, predictors, experiments, fine_tunes, origin, created, updated, url]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        kind:
          type: string
          enum: [snapshot, live]
        state:
          type: string
          enum: [uploading, importing, ready, failed]
        version:
          type:
          - integer
          - "null"
        versions: {type: integer, minimum: 0}
        digest:
          oneOf:
          - $ref: "#/components/schemas/Digest"
          - type: "null"
        rows:
          type:
          - integer
          - "null"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        id:
          type:
          - string
          - "null"
        time:
          type:
          - string
          - "null"
        targets:
          type: array
          items: {type: string}
        source:
          oneOf:
          - $ref: "#/components/schemas/ContextSource"
          - type: "null"
        freshness_seconds:
          type:
          - integer
          - "null"
        read_at:
          type:
          - string
          - "null"
          format: date-time
        error:
          type:
          - string
          - "null"
        predictors:
          type: array
          items:
            $ref: "#/components/schemas/Name"
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/Name"
        fine_tunes:
          type: array
          description: "the fine-tuned models made from it, by model id, as `acme/credit-default@ft3`"
          items: {type: string}
        origin:
          $ref: "#/components/schemas/Origin"
        created: {type: string, format: date-time}
        updated: {type: string, format: date-time}
        url: {type: string}
        file:
          type:
          - string
          - "null"
          description: "the file the version's upload came from, as `data.file` named it; null for one sent from memory, an import or a live context"
        upload:
          $ref: "#/components/schemas/ContextUploadTarget"
        unchanged:
          type: boolean
          description: "the upload's rows equal the latest version's, so no version was added"

    ContextUpload:
      type: object
      required: [data]
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/ContextData"

    ContextList:
      type: object
      required: [contexts]
      additionalProperties: false
      properties:
        contexts:
          type: array
          items:
            $ref: "#/components/schemas/Context"

    ContextVersionInfo:
      type: object
      required: [version, digest, rows, created, origin]
      additionalProperties: false
      properties:
        version: {type: integer, minimum: 1}
        digest:
          $ref: "#/components/schemas/Digest"
        rows: {type: integer, minimum: 0}
        created: {type: string, format: date-time}
        origin:
          $ref: "#/components/schemas/Origin"

    ContextVersions:
      type: object
      required: [versions]
      additionalProperties: false
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/ContextVersionInfo"

    Rows:
      type: object
      description: "a page of rows; `next` is the cursor for the page after, or null at the end"
      required: [columns, rows, next]
      additionalProperties: false
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/Row"
        next:
          type:
          - string
          - "null"

    Received:
      type: object
      description: the bytes of the version the service holds so far
      required: [received]
      additionalProperties: false
      properties:
        received: {type: integer, minimum: 0}

    Holdout:
      type: object
      description: "the rows held out to score: a random share or count (optionally stratified), whole groups of a column, the latest by time, or none"
      required: [kind]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [random, group, time, none]
        fraction: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
        rows: {type: integer, minimum: 1}
        column:
          type: string
          description: "the group column of a `group` holdout"
        until:
          type: string
          format: date
          description: "a `time` holdout's cutoff; left out, the latest `fraction` by time"
        stratify: {type: boolean}
        seed: {type: integer, minimum: 0}
        repeats: {type: integer, minimum: 1, maximum: 100}

    ExperimentSetup:
      type: object
      description: "an experiment's setup; `name` defaults to `<context>-<target>`, the task is inferred from the target, the holdout is the latest 20% by `time` when one is declared, else 20% at random"
      required: [context, target]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        title: {type: string}
        context:
          $ref: "#/components/schemas/Name"
        version: {type: integer, minimum: 1}
        target: {type: string}
        task:
          $ref: "#/components/schemas/Task"
        id: {type: string}
        time: {type: string}
        inputs:
          type: array
          items: {type: string}
        exclude:
          type: array
          items: {type: string}
        types:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ColumnType"
        holdout:
          $ref: "#/components/schemas/Holdout"
        sql:
          type: string
          description: "DuckDB over the pinned version, the context named as itself"

    ExperimentCreate:
      type: object
      description: "the setup, and the models of run 1: the recommended set when left out"
      required: [context, target]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        title: {type: string}
        context:
          $ref: "#/components/schemas/Name"
        version: {type: integer, minimum: 1}
        target: {type: string}
        task:
          $ref: "#/components/schemas/Task"
        id: {type: string}
        time: {type: string}
        inputs:
          type: array
          items: {type: string}
        exclude:
          type: array
          items: {type: string}
        types:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ColumnType"
        holdout:
          $ref: "#/components/schemas/Holdout"
        sql:
          type: string
          description: "DuckDB over the pinned version, the context named as itself"
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelField"
          minItems: 1
        dry_run: {type: boolean}

    ExperimentUpdate:
      type: object
      description: "the setup fields that change; earlier runs become `stale`"
      additionalProperties: false
      properties:
        title: {type: string}
        context:
          $ref: "#/components/schemas/Name"
        version: {type: integer, minimum: 1}
        target: {type: string}
        task:
          $ref: "#/components/schemas/Task"
        id: {type: string}
        time: {type: string}
        inputs:
          type: array
          items: {type: string}
        exclude:
          type: array
          items: {type: string}
        types:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ColumnType"
        holdout:
          $ref: "#/components/schemas/Holdout"
        sql:
          type: string
          description: "DuckDB over the pinned version, the context named as itself"

    Entry:
      type: object
      required: [model, short, state, score, interval, metrics, seconds, rows, credits, usd, error]
      additionalProperties: false
      properties:
        model:
          $ref: "#/components/schemas/ModelField"
        short:
          type:
          - string
          - "null"
        state:
          type: string
          enum: [queued, running, finished, failed, cancelled]
        score:
          type:
          - number
          - "null"
        interval:
          oneOf:
          - type: array
            items: {type: number}
            minItems: 2
          - type: "null"
        metrics:
          type: object
          additionalProperties: {type: number}
        seconds: {type: number}
        rows: {type: integer, minimum: 0}
        credits: {type: number}
        usd: {type: number}
        error:
          type:
          - string
          - "null"

    ExperimentRun:
      type: object
      description: "a run: its models scored on the held-out rows, best first; it pins the context digest, setup digest and model digests, and is `stale` once the setup moved"
      required: [experiment, number, state, stale, models, metric, lower_is_better, held_rows, context_rows, repeats, leaderboard, rows, credits, usd, created, started, finished, origin, error, url]
      additionalProperties: false
      properties:
        experiment:
          $ref: "#/components/schemas/Name"
        number: {type: integer, minimum: 1}
        state:
          type: string
          enum: [queued, running, finished, failed, cancelled]
        stale: {type: boolean}
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelId"
        metric: {type: string}
        lower_is_better: {type: boolean}
        held_rows: {type: integer, minimum: 0}
        context_rows: {type: integer, minimum: 0}
        repeats: {type: integer, minimum: 1}
        leaderboard:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        rows: {type: integer, minimum: 0}
        credits: {type: number}
        usd: {type: number}
        created: {type: string, format: date-time}
        started:
          type:
          - string
          - "null"
          format: date-time
        finished:
          type:
          - string
          - "null"
          format: date-time
        origin:
          $ref: "#/components/schemas/Origin"
        error:
          type:
          - string
          - "null"
        url: {type: string}

    ExperimentRunSummary:
      type: object
      required: [number, state, models, best, score, origin, created]
      additionalProperties: false
      properties:
        number: {type: integer, minimum: 1}
        state:
          type: string
          enum: [queued, running, finished, failed, cancelled]
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelId"
        best:
          type:
          - string
          - "null"
        score:
          type:
          - number
          - "null"
        origin:
          $ref: "#/components/schemas/Origin"
        created: {type: string, format: date-time}

    Experiment:
      type: object
      description: "models evaluated on one context for one target; `run` is the latest, or the one asked for"
      required: [name, title, context, context_version, target, task, id, time, inputs, types, holdout, sql, metric, runs, run, origin, created, updated, url]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        title: {type: string}
        context:
          $ref: "#/components/schemas/Name"
        context_version: {type: integer, minimum: 1}
        target: {type: string}
        task:
          $ref: "#/components/schemas/Task"
        id:
          type:
          - string
          - "null"
        time:
          type:
          - string
          - "null"
        inputs:
          type: array
          items: {type: string}
        types:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ColumnType"
        holdout:
          $ref: "#/components/schemas/Holdout"
        sql:
          type:
          - string
          - "null"
        metric: {type: string}
        runs:
          type: array
          items:
            $ref: "#/components/schemas/ExperimentRunSummary"
        run:
          oneOf:
          - $ref: "#/components/schemas/ExperimentRun"
          - type: "null"
        origin:
          $ref: "#/components/schemas/Origin"
        created: {type: string, format: date-time}
        updated: {type: string, format: date-time}
        url: {type: string}

    ExperimentPlan:
      type: object
      description: "a dry run: the setup as it resolves, and what run 1 would cost"
      required: [setup, estimate, warnings]
      additionalProperties: false
      properties:
        setup:
          $ref: "#/components/schemas/ExperimentSetup"
        estimate:
          $ref: "#/components/schemas/Estimate"
        warnings:
          type: array
          items: {type: string}

    ExperimentCreated:
      description: "the experiment with run 1 queued, or under `dry_run` its plan"
      oneOf:
      - $ref: "#/components/schemas/Experiment"
      - $ref: "#/components/schemas/ExperimentPlan"

    ExperimentList:
      type: object
      description: "the experiments, each without its run's leaderboard"
      required: [experiments, next]
      additionalProperties: false
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/Experiment"
        next:
          type:
          - string
          - "null"

    ExperimentRunCreate:
      type: object
      additionalProperties: false
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelField"
          minItems: 1
        dry_run: {type: boolean}

    ExperimentRunEstimate:
      type: object
      required: [estimate]
      additionalProperties: false
      properties:
        estimate:
          $ref: "#/components/schemas/Estimate"

    ExperimentRunCreated:
      oneOf:
      - $ref: "#/components/schemas/ExperimentRun"
      - $ref: "#/components/schemas/ExperimentRunEstimate"

    ExperimentRunList:
      type: object
      required: [runs]
      additionalProperties: false
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/ExperimentRun"

    Slice:
      type: object
      required: [column, value, rows, score, delta]
      additionalProperties: false
      properties:
        column: {type: string}
        value: {type: string}
        rows: {type: integer, minimum: 0}
        score: {type: number}
        delta: {type: number}

    SliceList:
      type: object
      required: [slices]
      additionalProperties: false
      properties:
        slices:
          type: array
          items:
            $ref: "#/components/schemas/Slice"

    HeldRows:
      type: object
      description: "the held-out rows with one model's predictions beside them"
      required: [model, rows, next]
      additionalProperties: false
      properties:
        model:
          $ref: "#/components/schemas/ModelField"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/Row"
        next:
          type:
          - string
          - "null"

    Spec:
      type: object
      description: "a predictor's spec: `gf.Predictor`'s fields but its name, as JSON"
      required: [context, model, target]
      additionalProperties: false
      properties:
        context:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,62}(@[1-9][0-9]{0,8})?$"
          description: "a stored context: `name` follows the latest version on each deploy, `name@version` pins one"
        model:
          $ref: "#/components/schemas/ModelField"
        target: {type: string}
        task:
          $ref: "#/components/schemas/Task"
        id: {type: string}
        time: {type: string}
        inputs:
          type: array
          items: {type: string}
          description: "the inputs; left out, every column without a role"
        exclude:
          type: array
          items: {type: string}
        types:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ColumnType"
        series:
          type: array
          items: {type: string}
        frequency:
          oneOf:
          - {type: string}
          - {type: number, exclusiveMinimum: 0}
        horizon: {type: integer, minimum: 1, maximum: 10000}
        quantiles:
          type: array
          items: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
        past:
          type: array
          items: {type: string}
        future:
          type: array
          items: {type: string}
        selection:
          $ref: "#/components/schemas/Selection"

    SpecPatch:
      type: object
      description: "the spec fields that change; `null` clears one"
      additionalProperties: false
      properties:
        context:
          oneOf:
          - type: string
            pattern: "^[a-z][a-z0-9-]{0,62}(@[1-9][0-9]{0,8})?$"
            description: "a stored context: `name` follows the latest version on each deploy, `name@version` pins one"
          - type: "null"
        model:
          oneOf:
          - $ref: "#/components/schemas/ModelField"
          - type: "null"
        target:
          oneOf:
          - {type: string}
          - type: "null"
        task:
          oneOf:
          - $ref: "#/components/schemas/Task"
          - type: "null"
        id:
          oneOf:
          - {type: string}
          - type: "null"
        time:
          oneOf:
          - {type: string}
          - type: "null"
        inputs:
          oneOf:
          - type: array
            items: {type: string}
            description: "the inputs; left out, every column without a role"
          - type: "null"
        exclude:
          oneOf:
          - type: array
            items: {type: string}
          - type: "null"
        types:
          oneOf:
          - type: object
            additionalProperties:
              $ref: "#/components/schemas/ColumnType"
          - type: "null"
        series:
          oneOf:
          - type: array
            items: {type: string}
          - type: "null"
        frequency:
          oneOf:
          - oneOf:
            - {type: string}
            - {type: number, exclusiveMinimum: 0}
          - type: "null"
        horizon:
          oneOf:
          - {type: integer, minimum: 1, maximum: 10000}
          - type: "null"
        quantiles:
          oneOf:
          - type: array
            items: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
          - type: "null"
        past:
          oneOf:
          - type: array
            items: {type: string}
          - type: "null"
        future:
          oneOf:
          - type: array
            items: {type: string}
          - type: "null"
        selection:
          oneOf:
          - $ref: "#/components/schemas/Selection"
          - type: "null"

    PredictorUpdate:
      type: object
      required: [spec, env]
      additionalProperties: false
      properties:
        spec:
          $ref: "#/components/schemas/SpecPatch"
        env:
          $ref: "#/components/schemas/Name"
        dry_run: {type: boolean}

    PredictorDeploy:
      type: object
      required: [spec, env]
      additionalProperties: false
      properties:
        spec:
          $ref: "#/components/schemas/Spec"
        env:
          $ref: "#/components/schemas/Name"
        dry_run: {type: boolean}

    Resolved:
      type: object
      description: "what a spec resolved to against its context version's rows, by the engine's `resolve`: the full model id and digest, the task, inputs and their types. A deploy compares these, so a short name and its full id are one predictor"
      required: [model, short, model_digest, base_digest, task, context, context_version, context_digest, inputs, types]
      additionalProperties: false
      properties:
        model:
          $ref: "#/components/schemas/ModelField"
        short:
          type:
          - string
          - "null"
        model_digest:
          $ref: "#/components/schemas/Digest"
        base_digest:
          oneOf:
          - $ref: "#/components/schemas/Digest"
          - type: "null"
          description: "for a derived model, a project's fine-tune, the digest of the base it was trained from, as its `derived.base_digest` gives it; null for a catalog model"
        task:
          $ref: "#/components/schemas/Task"
        context:
          $ref: "#/components/schemas/Name"
        context_version:
          type:
          - integer
          - "null"
        context_digest:
          oneOf:
          - $ref: "#/components/schemas/Digest"
          - type: "null"
        context_rows:
          type:
          - integer
          - "null"
          description: the rows of the pinned context version; null for a live context
        inputs:
          type: array
          items: {type: string}
        types:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ColumnType"

    Change:
      type: object
      required: [field, before, after]
      additionalProperties: false
      properties:
        field: {type: string}
        before:
          type:
          - string
          - "null"
        after:
          type:
          - string
          - "null"

    Deploy:
      type: object
      description: "what a create, update or deploy did; `unchanged` wrote nothing. The environment is `starting` until its replica is ready, which `environments.get` reports"
      required: [predictor, env, action, changes, revision, environment]
      additionalProperties: false
      properties:
        predictor:
          $ref: "#/components/schemas/Name"
        env:
          $ref: "#/components/schemas/Name"
        action:
          type: string
          enum: [created, updated, unchanged]
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
        revision:
          $ref: "#/components/schemas/Revision"
        environment:
          oneOf:
          - $ref: "#/components/schemas/Environment"
          - type: "null"

    PredictorInfo:
      type: object
      description: "a named, versioned endpoint: its latest revision's spec and each environment"
      required: [name, spec, resolved, revision, environments, origin, created, url]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        spec:
          $ref: "#/components/schemas/Spec"
        resolved:
          $ref: "#/components/schemas/Resolved"
        revision: {type: integer, minimum: 1}
        environments:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Environment"
        origin:
          $ref: "#/components/schemas/Origin"
        created: {type: string, format: date-time}
        url: {type: string}

    PredictorInfoList:
      type: object
      required: [predictors]
      additionalProperties: false
      properties:
        predictors:
          type: array
          items:
            $ref: "#/components/schemas/PredictorInfo"

    EstimateQuery:
      type: object
      required: [model, context_rows, queries]
      additionalProperties: false
      properties:
        model:
          $ref: "#/components/schemas/ModelField"
        task:
          $ref: "#/components/schemas/Task"
        context_rows: {type: integer, minimum: 1}
        queries: {type: integer, minimum: 1}
        inputs:
          type: integer
          minimum: 1
          description: "the context's input columns; a context's cells, its rows by its inputs, place it against the large-context line. Left out, a context is taken to have 32"

    Source:
      type: object
      description: "a workspace connection to a warehouse or bucket. Config keys by kind: bigquery `project, dataset, billing_project` (queries run and bill in billing_project, the dataset's project unless named); gcs `bucket, prefix`; snowflake `account, warehouse, database, role`; databricks `host, warehouse, client_id, catalog, schema` (client_id is the federated service principal's application id); s3 `role_arn, region, bucket, prefix`; postgres `host, port, database, user, tls`. A bucket's tables are its Parquet and CSV files and folders of their parts under the prefix"
      required: [name, kind, access, state, config, secret_expires, tested_at, tables, contexts, error, origin, created, url]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        kind:
          $ref: "#/components/schemas/SourceKind"
        access:
          type: string
          enum: [service_account, secret]
          description: how the plane reads it, as the workspace's service account or with the source's secret
        state:
          type: string
          enum: [untested, connected, unauthorized, not_found, unavailable, expired]
          description: |
            what the last test found: `connected`, or why not, `unauthorized`
            (the reader has no grant), `not_found` (no such location),
            `unavailable` (the warehouse did not answer) or `expired` (the
            secret has); `untested` before any test
        config:
          type: object
          additionalProperties: {type: string}
        secret_expires:
          type:
          - string
          - "null"
          format: date-time
        tested_at:
          type:
          - string
          - "null"
          format: date-time
        tables:
          type: [integer, "null"]
          minimum: 0
          description: how many tables the last test found; null before one
        contexts:
          type: integer
          minimum: 0
          description: how many of the project's contexts were made from it
        error:
          type:
          - string
          - "null"
          description: why the last test failed, else null
        origin:
          $ref: "#/components/schemas/Origin"
        created: {type: string, format: date-time}
        url: {type: string}

    SourceCreate:
      type: object
      required: [name, kind, config]
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/Name"
        kind:
          $ref: "#/components/schemas/SourceKind"
        config:
          type: object
          additionalProperties: {type: string}
        secret:
          type: string
          description: "stored as the managed secret `source-<name>`, never returned"

    SourceTable:
      type: object
      description: a table of the source's location, as the warehouse lists it
      required: [name, type, readable]
      additionalProperties: false
      properties:
        name: {type: string, description: the table's name within the dataset}
        type: {type: string, description: "the warehouse's kind of table, such as `TABLE`, `VIEW` or `MODEL`; a bucket's `PARQUET`, `CSV` or `FOLDER`"}
        readable: {type: boolean, description: whether a context can be made of it}

    SourceTables:
      type: object
      description: |
        the tables of the source's location, whose names start with
        `prefix`; `location` is where they are, as a person writes it
        (`project.dataset`, `gs://bucket/prefix/`, `s3://bucket/prefix/`,
        `catalog.schema`); `more` says the location holds more than were
        listed
      required: [location, tables, more]
      additionalProperties: false
      properties:
        location: {type: string}
        tables:
          type: array
          items:
            $ref: "#/components/schemas/SourceTable"
        more: {type: boolean}

    SourcePreview:
      type: object
      description: "one `table` or one `sql` query; the answer is its first 20 rows"
      additionalProperties: false
      properties:
        table: {type: string}
        sql: {type: string}

    KeyDeleted:
      type: object
      required: [id, deleted]
      additionalProperties: false
      properties:
        id: {type: string}
        deleted: {type: boolean, const: true}

