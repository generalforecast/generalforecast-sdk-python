                        episode_sampling: {rows: 4096}
                        episodes_per_step: 8
                    tags: [recipe:curriculum-v1]
              architecture:
                summary: TabICL v2 with a gated log scale in place of QASSMax, under LoRA
                value:
                  api_version: gf/v1
                  project: acme
                  request_id: r-367c1e9a2b4d6f8031a5c7e9b2d4f6a8
